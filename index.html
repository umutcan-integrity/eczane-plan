        if (nh <= .01) c.visible = false; else { c.scale.y = nh / hh; c.position.y = y0 + nh / 2; }
      } else if ((c.userData.signSeg && facing(c.userData.signSeg)) || (c.userData.pick && c.userData.pick.k === 'item' && (() => { const it = P.items.find(i => i.id === c.userData.pick.id); return it && isOpening(it) && facing(wallOf(it, Ed.segs)); })())) {
        list.push([c, c.scale.y, c.position.y, c.visible]); c.visible = false;
      }
    }
    return list;
  },
  uncut(list) { for (const [c, sy, py, v] of list) { c.scale.y = sy; c.position.y = py; c.visible = v; } },
  /* Otomatik tur: kind = 'orbit' (360°) | 'walk' (girişten içeri) */
  async recordTour(kind, {w, h, seconds, onProgress, isCancelled}) {
    await this.ready3d();
    const mime = this.videoMime(); if (mime === null) throw new Error('Bu tarayıcı video kaydını desteklemiyor');
    const T = this.T, R = this.R, P = Ed.P;
    const saved = {mode: this.mode, orb: this.orb ? {...this.orb} : null, wk: {...this.wk}, pr: R.getPixelRatio()};
    this.recording = true; this.stopLoop();
    const hidden = [];
    R.setPixelRatio(1); R.setSize(w, h, false); this.cam.aspect = w / h; this.cam.updateProjectionMatrix();
    this.mode = kind === 'walk' ? 'walk' : 'orbit'; this.lightMode();
    if (this.selHelper) { hidden.push(this.selHelper); this.selHelper.visible = false; }
    for (const c of this.root.children) if (c.userData.clearZone || c.userData.zoneItem || c.userData.label) { if (c.visible) { hidden.push(c); c.visible = false; } }
    // Yol
    const base = this.fitOrbit(w / h, 'iso');
    const ent = this.entrancePose();
    const ix = Math.sin(ent.yaw), iz = -Math.cos(ent.yaw);
    const door = [ent.x - ix * .7, ent.z - iz * .7];
    const depth = Math.abs(ix) > .5 ? P.shop.w : P.shop.d;
    const p0 = [door[0] - ix * 4, door[1] - iz * 4], p2 = [door[0] + ix * Math.min(depth * .5, 4.5), door[1] + iz * Math.min(depth * .5, 4.5)];
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const pose = p => {
      if (kind === 'orbit') {
        this.orb = Object.assign({}, base, {theta: base.theta + Math.PI * 2 * p, phi: .88 + Math.sin(p * Math.PI * 2) * .1});
        return;
      }
      const k = this.wk;
      if (p < .45) { const t = ease(p / .45); k.x = p0[0] + (p2[0] - p0[0]) * t; k.z = p0[1] + (p2[1] - p0[1]) * t; k.yaw = ent.yaw; k.pitch = .12 - .2 * t; k.bob = t * 40; }
      else { const t = (p - .45) / .55; k.x = p2[0]; k.z = p2[1]; k.yaw = ent.yaw + Math.sin(t * Math.PI * 2) * 1.05; k.pitch = -.08; k.bob = 0; }
    };
    const stream = this.cv.captureStream(30);
    const rec = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: Math.round(w * h * 30 * .14)} : undefined);
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise(r => { rec.onstop = r; });
    let cut = [];
    try {
      rec.start(500);
      const t0 = performance.now();
      await new Promise(resolve => {
        const step = () => {
          const p = Math.min(1, (performance.now() - t0) / 1000 / seconds);
          pose(p); this.uncut(cut); this.applyCam();
          if (kind === 'orbit') cut = this.cutFacing();
          R.render(this.scene, this.cam);
          if (onProgress) onProgress(p);
          if (p >= 1 || (isCancelled && isCancelled())) resolve(); else requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
      rec.stop(); await done;
    } finally {
      this.uncut(cut);
      hidden.forEach(n => { n.visible = true; });
      this.mode = saved.mode; this.orb = saved.orb; Object.assign(this.wk, saved.wk);
      R.setPixelRatio(saved.pr); this.resize(); this.lightMode();
      this.recording = false; this.req();
    }
    if (isCancelled && isCancelled()) return null;
    return new Blob(chunks, {type: (mime || 'video/webm').split(';')[0]});
  },
  /* Canlı kayıt: kullanıcı gezerken ekrandaki 3B görüntüyü kaydeder */
  startLive() {
    const mime = this.videoMime(); if (mime === null) throw new Error('Bu tarayıcı video kaydını desteklemiyor');
    const stream = this.cv.captureStream(30);
    const rec = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: 6e6} : undefined);
    const chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise(r => { rec.onstop = r; });
    rec.start(500);
    // görüntü değişmese de kare üretmek için sürekli çiz
    this.liveRec = true;
    const tick = () => { if (!this.liveRec) return; this.render(); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    return {stop: async () => { this.liveRec = false; try { rec.requestData(); } catch (e) {} await new Promise(r => setTimeout(r, 300)); rec.stop(); await done; return new Blob(chunks, {type: (mime || 'video/webm').split(';')[0]}); }};
  },
  snapshot() { this.render(); return this.cv.toDataURL('image/png'); },
};

/* Dışbükey çokgenden daireyi dışarı it; gerekirse [dx, dy] döndürür */
function pushOut(poly, x, y, R) {
  const bb = polyBox(poly);
  if (x < bb.x0 - R || x > bb.x1 + R || y < bb.y0 - R || y > bb.y1 + R) return null;
  let inside = true, best = Infinity, bx = 0, by = 0, ex = 0, ey = 0, minPen = Infinity;
  const n = poly.length;
  // yön: saat yönü / tersi fark etmesin
  let area = 0; for (let i = 0; i < n; i++) { const [a, b] = poly[i], [c, d] = poly[(i + 1) % n]; area += a * d - c * b; }
  const sg = area > 0 ? 1 : -1;
  for (let i = 0; i < n; i++) {
    const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % n];
    const vx = x2 - x1, vy = y2 - y1, L2 = vx * vx + vy * vy || 1e-9;
    let t = ((x - x1) * vx + (y - y1) * vy) / L2; t = clamp(t, 0, 1);
    const px = x1 + vx * t, py = y1 + vy * t, dd = Math.hypot(x - px, y - py);
    if (dd < best) { best = dd; bx = px; by = py; }
    // dış normal
    const L = Math.sqrt(L2), nx = sg * vy / L, ny = -sg * vx / L;
    const side = (x - x1) * nx + (y - y1) * ny;
    if (side > 0) inside = false;
    if (-side < minPen) { minPen = -side; ex = nx; ey = ny; }
  }
  if (inside) return [ex * (minPen + R), ey * (minPen + R)];
  if (best >= R) return null;
  const k = (R - best) / (best || 1e-9);
  return [(x - bx) * k, (y - by) * k];
}

const Ed = {
  P: null, segs: [], A: {bad: new Set(), zoneBad: new Set(), issues: []}, sel: null, tool: 'select', view: '2d',
  hist: [], fut: [], dirty: false, saveTimer: 0, _ck: null, _ct: 0, multi: [],

  open(id) {
    const p = Store.load(id);
    if (!p) { toast('Proje bulunamadı', 'err'); Router.home(); return false; }

  },
  async close() {
    if (!this.P) return true;

  },
  snap() { const P = this.P; return JSON.stringify({name: P.name, sign: P.sign, floor: P.floor, kroki: P.kroki, shop: P.shop, rooms: P.rooms, items: P.items}); },
  restore(str) {
    const o = JSON.parse(str);
    Object.assign(this.P, {name: o.name, floor: o.floor, shop: o.shop, rooms: o.rooms, items: o.items});
    if (o.kroki) this.P.kroki = o.kroki; else delete this.P.kroki;
    if (o.sign === undefined) delete this.P.sign; else this.P.sign = o.sign;
    if (this.sel && !this.objOf(this.sel)) this.sel = null;

    $('#pnameText').textContent = this.P.name;
  },
  recompute() { this.segs = computeWalls(this.P); this.A = analyze(this.P, this.segs); },
  /* Sürükleme sırasında (geçmişe yazmadan) */
  live() { this.recompute(); Plan.req(); Props.sync(); },
  change(fn, key) { const b = this.snap(); fn(); return this.commit(b, key); },
  commit(before, key) {
    const now = this.snap();
    if (now === before) { this.recompute(); Plan.req(); return false; }
    const t = Date.now();
    if (!(key && key === this._ck && t - this._ct < 1500)) { this.hist.push(before); if (this.hist.length > 200) this.hist.shift(); }
    this._ck = key; this._ct = t; this.fut = [];

  },
  touch(full) {
    this.recompute();
    this.dirty = true; this.updateSaveUI(); this.updateUndoUI();

  },
  undo() {

  },
  redo() {

  updateUndoUI() { $('#btnUndo').disabled = !this.hist.length; $('#btnRedo').disabled = !this.fut.length; },

  objOf(sel) {

  },
  selObj() { return this.objOf(this.sel); },
  select(sel) {

  },
  /* ---------- Çoklu seçim (Ctrl/Shift ile) ---------- */
  multiObjs() { return this.multi.map(id => this.P.items.find(i => i.id === id)).filter(Boolean); },
  setMulti(ids) {
    ids = [...new Set(ids)].filter(id => this.P.items.some(i => i.id === id));
    if (ids.length <= 1) { this.select(ids.length ? {k: 'item', id: ids[0]} : null); return; }

  },
  toggleMulti(id) {
    const ids = new Set(this.multi.length ? this.multi : (this.sel && this.sel.k === 'item' ? [this.sel.id] : []));
    if (ids.has(id)) ids.delete(id); else ids.add(id);
    this.setMulti([...ids]);
  },
  selectAll() { this.setMulti(this.P.items.filter(i => i.type !== 'zone').map(i => i.id)); },
  groupBox(its) { return its.reduce((b, it) => { const q = itemBox(it); return {x0: Math.min(b.x0, q.x0), y0: Math.min(b.y0, q.y0), x1: Math.max(b.x1, q.x1), y1: Math.max(b.y1, q.y1)}; }, {x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity}); },
  /* Hizalama: l, cx, r, t, cy, b; dağıtma: dh, dv */
  align(mode) {
    const its = this.multiObjs(); if (its.length < 2) return;
    const B = this.groupBox(its);
    this.change(() => {
      if (mode === 'dh' || mode === 'dv') {
        const h = mode === 'dh', sorted = [...its].sort((a, b) => h ? a.cx - b.cx : a.cy - b.cy);
        const sizes = sorted.map(it => { const b = itemBox(it); return h ? b.x1 - b.x0 : b.y1 - b.y0; });
        const total = sizes.reduce((a, b) => a + b, 0), span = h ? B.x1 - B.x0 : B.y1 - B.y0, gap = (span - total) / (sorted.length - 1);
        let pos = h ? B.x0 : B.y0;
        sorted.forEach((it, i) => { const c = pos + sizes[i] / 2; if (h) it.cx = r3(c); else it.cy = r3(c); pos += sizes[i] + gap; });
        return;
      }
      for (const it of its) {
        const [hx, hy] = halfExt(it);
        if (mode === 'l') it.cx = r3(B.x0 + hx); if (mode === 'r') it.cx = r3(B.x1 - hx); if (mode === 'cx') it.cx = r3((B.x0 + B.x1) / 2);
        if (mode === 't') it.cy = r3(B.y0 + hy); if (mode === 'b') it.cy = r3(B.y1 - hy); if (mode === 'cy') it.cy = r3((B.y0 + B.y1) / 2);
      }
    });
  },
  setTool(t) {
    this.tool = t;
    $$('#tools2d [data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
    $$('#dock [data-dock]').forEach(b => b.classList.toggle('on', b.dataset.dock === t));
    if (t !== 'measure') Plan.measure = null;
    const pill = $('#hintPill');
    if (t === 'room') { $('#hintText').textContent = 'Oda çizmek için köşeden köşeye sürükle'; pill.hidden = false; }
    else if (t === 'measure') { $('#hintText').textContent = 'Ölçmek için iki nokta arasında sürükle'; pill.hidden = false; }
    else pill.hidden = true;

  },
  setView(v, quiet) {
    this.view = v;

    $('#dock').style.display = is3 ? 'none' : '';

  /* ---------- Ekleme ---------- */
  viewCenter() {
    const [x, y] = Plan.toW(Plan.w / 2, Plan.h / 2 + (isMobile() ? 0 : 10));
    return [clamp(x, 0.5, this.P.shop.w - 0.5), clamp(y, 0.5, this.P.shop.d - 0.5)];
  },
  addFromCatalog(e, at) {
    if (!e || !this.P) return;
    if (e.tool) { this.setTool(e.tool); Sheets.closeAll(); return; }
    if (this.view !== '2d') this.setView('2d');
    const [x, y] = at || this.viewCenter();
    if (e.room) {
      const w = e.room.w, d = e.room.d;
      this.addRoom({x: Math.round((x - w / 2) / GRID) * GRID, y: Math.round((y - d / 2) / GRID) * GRID, w, d});
      Sheets.closeAll(); return;
    }
    const it = makeItem(e, x, y);
    it.id = nextId(this.P, 'i');
    if (it.type === 'column') it.h = this.P.shop.h;
    let placedAtWindow = false;
    if (e.s === 'wstand') placedAtWindow = this.placeAtWindow(it, x, y);
    if (placedAtWindow) { /* vitrin camının önüne yerleşti */ }
    else if (isOpening(it)) {
      const seg = nearestWall(this.segs, x, y, Infinity);
      if (seg) { seatOnWall(it, seg, seg.h ? x : y, true); it.cx = r3(it.cx); it.cy = r3(it.cy); }
    } else {
      const [hx, hy] = halfExt(it);
      it.cx = r3(Math.round((it.cx - hx) / GRID) * GRID + hx); it.cy = r3(Math.round((it.cy - hy) / GRID) * GRID + hy);
    }
    this.change(() => this.P.items.push(it));
    this.select({k: 'item', id: it.id});
    Sheets.closeAll();
    if (isOpening(it)) toast(`${it.name} en yakın duvara yerleşti · sürükleyerek duvar boyunca kaydır`);
    if (placedAtWindow) toast('Cam önü stand en yakın vitrin camının önüne yerleşti');
  },
  /* Cam önü stand: en yakın pencerenin içine, önü cama bakacak şekilde */
  placeAtWindow(it, x, y) {
    const wins = this.P.items.filter(i => i.type === 'window').map(i => ({i, s: wallOf(i, this.segs)})).filter(o => o.s);
    if (!wins.length) return false;
    wins.sort((a, b) => Math.hypot(a.i.cx - x, a.i.cy - y) - Math.hypot(b.i.cx - x, b.i.cy - y));
    const {i: win, s} = wins[0];
    let inward = s.outer ? (s.c < 0 ? 1 : -1) : ((s.h ? y : x) > s.c ? 1 : -1);
    it.w = r3(clamp(win.w - .1, .6, 3));
    const off = s.t / 2 + .1 + it.d / 2;
    if (s.h) { it.cx = win.cx; it.cy = r3(s.c + inward * off); it.rot = inward > 0 ? 180 : 0; }
    else { it.cy = win.cy; it.cx = r3(s.c + inward * off); it.rot = inward > 0 ? 90 : 270; }
    return true;
  },
  addRoom(r) {
    const P = this.P, n = P.rooms.length;
    const room = {id: nextId(P, 'r'), name: 'Oda ' + (n + 1), x: r3(r.x), y: r3(r.y), w: r3(r.w), d: r3(r.d), color: ROOM_COLORS[n % ROOM_COLORS.length]};
    this.change(() => P.rooms.push(room));
    this.select({k: 'room', id: room.id});
  },

  /* ---------- Seçim komutları ---------- */
  duplicate() {
    if (this.multi.length) {
      const its = this.multiObjs(), B = this.groupBox(its), P = this.P;
      const wB = B.x1 - B.x0, dB = B.y1 - B.y0;
      const [dx, dy] = B.x1 + wB <= P.shop.w ? [wB, 0] : B.y1 + dB <= P.shop.d ? [0, dB] : [.3, .3];
      const copies = its.map(it => Object.assign({}, it, {id: nextId(P, 'i'), cx: r3(it.cx + dx), cy: r3(it.cy + dy)}));
      this.change(() => P.items.push(...copies));
      this.setMulti(copies.map(c => c.id)); toast(`${copies.length} öğe kopyalandı`);
      return;
    }
    const o = this.selObj(); if (!o) return;
    const P = this.P;
    if (this.sel.k === 'room') {
      const r = Object.assign({}, o, {id: nextId(P, 'r'), name: o.name + ' 2'});
      r.x = r3(o.x + o.w <= P.shop.w - o.w ? o.x + o.w : o.x); r.y = r3(r.x === o.x ? o.y + o.d : o.y);
      this.change(() => P.rooms.push(r)); this.select({k: 'room', id: r.id}); return;
    }
    const it = Object.assign({}, o, {id: nextId(P, 'i')});
    if (isOpening(o)) {
      const s = wallOf(o, this.segs);
      if (s) seatOnWall(it, s, (s.h ? o.cx : o.cy) + o.w + .3);
      else { it.cx += .3; it.cy += .3; }
    } else {
      const [dx, dy] = rotPt(o.w, 0, o.rot); // yanına, bitişik
      it.cx = r3(o.cx + dx); it.cy = r3(o.cy + dy);
    }
    this.change(() => P.items.push(it)); this.select({k: 'item', id: it.id});
  },
  remove() {
    if (this.multi.length) {
      const ids = new Set(this.multi), n = ids.size;
      this.change(() => { this.P.items = this.P.items.filter(i => !ids.has(i.id)); });
      this.select(null); toast(`${n} öğe silindi · geri almak için ↶`); return;
    }
    const o = this.selObj(); if (!o) return;
    const k = this.sel.k;
    this.change(() => { if (k === 'room') this.P.rooms = this.P.rooms.filter(r => r !== o); else this.P.items = this.P.items.filter(i => i !== o); });
    this.select(null);
    toast(`${o.name || 'Öğe'} silindi · geri almak için ↶`);
  },
  rotate(delta = 90) {
    if (this.multi.length) { // grubu merkezi etrafında döndür
      const its = this.multiObjs(), B = this.groupBox(its), cx = (B.x0 + B.x1) / 2, cy = (B.y0 + B.y1) / 2;
      this.change(() => { for (const it of its) { const [x, y] = rotPt(it.cx - cx, it.cy - cy, delta); it.cx = r3(cx + x); it.cy = r3(cy + y); it.rot = normRot(it.rot + delta); } });
      return;
    }
    const o = this.selObj(); if (!o || this.sel.k === 'room') return;
    if (isOpening(o) && wallOf(o, this.segs)) { this.cycleSwing(); return; }
    this.change(() => { o.rot = normRot(o.rot + delta); });

  /* Kapı açılış yönü: menteşe sağ/sol × bu taraf/öbür taraf */
  cycleSwing() {
    const o = this.selObj(); if (!o) return;
    this.change(() => {
      if (o.type === 'window' || o.style === 'double' || o.style === 'sliding') { o.rot = normRot(o.rot + 180); return; }

  setSwing(rot, flip) { const o = this.selObj(); if (!o) return; this.change(() => { o.rot = rot; o.flip = flip; }); Props.render(); },

    const o = this.selObj(); if (!o) return;
    this.change(() => {
      if (this.sel.k === 'room') { o.x = r3(o.x + dx); o.y = r3(o.y + dy); }
      else { o.cx = r3(o.cx + dx); o.cy = r3(o.cy + dy); }

  },
  openProps(focus) {
    Sheets.open('sheetProps');
    if (focus && !isMobile()) setTimeout(() => { const i = $('#props input[type=text]'); if (i) { i.focus(); i.select(); } }, 30);
  },
  async rename() {
    const n = await askText('Projeyi yeniden adlandır', this.P.name, 'Proje adı');
    if (n == null || !n.trim()) return;
    this.change(() => { this.P.name = n.trim().slice(0, 60); });

};

/* ---------- Seçim üstü hızlı araç çubuğu ---------- */
const Ctx = {
  place() {
    const bar = $('#ctxbar'); if (!bar) return;
    const o = Ed.selObj();
    const act = Plan.act && ['move', 'resize', 'rotate', 'pinch', 'pan', 'gmove', 'marquee'].includes(Plan.act.type) && Plan.act.moved !== false;
    if (Ed.multi.length && Ed.view === '2d' && !act) {
      const B = Ed.groupBox(Ed.multiObjs());
      const rotBtn = bar.querySelector('[data-act=rotate]'); rotBtn.hidden = false; rotBtn.querySelector('.lbl').textContent = 'Döndür';
      bar.hidden = false;
      const [x0, y0] = Plan.toS(B.x0, B.y0), [x1, y1] = Plan.toS(B.x1, B.y1), bw = bar.offsetWidth, bh = bar.offsetHeight;
      let top = y0 - bh - 18; if (top < 58) top = y1 + 34;
      if (top + bh > Plan.h - 8) top = Math.max(58, Plan.h - bh - 8);
      bar.style.transform = `translate(${Math.round(clamp((x0 + x1) / 2 - bw / 2, 8, Plan.w - bw - 8))}px,${Math.round(top)}px)`;
      return;
    }
    if (!o || Ed.view !== '2d' || act) { bar.hidden = true; return; }
    const isRoom = Ed.sel.k === 'room';
    const rotBtn = bar.querySelector('[data-act=rotate]');

    const door = !isRoom && isOpening(o) && wallOf(o, Ed.segs);
    rotBtn.querySelector('.lbl').textContent = door ? 'Yönü çevir' : 'Döndür';
    rotBtn.title = door ? 'Açılış yönünü çevir (R)' : '90° döndür (R)';

    if (isRoom) box = roomBox(o); else box = polyBox(itemPoly(o));
    const [x0, y0] = Plan.toS(box.x0, box.y0), [x1, y1] = Plan.toS(box.x1, box.y1);

/* ---------- DOM yardımcıları ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}

  /* Dört küçük plan çizimi: menteşe × açılış tarafı */
  swingPicker(it) {
    const base = quarter(it.rot) % 2 === 0 ? 0 : 90;
    const opts = [[base, false], [base, true], [base + 180, false], [base + 180, true]];
    const wrap = h('div', {class: 'swing'});
    for (const [rot, flip] of opts) {
      const on = Math.abs(normRot(rot) - normRot(it.rot)) < 1 && !!flip === !!it.flip;
      const fake = {cx: 0, cy: 0, w: 1, d: .12, rot: normRot(rot), flip, style: it.style};
      const S = (lx, ly) => { const [x, y] = toWorld(fake, lx, ly); return [(x * 26 + 32).toFixed(1), (y * 26 + 32).toFixed(1)]; };
      const y = .06;
      const wallA = S(-1.2, 0), wallB = S(-.5, 0), wallC = S(.5, 0), wallD = S(1.2, 0);
      const leaves = it.style === 'double' ? [[-.5, .5, 1], [.5, .5, -1]] : [[flip ? .5 : -.5, 1, flip ? -1 : 1]];
      let path = '';
      for (const [hx, L, dir] of leaves) {
        const arc = [];
        for (let i = 0; i <= 10; i++) { const a = Math.PI / 2 * (1 - i / 10); arc.push(S(hx + dir * Math.cos(a) * L, y + Math.sin(a) * L).join(',')); }
        path += `<path d="M${S(hx, y)} L${S(hx, y + L)}" stroke-width="2.6"/><polyline points="${arc.join(' ')}" stroke-dasharray="3 2"/>`;
      }
      const svg = `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M${wallA} L${wallB} M${wallC} L${wallD}" stroke-width="5" stroke="var(--plan-wall)"/>${path}</svg>`;
      wrap.append(h('button', {type: 'button', class: on ? 'on' : '', title: 'Bu yönü seç', onclick: () => Ed.setSwing(normRot(rot), flip), html: svg}));
    }
    return wrap;
  },
};

/* =====================================================================
   Kroki (rölöve planı): A4 dikey, ölçekli, siyah-beyaz; il/ilçe sağlık
   müdürlüğü başvurularındaki biçimde. PDF (A4) ve PNG olarak verilir.
   ===================================================================== */

const KROKI_FONT = 'Arial, "Helvetica Neue", Helvetica, "Liberation Sans", "DejaVu Sans", sans-serif';
const fm2 = v => (Math.round(v * 100) / 100).toFixed(2).replace('.', ',');

const Kroki = {
  opts(P) {
    const sign = (P.sign ?? P.name ?? '').trim().toLocaleUpperCase('tr-TR');
    const name = sign ? (/ECZANE/.test(sign) ? sign : sign + ' ECZANESİ') : '';
    return Object.assign({title: 'ECZANE RÖLÖVE PLANI', name, pharmacist: '', address: '', scale: 'auto', rot: 'auto', north: 0, sign: true, items: true, salesName: 'ECZANE SATIŞ ALANI'}, P.kroki || {});
  },

  /* Net alanlar: 2 cm ızgarada duvar/kolon düşülerek hesaplanır */
  areas(P, segs) {
    const W = P.shop.w, D = P.shop.d, c = .02, nx = Math.max(1, Math.ceil(W / c)), ny = Math.max(1, Math.ceil(D / c));
    const g = new Int16Array(nx * ny);
    const fill = (x0, y0, x1, y1, v) => {
      const i0 = clamp(Math.round(x0 / c), 0, nx), i1 = clamp(Math.round(x1 / c), 0, nx), j0 = clamp(Math.round(y0 / c), 0, ny), j1 = clamp(Math.round(y1 / c), 0, ny);
      for (let j = j0; j < j1; j++) g.fill(v, j * nx + i0, j * nx + i1);
    };
    const rooms = P.rooms.map((r, i) => ({r, i})).sort((a, b) => b.r.w * b.r.d - a.r.w * a.r.d);
    for (const {r, i} of rooms) fill(r.x, r.y, r.x + r.w, r.y + r.d, i + 1);
    for (const w of wallPieces(segs, () => false)) fill(w.x0, w.y0, w.x1, w.y1, -1);
    for (const it of P.items) if (it.type === 'column') { const b = itemBox(it); fill(b.x0, b.y0, b.x1, b.y1, -1); }
    const cnt = new Float64Array(P.rooms.length + 1);
    for (let k = 0; k < g.length; k++) if (g[k] >= 0) cnt[g[k]]++;
    const a = c * c;
    // Satış alanı etiketi için duvarlardan en uzak nokta (pah mesafe dönüşümü)
    let pole = null;
    if (cnt[0] > 0) {
      const INF = 1e9, d = new Float32Array(nx * ny);
      for (let k = 0; k < d.length; k++) d[k] = g[k] === 0 ? INF : 0;
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        const k = j * nx + i; if (!d[k]) continue;
        let v = Math.min(d[k], i + 1, j + 1);
        if (i) v = Math.min(v, d[k - 1] + 1); if (j) v = Math.min(v, d[k - nx] + 1);
        if (i && j) v = Math.min(v, d[k - nx - 1] + 1.4); if (j && i < nx - 1) v = Math.min(v, d[k - nx + 1] + 1.4);
        d[k] = v;
      }
      let best = -1;
      for (let j = ny - 1; j >= 0; j--) for (let i = nx - 1; i >= 0; i--) {
        const k = j * nx + i; if (!d[k]) continue;
        let v = Math.min(d[k], nx - i, ny - j);
        if (i < nx - 1) v = Math.min(v, d[k + 1] + 1); if (j < ny - 1) v = Math.min(v, d[k + nx] + 1);
        if (i < nx - 1 && j < ny - 1) v = Math.min(v, d[k + nx + 1] + 1.4); if (i && j < ny - 1) v = Math.min(v, d[k + nx - 1] + 1.4);
        d[k] = v;
        if (v > best) { best = v; pole = [(i + .5) * c, (j + .5) * c]; }
      }
    }
    const roomAreas = P.rooms.map((r, i) => ({r, a: cnt[i + 1] * a}));
    const sales = cnt[0] * a;
    return {sales, rooms: roomAreas, useful: sales + roomAreas.reduce((s, x) => s + x.a, 0), net: W * D, pole};
  },

  /* Etiket yerleri: her bölgede duvar ve eşyalardan en uzak nokta (5 cm ızgara) */
  labelPoints(P, segs) {
    const W = P.shop.w, D = P.shop.d, c = .05, nx = Math.max(1, Math.ceil(W / c)), ny = Math.max(1, Math.ceil(D / c));
    const g = new Int16Array(nx * ny);
    const fill = (x0, y0, x1, y1, v) => {
      const i0 = clamp(Math.floor(x0 / c), 0, nx), i1 = clamp(Math.ceil(x1 / c), 0, nx), j0 = clamp(Math.floor(y0 / c), 0, ny), j1 = clamp(Math.ceil(y1 / c), 0, ny);
      for (let j = j0; j < j1; j++) g.fill(v, j * nx + i0, j * nx + i1);
    };
    P.rooms.map((r, i) => ({r, i})).sort((a, b) => b.r.w * b.r.d - a.r.w * a.r.d).forEach(({r, i}) => fill(r.x, r.y, r.x + r.w, r.y + r.d, i + 1));
    for (const w of wallPieces(segs, () => false)) fill(w.x0, w.y0, w.x1, w.y1, -1);
    for (const it of P.items) if (it.type !== 'zone' && it.type !== 'human') { const b = itemBox(it); fill(b.x0 - .05, b.y0 - .05, b.x1 + .05, b.y1 + .05, -1); }
    const out = [];
    const d = new Float32Array(nx * ny);
    for (let v = 0; v <= P.rooms.length; v++) {
      for (let k = 0; k < d.length; k++) d[k] = g[k] === v ? 1e9 : 0;
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        const k = j * nx + i; if (!d[k]) continue;
        let t = Math.min(d[k], i + 1, j + 1);
        if (i) t = Math.min(t, d[k - 1] + 1); if (j) t = Math.min(t, d[k - nx] + 1);
        if (i && j) t = Math.min(t, d[k - nx - 1] + 1.41); if (j && i < nx - 1) t = Math.min(t, d[k - nx + 1] + 1.41);
        d[k] = t;
      }
      let best = 0, pt = null;
      for (let j = ny - 1; j >= 0; j--) for (let i = nx - 1; i >= 0; i--) {
        const k = j * nx + i; if (!d[k]) continue;
        let t = Math.min(d[k], nx - i, ny - j);
        if (i < nx - 1) t = Math.min(t, d[k + 1] + 1); if (j < ny - 1) t = Math.min(t, d[k + nx] + 1);
        if (i < nx - 1 && j < ny - 1) t = Math.min(t, d[k + nx + 1] + 1.41); if (i && j < ny - 1) t = Math.min(t, d[k + nx - 1] + 1.41);
        d[k] = t;
        if (t > best) { best = t; pt = [(i + .5) * c, (j + .5) * c]; }
      }
      out.push(pt ? {x: pt[0], y: pt[1], r: best * c} : null);
    }
    return out;
  },

  /* Giriş kapısı ve hangi dış kenarda olduğu */
  entrance(P, segs) {
    const doors = P.items.filter(it => it.type === 'door').map(it => ({it, s: wallOf(it, segs)})).filter(o => o.s && o.s.outer);
    doors.sort((a, b) => (b.it.style === 'double') - (a.it.style === 'double') || b.it.w - a.it.w);
    if (!doors.length) return null;
    const {it, s} = doors[0];
    const side = s.h ? (s.c < 0 ? 't' : 'b') : (s.c < 0 ? 'l' : 'r');
    const out = {t: [0, -1], b: [0, 1], l: [-1, 0], r: [1, 0]}[side];
    return {it, s, side, out};
  },

  label(it) {
    if (/reçete/i.test(it.name)) return {small: it.name.toLocaleLowerCase('tr-TR')};
    switch (it.type) {
      case 'counter': return {t: 'BANKO'};
      case 'table': return {t: 'MASA'};
      case 'cabinet':
        switch (it.style) {
          case 'gondola': case 'wstand': return {t: 'STAND'};
          case 'glass': return {t: 'VİTRİN'};
          case 'fridge': return {t: 'BUZDOLABI'};
          case 'kitchen': return {t: 'TEZGAH'};
          case 'closed': return {t: 'DOLAP'};
          default: return {t: 'RAF'};
        }
    }
    return null;
  },

  /* Bir dış kenar boyunca parça ölçü noktaları */
  chainPts(segs, side, W, D) {
    const horiz = side === 't' || side === 'b', L = horiz ? W : D, pts = new Set([0, L]);
    for (const sg of segs) {
      if (sg.outer) {
        const on = horiz ? (sg.h && (side === 't' ? sg.c < 0 : sg.c > D)) : (!sg.h && (side === 'l' ? sg.c < 0 : sg.c > W));
        if (on) for (const op of sg.open) { pts.add(r3(clamp(op.a, 0, L))); pts.add(r3(clamp(op.b, 0, L))); }
      } else if (horiz ? !sg.h : sg.h) {
        const touches = side === 't' || side === 'l' ? sg.a <= INNER_T : sg.b >= (horiz ? D : W) - INNER_T;
        if (touches) { pts.add(r3(sg.c - sg.t / 2)); pts.add(r3(sg.c + sg.t / 2)); }
      }
    }
    return [...pts].sort((a, b) => a - b);
  },

  /* ---------- Çizim ---------- */
  render(P, o, dpi = 300) {
    const MM = dpi / 25.4, PW = 210, PH = 297;
    const cv = document.createElement('canvas'); cv.width = Math.round(PW * MM); cv.height = Math.round(PH * MM);
    const g = cv.getContext('2d');
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, cv.width, cv.height);
    const PT = () => g.setTransform(MM, 0, 0, MM, 0, 0);
    const INK = '#111111';
    // Metin (mm cinsinden, piksel uzayında çizilir → keskin)
    const text = (str, x, y, size, opt = {}) => {
      g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
      g.translate(x * MM, y * MM); if (opt.rot) g.rotate(opt.rot * D2R);
      g.font = `${opt.bold ? 700 : 400} ${size * MM}px ${KROKI_FONT}`;
      g.fillStyle = opt.color || INK; g.textAlign = opt.align || 'center'; g.textBaseline = opt.base || 'alphabetic';
      g.fillText(str, 0, 0); g.restore();
    };
    const tw = (str, size, bold) => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.font = `${bold ? 700 : 400} ${size * MM}px ${KROKI_FONT}`; const w = g.measureText(str).width / MM; g.restore(); return w; };
    const line = (x1, y1, x2, y2, lw) => { PT(); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineWidth = lw; g.strokeStyle = INK; g.stroke(); };
    const rect = (x, y, w, h, lw) => { PT(); g.lineWidth = lw; g.strokeStyle = INK; g.strokeRect(x, y, w, h); };

    // Çerçeveler
    rect(.6, .6, PW - 1.2, PH - 1.2, .2);
    rect(7.4, 7.4, PW - 14.8, PH - 14.8, .45);

    const segs = computeWalls(P), W = P.shop.w, D = P.shop.d, H = P.shop.h || 2.8;
    const ent = this.entrance(P, segs);
    const th = o.rot === 'auto' ? ({b: 0, t: 180, l: 270, r: 90}[ent ? ent.side : 'b']) : (+o.rot || 0);
    const cs = Math.round(Math.cos(th * D2R)), sn = Math.round(Math.sin(th * D2R));
    const R = (x, y) => [x * cs - y * sn, x * sn + y * cs];

    // Ölçek ve yerleşim
    const X0 = 14, X1 = 119, Y0 = 16, Y1 = 266;
    const bw = (th % 180 === 0 ? W : D) + OUTER_T * 2, bh = (th % 180 === 0 ? D : W) + OUTER_T * 2, marg = 22;
    let den = +o.scale || 0;
    if (!den) den = [100, 200, 250, 500, 1000].find(dd => bw * 1000 / dd + marg <= X1 - X0 && bh * 1000 / dd + marg <= Y1 - Y0) || 1000;
    const k = 1000 / den; // mm / m
    const pcx = (X0 + X1) / 2 + 3, pcy = (Y0 + Y1) / 2;
    const toPage = (x, y) => { const [a, b] = R(x - W / 2, y - D / 2); return [pcx + a * k, pcy + b * k]; };
    const WT = () => g.setTransform(MM * k * cs, MM * k * sn, -MM * k * sn, MM * k * cs, MM * (pcx - (W / 2 * cs - D / 2 * sn) * k), MM * (pcy - (W / 2 * sn + D / 2 * cs) * k));
    const wl = mm => mm / k; // mm → dünya birimi (çizgi kalınlığı)
    const readable = a => { a = ((a % 360) + 360) % 360; if (a > 90 && a <= 270) a -= 180; return a > 180 ? a - 360 : a; };

    // Eşyalar (duvarların altında kalsın)
    WT();
    if (o.items) for (const it of P.items) {
      if (it.type === 'human' || it.type === 'zone' || isOpening(it) || it.type === 'column') continue;
      g.save(); g.translate(it.cx, it.cy); g.rotate(it.rot * D2R);
      g.lineWidth = wl(.18); g.strokeStyle = INK; g.fillStyle = '#FFFFFF';
      const w = it.w, d = it.d;
      if (it.type === 'fixture') {
        if (it.style === 'toilet') {
          const t = Math.min(.2, d * .28);
          g.beginPath(); g.rect(-w / 2, -d / 2, w, t); g.fill(); g.stroke();
          g.beginPath(); g.ellipse(0, -d / 2 + t + (d - t) / 2, w / 2 * .9, (d - t) / 2, 0, 0, Math.PI * 2); g.fill(); g.stroke();
        } else {
          g.beginPath(); g.rect(-w / 2, -d / 2, w, d); g.fill(); g.stroke();
          g.beginPath(); g.ellipse(0, .02, w / 2 * .7, d / 2 * .6, 0, 0, Math.PI * 2); g.stroke();
        }
      } else if (isRound(it)) { g.beginPath(); g.ellipse(0, 0, w / 2, d / 2, 0, 0, Math.PI * 2); g.fill(); g.stroke(); }
      else {
        g.beginPath(); g.rect(-w / 2, -d / 2, w, d); g.fill(); g.stroke();
        if (it.type === 'cabinet' && it.style === 'kitchen') { // evye
          const sw = Math.min(.5, w * .3), sx = -w / 2 + Math.min(.25, w * .1);
          g.beginPath(); g.rect(sx, -d / 2 + .08, sw, d - .16); g.stroke();
          g.beginPath(); g.arc(sx + sw / 2, 0, .025, 0, Math.PI * 2); g.stroke();
        }
      }
      g.restore();
    }
    // Duvarlar: birleşik çift çizgi (siyah genişletilmiş + beyaz iç)
    const pieces = wallPieces(segs);
    const e = wl(.32);
    g.fillStyle = INK; for (const r of pieces) g.fillRect(r.x0 - e, r.y0 - e, r.x1 - r.x0 + 2 * e, r.y1 - r.y0 + 2 * e);
    g.fillStyle = '#FFFFFF'; for (const r of pieces) g.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    // Kolonlar
    for (const it of P.items) if (it.type === 'column') {
      g.save(); g.translate(it.cx, it.cy); g.rotate(it.rot * D2R);
      g.fillStyle = '#FFFFFF'; g.fillRect(-it.w / 2, -it.d / 2, it.w, it.d);
      g.lineWidth = wl(.32); g.strokeStyle = INK; g.strokeRect(-it.w / 2, -it.d / 2, it.w, it.d); g.restore();
    }
    // Pencereler ve kapılar
    const doorLabels = [];
    for (const it of P.items) {
      if (!isOpening(it)) continue;
      g.save(); g.translate(it.cx, it.cy); g.rotate(it.rot * D2R);
      const w = it.w, d = it.d;
      g.strokeStyle = INK;
      g.lineWidth = wl(.32); g.beginPath(); g.moveTo(-w / 2, -d / 2); g.lineTo(-w / 2, d / 2); g.moveTo(w / 2, -d / 2); g.lineTo(w / 2, d / 2); g.stroke();
      if (it.type === 'window') {
        g.lineWidth = wl(.16); g.beginPath();
        for (const y of [-d / 2, -d / 6, d / 6, d / 2]) { g.moveTo(-w / 2, y); g.lineTo(w / 2, y); }
        g.stroke();
      } else if (it.style === 'sliding') {
        g.lineWidth = wl(.18); g.strokeRect(-w / 2, -.03, w * .55, .03); g.strokeRect(-w / 2 + w * .45, 0, w * .55, .03);
      } else {
        const y = d / 2, leaves = it.style === 'double' ? [[-w / 2, w / 2, 1], [w / 2, w / 2, -1]] : [[it.flip ? w / 2 : -w / 2, w, it.flip ? -1 : 1]];
        for (const [hx, L, dir] of leaves) {
          g.lineWidth = wl(.22); g.beginPath(); g.moveTo(hx, y); g.lineTo(hx, y + L); g.stroke();
          g.lineWidth = wl(.14); g.beginPath(); g.arc(hx, y, L, Math.PI / 2, dir > 0 ? 0 : Math.PI, dir > 0); g.stroke();
        }
        doorLabels.push(it);
      }
      g.restore();
    }
    WT(); // dönüşüm geri
    // Kapı etiketleri: 90/210 (duvar boyunca, açılış tarafında)
    for (const it of doorLabels) {
      const [lx, ly] = toWorld(it, 0, it.d / 2 + .22 + 1.6 / k);
      const [px, py] = toPage(lx, ly);
      text(`${fmtCm(it.w)}/${fmtCm(it.h)}`, px, py, 2.1, {rot: readable(it.rot + th), base: 'middle'});
    }

    // Eşya etiketleri
    if (o.items) for (const it of P.items) {
      const L = this.label(it); if (!L) continue;
      const [px, py] = toPage(it.cx, it.cy);
      const long = it.w >= it.d, len = (long ? it.w : it.d) * k, sh = (long ? it.d : it.w) * k;
      const ang = readable(it.rot + th + (long ? 0 : 90));
      if (L.small) {
        const [qx, qy] = toPage(...toWorld(it, 0, -it.d / 2 - 2.6 / k));
        const parts = L.small.split(' ');
        const half = Math.ceil(parts.length * .6);
        text(parts.slice(0, half).join(' '), qx, qy - 1.2, 1.7, {});
        text(parts.slice(half).join(' '), qx, qy + .9, 1.7, {});
        continue;
      }
      let fs = 2.1;
      const w1 = tw(L.t, 1);
      fs = Math.min(fs, (len - 1) / w1, sh * .8);
      if (fs >= 1.1) text(L.t, px, py, fs, {rot: ang, base: 'middle'});
    }

    // Oda adları ve alanları
    const A = this.areas(P, segs);
    const roomText = (lines, cxp, cyp, wpg, hpg, maxFs) => {
      let fs = maxFs;
      for (const l of lines) fs = Math.min(fs, (wpg * .9) / tw(l, 1));
      fs = Math.min(fs, hpg * .8 / (lines.length * 1.25));
      if (fs < .9) return;
      const lh = fs * 1.22, y0 = cyp - (lines.length - 1) * lh / 2;
      lines.forEach((l, i) => text(l, cxp, y0 + i * lh, fs, {base: 'middle'}));
    };
    const LP = this.labelPoints(P, segs);
    A.rooms.forEach(({r, a}, i) => {
      const lp = LP[i + 1], rw = (th % 180 === 0 ? r.w : r.d) * k, rh = (th % 180 === 0 ? r.d : r.w) * k;
      const pos = lp && lp.r * k > 3 ? [lp.x, lp.y] : [r.x + r.w / 2, r.y + r.d / 2];
      const [px, py] = toPage(...pos);
      const room = Math.min(rw, rh), free = lp ? lp.r * k * 2 : room;
      const maxFs = clamp(room * .12, 1.3, 3.0);
      roomText([r.name.toLocaleUpperCase('tr-TR'), `A = ${fm2(a)} m2`, `H = ${fm2(H)} m`], px, py, Math.max(free * 1.25, Math.min(rw, 14)), Math.max(free * 1.1, 6), maxFs);
    });
    if (A.sales > .5) {
      const lp = LP[0], pos = lp ? [lp.x, lp.y] : A.pole;
      if (pos) {
        const [px, py] = toPage(...pos), free = lp ? lp.r * k * 2 : 40;
        roomText([o.salesName || 'ECZANE SATIŞ ALANI', `A = ${fm2(A.sales)} m2`, `H = ${fm2(H)} m`], px, py, Math.max(free * 1.6, 30), Math.max(free * 1.2, 10), 3.0);
      }
    }

    // Ölçüler
    const dim = (p1, p2, nrm, offMM, label, ext = true) => {
      const [x1, y1] = toPage(...p1), [x2, y2] = toPage(...p2), [nx, ny] = R(...nrm);
      const ax = x1 + nx * offMM, ay = y1 + ny * offMM, bx = x2 + nx * offMM, by = y2 + ny * offMM;
      const L = Math.hypot(bx - ax, by - ay); if (L < 2) return;
      PT(); g.strokeStyle = INK;
      if (ext) { g.lineWidth = .1; g.beginPath(); g.moveTo(x1 + nx * .8, y1 + ny * .8); g.lineTo(ax + nx * 1, ay + ny * 1); g.moveTo(x2 + nx * .8, y2 + ny * .8); g.lineTo(bx + nx * 1, by + ny * 1); g.stroke(); }
      g.lineWidth = .13; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by);
      const ux = (bx - ax) / L, uy = (by - ay) / L, t = .7;
      for (const [x, y] of [[ax, ay], [bx, by]]) { g.moveTo(x - (ux + uy * -1) * t * .7, y - (uy + ux) * t * .7); g.lineTo(x + (ux + uy * -1) * t * .7, y + (uy + ux) * t * .7); }
      g.stroke();
      const ang = readable(Math.atan2(by - ay, bx - ax) / D2R);
      const fs = 1.7, w = tw(label, fs);
      if (w > L - .6) return;
      // yazı çizginin dış tarafında
      const sgn = (ny * Math.cos(ang * D2R) - nx * Math.sin(ang * D2R)) >= 0 ? 1 : -1;
      const ox = -Math.sin(ang * D2R) * .9 * sgn, oy = Math.cos(ang * D2R) * .9 * sgn;
      text(label, (ax + bx) / 2 + ox, (ay + by) / 2 + oy, fs, {rot: ang, base: 'middle'});
    };
    // oda iç ölçüleri
    for (const r of P.rooms) {
      const x0 = r.x + (r.x > .03 ? INNER_T / 2 : 0), x1 = r.x + r.w - (r.x + r.w < W - .03 ? INNER_T / 2 : 0);
      const y0 = r.y + (r.y > .03 ? INNER_T / 2 : 0), y1 = r.y + r.d - (r.y + r.d < D - .03 ? INNER_T / 2 : 0);
      if ((x1 - x0) * k > 8) dim([x0, y0], [x1, y0], [0, 1], 2.4, fmtCm(x1 - x0), false);
      if ((y1 - y0) * k > 8) dim([x0, y0], [x0, y1], [1, 0], 2.4, fmtCm(y1 - y0), false);
    }
    // dış ölçüler: girişin olmadığı kenarlarda parça + toplam
    const sides = ['t', 'b', 'l', 'r'];
    const outN = {t: [0, -1], b: [0, 1], l: [-1, 0], r: [1, 0]};
    for (const sd of sides) {
      const [nx, ny] = R(...outN[sd]);
      if (ny > .5) continue; // sayfanın altı (giriş tarafı) boş kalsın
      const horiz = sd === 't' || sd === 'b', c0 = sd === 't' ? -OUTER_T : sd === 'b' ? D + OUTER_T : sd === 'l' ? -OUTER_T : W + OUTER_T;
      const P2 = v => horiz ? [v, c0] : [c0, v];
      const pts = this.chainPts(segs, sd, W, D);
      if (pts.length > 2) for (let i = 0; i < pts.length - 1; i++) dim(P2(pts[i]), P2(pts[i + 1]), outN[sd], 3.5, fmtCm(pts[i + 1] - pts[i]), i === 0);
      dim(P2(0), P2(horiz ? W : D), outN[sd], pts.length > 2 ? 7.5 : 3.5, fmtCm(horiz ? W : D));
    }

    // Giriş oku
    if (ent) {
      const [dx, dy] = toPage(ent.it.cx, ent.it.cy), [ox, oy] = R(...ent.out);
      const base = OUTER_T * k / 2 + 2.2;
      const tipX = dx + ox * base, tipY = dy + oy * base, Lh = 5, Wd = 3.4;
      const bxp = tipX + ox * Lh, byp = tipY + oy * Lh, px = -oy, py = ox;
      PT(); g.fillStyle = '#E2231A'; g.beginPath();
      g.moveTo(tipX, tipY); g.lineTo(bxp + px * Wd, byp + py * Wd); g.lineTo(tipX + ox * Lh * .62, tipY + oy * Lh * .62); g.lineTo(bxp - px * Wd, byp - py * Wd); g.closePath(); g.fill();
      text('ECZANE GİRİŞİ', tipX + ox * (Lh + 5), tipY + oy * (Lh + 5), 2.6, {base: 'middle', rot: 0});
    }

    // ---- Sağ sütun
    const cx = 158.5;
    // Kuzey oku
    {
      const nx = 187, ny = 25, r = 7, a = (o.north || 0) + th;
      PT(); g.save(); g.translate(nx, ny); g.rotate(a * D2R);
      g.lineWidth = .3; g.strokeStyle = INK; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.moveTo(0, -r - 3.5); g.lineTo(-3.2, r * .55); g.lineTo(0, r * .2); g.closePath(); g.fillStyle = INK; g.fill();
      g.beginPath(); g.moveTo(0, -r - 3.5); g.lineTo(3.2, r * .55); g.lineTo(0, r * .2); g.closePath(); g.fillStyle = '#FFFFFF'; g.fill(); g.lineWidth = .25; g.stroke();
      g.restore();
      const q = r * .55 + 2.6;
      text('N', nx - Math.sin(a * D2R) * q, ny + Math.cos(a * D2R) * q, 3.2, {bold: true, base: 'middle'});
    }
    // Başlık
    const title = (o.title || 'ECZANE RÖLÖVE PLANI').toLocaleUpperCase('tr-TR');
    let tfs = Math.min(7.6, 64 / tw(title, 1));
    text(title, cx, 46, tfs);
    text(`ÖLÇEK:1/${den}`, cx, 46 + tfs * 1.18, tfs);
    let y = 46 + tfs * 1.18 + 15;
    if (o.name) { const fs = Math.min(3.8, 64 / tw(o.name, 1)); text(o.name, cx, y, fs); y += 9.5; }
    const ph = `ECZACI ADI: ${(o.pharmacist || '').toLocaleUpperCase('tr-TR')}`;
    text(ph, cx, y, Math.min(3.8, 64 / tw(ph, 1))); y += 15;
    // Adres (satır kaydırmalı)
    const addr = [];
    for (const raw of String(o.address || '').toLocaleUpperCase('tr-TR').split(/\n/)) {
      let cur = '';
      for (const w of raw.trim().split(/\s+/).filter(Boolean)) { const t = cur ? cur + ' ' + w : w; if (tw(t, 3.6) > 64 && cur) { addr.push(cur); cur = w; } else cur = t; }
      if (cur) addr.push(cur);
    }
    for (const l of addr.slice(0, 7)) { text(l, cx, y, 3.6); y += 5.1; }
    // Alan tablosu

/* Tek sayfalık PDF: A4, JPEG gömülü */
function makePdf(jpg, wpx, hpx, title) {
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); for (const b of [].concat(body)) push(b); push('\nendobj\n'); };
  const W = 595.28, H = 841.89;
  const hex = s => { let r = 'FEFF'; for (const ch of s) { const c = ch.codePointAt(0); if (c > 0xFFFF) continue; r += c.toString(16).toUpperCase().padStart(4, '0'); } return `<${r}>`; };
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>`);
  obj(4, [`<< /Type /XObject /Subtype /Image /Width ${wpx} /Height ${hpx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`, jpg, '\nendstream']);
  const content = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  obj(6, `<< /Title ${hex(title)} /Producer (Eczane Plan) /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}) >>`);
  const xref = len;
  let x = 'xref\n0 7\n0000000000 65535 f \n';
  for (let i = 1; i <= 6; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type: 'application/pdf'});
}

/* ---------- Diyalog ---------- */
function modal(build, actions) {
  return new Promise(res => {
    const dlg = $('#modal');
    dlg.innerHTML = '';
    let result = null;
    const body = h('div', {class: 'mbody'});
    build(body, v => { result = v; dlg.close(); });
    const foot = h('div', {class: 'mfoot'});
    for (const a of actions || []) foot.append(h('button', {type: 'button', class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), onclick: () => { result = a.get ? a.get() : a.v; dlg.close(); }}, a.t));
    dlg.append(body); if (actions && actions.length) dlg.append(foot);
    dlg.addEventListener('close', () => res(result), {once: true});
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); }, {once: false});
    dlg.showModal();
  });
}
function choose(title, text, opts) {

/* ---------- Açılır menü ---------- */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(anchor, items) {
  closeMenu();
  const m = h('div', {class: 'menu', role: 'menu'});
  for (const it of items) {
    if (it === '-') { m.append(h('hr')); continue; }
    if (!it) continue;
    m.append(h('button', {type: 'button', class: it.danger ? 'danger' : '', html: (it.icon || '') + `<span>${esc(it.t)}</span>`, onclick: () => { closeMenu(); it.fn(); }}));
  }
  document.body.append(m); menuEl = m;
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let left = r.right - mw, top = r.bottom + 6;
  if (left < 8) left = 8;
  if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  m.style.left = left + 'px'; m.style.top = top + 'px';
  setTimeout(() => {
    const off = e => { if (menuEl && !menuEl.contains(e.target)) { closeMenu(); document.removeEventListener('pointerdown', off, true); } };
    document.addEventListener('pointerdown', off, true);
  });
}

/* ---------- Görüntü üretimi ---------- */
function makeThumb(P) {
  try {
    const cw = 320, ch = 200, c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const W = P.shop.w + OUTER_T * 2 + .4, D = P.shop.d + OUTER_T * 2 + .4;
    const s = Math.min(cw / W, ch / D);
    const V = {s, ox: (cw - P.shop.w * s) / 2, oy: (ch - P.shop.d * s) / 2};
    const segs = computeWalls(P);
    const dark = document.documentElement.dataset.mode === 'dark';
    const C = dark ? planColors() : LIGHT_PLAN;
    drawPlan(c.getContext('2d'), P, V, {w: cw, h: ch, dpr: 1, C: Object.assign({}, C, {bg: dark ? C.bg : '#F1F3EF'}), segs, A: analyze(P, segs), grid: false, clear: false, labels: false, dims: false});
    return c.toDataURL('image/jpeg', .82);
  } catch (e) { return ''; }
}
/* Ölçülü plan tuvali (dışa aktarma için): tüm ölçüler, oda iç ölçüleri, eşya ölçüleri */
function planCanvas(P, cw, ch) {
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const W = P.shop.w, D = P.shop.d;
  const s0 = Math.min(cw / (W + 2.6), ch / (D + 2.6));
  const F = clamp(s0 / 58, 1.3, 3.2), pad = 92 * F;
  const s = Math.min((cw - pad * 2) / W, (ch - pad * 2) / D);
  const V = {s, ox: (cw - W * s) / 2 + 12 * F, oy: (ch - D * s) / 2 + 12 * F};
  const segs = computeWalls(P);
  const accent = ACCENTS[Settings.v.accent]?.l || '#1F7A5A';
  const C = Object.assign({}, LIGHT_PLAN, {accent});
  drawPlan(c.getContext('2d'), P, V, {w: cw, h: ch, dpr: 1, C, segs, A: analyze(P, segs), grid: false, clear: false, labels: true, dims: true, chains: true, roomDims: true, itemDims: true, fs: F});
  return c;
}
function planPNG(P) {
  const W = P.shop.w + 2.6, D = P.shop.d + 2.6;
  const cw = 3600, ch = Math.round(clamp(cw * D / W, 1500, 3200)), head = 150;
  const c = document.createElement('canvas'); c.width = cw; c.height = ch + head;
  const g = c.getContext('2d');
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, cw, ch + head);
  g.drawImage(planCanvas(P, cw, ch), 0, head);
  sheetTitle(g, P, 60, 50, cw - 120, 'Ölçülü yerleşim planı');
  return c;
}
function sheetTitle(g, P, x, y, w, sub) {
  const L = 92;
  g.fillStyle = '#D0102B'; g.beginPath(); g.roundRect(x, y, L, L, 16); g.fill();
  g.fillStyle = '#FFFFFF'; g.font = `900 ${L * .78}px ${getFont()}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('E', x + L / 2, y + L / 2 + 4);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#1B211F'; g.font = `800 50px ${getFont()}`; g.fillText(P.name, x + L + 28, y + 50);
  g.fillStyle = '#626C67'; g.font = `500 26px ${getFont()}`;
  g.fillText(`${sub} · ${fmtM(P.shop.w)} × ${fmtM(P.shop.d)} m · ${fmtA(P.shop.w * P.shop.d)} m² · tavan ${fmtM(P.shop.h)} m · ${new Date().toLocaleDateString('tr-TR')}`, x + L + 28, y + 88);
  g.textAlign = 'right'; g.fillStyle = '#98A09B'; g.font = `600 22px ${getFont()}`;
  g.fillText('Ölçüler: toplam m · parçalar cm', x + w, y + 50);
  g.fillText('Eczane Plan', x + w, y + 84);
}
async function exportPlanPNG() {
  const c = planPNG(Ed.P);
  c.toBlob(b => download(safeFile(Ed.P.name) + '-olculu-plan.png', b), 'image/png');
  toast('Ölçülü plan indiriliyor');
}
function equipmentList(P) {
  const order = {counter: 0, cabinet: 1, table: 2, fixture: 3, column: 4, door: 5, window: 6};
  const map = new Map();
  for (const it of P.items) {
    if (!(it.type in order)) continue;
    const size = it.type === 'door' || it.type === 'window' ? `${fmtCm(it.w)} × ${fmtCm(it.h)}` : `${fmtCm(it.w)} × ${fmtCm(it.d)} × ${fmtCm(it.type === 'column' ? P.shop.h : it.h)}`;
    const key = [it.type, it.style, it.name, size].join('|');
    const e = map.get(key) || {it, size, n: 0}; e.n++; map.set(key, e);
  }
  return [...map.values()].sort((a, b) => order[a.it.type] - order[b.it.type] || a.it.name.localeCompare(b.it.name, 'tr'));
}

async function sharePlan() {

function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      let p = o && o.v === 2 ? normalizeProject(o) : migrateV1(o.state || o);
      if (!p) throw 0;
      p.id = uid(); p.updated = Date.now();
      if (Store.index().some(e => e.name === p.name)) p.name += ' (içe aktarıldı)';
      Store.save(p, makeThumb(p));
      Home.render(); toast(`“${p.name}” içe aktarıldı`);
    } catch (e) { toast('Bu dosya okunamadı (geçerli bir plan JSON’u değil)', 'err'); }
  };
  rd.readAsText(file);
}

async function startVideo(st) {
  if (Ed.view !== '3d') { Ed.setView('3d'); await new Promise(r => setTimeout(r, 400)); }
  await View3D.ready3d();
  const bar = $('#recBar'), txt = $('#recText'), stopBtn = $('#recStop');
  bar.hidden = false;
  if (st.kind === 'live') {
    let rec;
    try { rec = View3D.startLive(); } catch (e) { bar.hidden = true; toast(e.message, 'err'); return; }
    txt.textContent = 'Kaydediliyor — gez, döndür, sonra Durdur';
    const t0 = Date.now(), iv = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); txt.textContent = `Kaydediliyor ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 500);
    stopBtn.textContent = 'Durdur';
    stopBtn.onclick = async () => { clearInterval(iv); bar.hidden = true; const blob = await rec.stop(); videoResult(blob); };
    return;
  }
  let cancelled = false;
  stopBtn.textContent = 'İptal'; stopBtn.onclick = () => { cancelled = true; };
  $('#stage').classList.add('recording');
  const [w, h] = st.res === '1080' ? [1920, 1080] : [1280, 720];
  try {
    const blob = await View3D.recordTour(st.kind, {w, h, seconds: st.sec, isCancelled: () => cancelled, onProgress: p => { txt.textContent = `Video kaydediliyor %${Math.round(p * 100)}`; }});
    if (blob) videoResult(blob);
  } catch (e) { toast('Video alınamadı: ' + (e && e.message || 'hata'), 'err'); }
  finally { bar.hidden = true; $('#stage').classList.remove('recording'); }
}

/* ---------- Yönlendirme (#/p/<id>) ---------- */
const Router = {
  cur: null,
  go(id) { location.hash = '#/p/' + id; },
  home() { if (location.hash) location.hash = ''; else this.route(); },
  async route() {
    const m = location.hash.match(/^#\/p\/([\w-]+)/);
    const id = m ? m[1] : null;
    if (id === this.cur && (id ? Ed.P : true)) return;
    if (Ed.P && Ed.P.id !== id) {
      const ok = await Ed.close();
      if (!ok) { history.pushState(null, '', '#/p/' + Ed.P.id); return; }
    }
    this.cur = id;
    if (id) { if (!Ed.open(id)) this.cur = null; }
    else {
      $('#editor').hidden = true; $('#home').hidden = false; document.title = 'Eczane Plan';
      Home.render();
    }
  },
};

/* ---------- Klavye ---------- */
function onKey(e) {
  if (!Ed.P || $('#editor').hidden || $('#modal').open) return;
  if (isTyping()) return;
  if (Ed.view === '3d' && View3D.key(e, true)) { e.preventDefault(); return; }
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); e.shiftKey ? Ed.redo() : Ed.undo(); return; }
  if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); Ed.redo(); return; }
  if (mod && (k === 's' || k === 'S')) { e.preventDefault(); Ed.save(); return; }
  if (mod && (k === 'd' || k === 'D')) { e.preventDefault(); Ed.duplicate(); return; }
  if (mod && (k === 'a' || k === 'A') && Ed.view === '2d') { e.preventDefault(); Ed.selectAll(); return; }
  if (mod) return;
  if (k === ' ' && Ed.view === '2d') { Plan.space = true; Plan.cv.style.cursor = 'grab'; e.preventDefault(); return; }
  if (k === '1') return Ed.setView('2d');
  if (k === '2') return Ed.setView('3d');
  if (Ed.view !== '2d') { if (k === 'Escape') Ed.select(null); return; }
  switch (k) {
    case 'Delete': case 'Backspace': if (Ed.sel || Ed.multi.length) { e.preventDefault(); Ed.remove(); } break;
    case 'Escape': if (Ed.tool !== 'select') Ed.setTool('select'); else { Ed.select(null); Sheets.closeAll(); } break;
    case 'r': case 'R': Ed.rotate(e.shiftKey ? -90 : 90); break;
    case 'v': case 'V': Ed.setTool('select'); break;
    case 'o': case 'O': Ed.setTool('room'); break;
    case 'm': case 'M': Ed.setTool('measure'); break;
    case 'f': case 'F': Plan.fit(); break;
    case 'g': case 'G': $('#togGrid').click(); break;
    case 's': case 'S': $('#togSnap').click(); break;
    case 'b': case 'B': $('#togClear').click(); break;
    case '+': case '=': Plan.zoomAt(Plan.w / 2, Plan.h / 2, 1.25); break;
    case '-': Plan.zoomAt(Plan.w / 2, Plan.h / 2, .8); break;
    case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown': {
      if (!Ed.sel && !Ed.multi.length) return;
      e.preventDefault();
      const st = e.shiftKey ? .01 : .05;
      Ed.nudge(k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0);
      break;
    }
  }
}
function onKeyUp(e) {
  if (Ed.view === '3d') View3D.key(e, false);
  if (e.key === ' ') { Plan.space = false; if (Plan.cv) Plan.cv.style.cursor = ''; }
}

/* ---------- Başlat ---------- */
function boot() {
  Settings.load();
  Theme.apply();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (Settings.v.mode === 'auto') Theme.apply(); });
  migrateOldData();
  Home.init();
  Plan.init();
  bindEditor();
  addEventListener('keydown', onKey);
  addEventListener('keyup', onKeyUp);
  addEventListener('blur', () => { View3D.keys.clear(); Plan.space = false; });
  addEventListener('hashchange', () => Router.route());
  addEventListener('resize', () => { closeMenu(); if (!isMobile()) Sheets.closeAll(); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  // Kapanırken bekleyen otomatik kaydı yaz
  const flush = () => { if (Ed.P && Ed.dirty && Settings.v.autosave) Ed.save(true); };
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  addEventListener('beforeunload', e => { if (Ed.P && Ed.dirty && !Settings.v.autosave) { e.preventDefault(); e.returnValue = ''; } });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !/localhost|127\.0\.0\.1/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  Router.route();
}
boot();

</script>
</body>
