<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Eczane ve dükkân için sade 2B plan çizimi ve 3B gezinti. Projeler cihazında saklanır.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eczane Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Eczane Plan</title>
<script>
/* Tema, ilk boyamadan önce uygulanır (yanıp sönmeyi önler) */
(function(){try{var s=JSON.parse(localStorage.getItem('eczplan.v2.settings')||'{}');var m=s.mode||'auto';if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.mode=m;}catch(e){}})();
</script>
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#F5F6F3; --surface-3:#ECEEE9;
  --line:#E1E4DE; --line-2:#CBD0C8; --ink:#1B211F; --muted:#626C67; --faint:#98A09B;
  --accent:#1F7A5A; --accent-ink:#FFFFFF;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --accent-line:color-mix(in srgb,var(--accent) 45%,var(--surface));
  --danger:#C23A2B; --warn:#B26B12; --ok:#2E8555;
  --danger-soft:color-mix(in srgb,var(--danger) 12%,var(--surface));
  --warn-soft:color-mix(in srgb,var(--warn) 14%,var(--surface));
  --plan-bg:#E9EBE6; --plan-floor:#FFFFFF; --plan-grid:#EEF0EC; --plan-grid2:#DADFD7;
  --plan-wall:#2C3330; --plan-ink:#1B211F; --plan-muted:#6F7974;
  --scene-bg:#E4E7E2; --scene-wall:#F2F0EB; --scene-floor:#F4F2ED;
  --shadow:0 1px 2px rgba(20,30,26,.06),0 8px 24px rgba(20,30,26,.10);
  --shadow-lg:0 2px 6px rgba(20,30,26,.08),0 20px 50px rgba(20,30,26,.18);
  --r:14px; --r-sm:10px; --r-xs:8px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --side-l:236px; --side-r:308px; --bar-h:56px;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#121615; --surface:#1B201E; --surface-2:#212725; --surface-3:#29302D;
  --line:#2C3431; --line-2:#3D4743; --ink:#E6EBE8; --muted:#9AA59F; --faint:#6A756F;
  --danger:#EE7462; --warn:#E2A94C; --ok:#4CC38A;
  --plan-bg:#101312; --plan-floor:#1A1F1D; --plan-grid:#212725; --plan-grid2:#2C3531;
  --plan-wall:#D3DAD6; --plan-ink:#E6EBE8; --plan-muted:#8E9A94;
  --scene-bg:#151A18; --scene-wall:#D9D6CF; --scene-floor:#CFCBC3;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 20px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.grow{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--danger)}
.btn.big{min-height:48px;font-size:16px;border-radius:var(--r)}
.btn.full{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--ink);padding:0}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn:disabled{opacity:.35;cursor:default;background:transparent}
.icon-btn svg{width:20px;height:20px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);padding:0 14px;min-height:32px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button svg{width:16px;height:16px}

/* ---------- inputs ---------- */
.fl{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.fl>span{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:42px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- home ---------- */
.home{min-height:100%;display:flex;flex-direction:column}
.home-top{display:flex;align-items:center;gap:10px;padding:14px max(18px,env(safe-area-inset-left)) 6px;max-width:1080px;width:100%;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:750;letter-spacing:-.01em}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center}
.logo i svg{width:20px;height:20px}
.home-main{max-width:1080px;width:100%;margin:0 auto;padding:10px 18px 40px;display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.new-card{padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
.new-card h1{margin:0;font-size:22px;letter-spacing:-.01em}
.new-card p{margin:-8px 0 0;color:var(--muted)}
.new-card form{display:flex;flex-direction:column;gap:12px}
.row2{display:flex;gap:10px}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tpl button b{font-size:14px}
.tpl button small{color:var(--muted);font-size:12px;line-height:1.3}
.tpl button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.sec-head{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.sec-head h2{margin:0;font-size:18px;flex:1}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.proj{position:relative;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s}
.proj:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.proj .th{aspect-ratio:16/10;background:var(--plan-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
.proj .th img{width:100%;height:100%;object-fit:contain}
.proj .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.proj .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:34px}
.proj .sub{font-size:12.5px;color:var(--muted)}
.proj .more{position:absolute;right:6px;bottom:14px}
.proj .badge{position:absolute;left:10px;top:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;letter-spacing:.02em}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted)}
.home .note{margin-top:16px}
@media (max-width:760px){
  .home-main{grid-template-columns:1fr;padding:6px 14px 30px;gap:18px}
  .new-card{position:static;padding:16px}
  .proj-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .proj .nm{font-size:14px}
}

/* ---------- editor ---------- */
.editor{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.bar{height:var(--bar-h);flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:20}
.pname{display:flex;flex-direction:column;align-items:flex-start;min-width:0;border:0;background:transparent;padding:4px 8px;border-radius:var(--r-xs);max-width:34vw;text-align:left}
.pname:hover{background:var(--surface-3)}
.pname b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pname small{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pname small i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.pname small i.dirty{background:var(--warn)}
.bar .center{position:absolute;left:50%;transform:translateX(-50%)}
.save-btn span{display:inline}
.work{flex:1;display:flex;min-height:0;position:relative}
.side{background:var(--surface);display:flex;flex-direction:column;min-height:0;flex:none}
.side-l{width:var(--side-l);border-right:1px solid var(--line)}
.side-r{width:var(--side-r);border-left:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 14px;min-height:48px}
.sheet-head b{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .icon-btn{width:34px;height:34px}
.sheet-close{display:none!important}
.sheet-grip{display:none}
.sheet-body{overflow:auto;padding:0 12px 16px;min-height:0;flex:1;overscroll-behavior:contain}
.stage{flex:1;position:relative;min-width:0;background:var(--plan-bg);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.float{position:absolute;display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:4px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
.tools{left:12px;top:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px)}
.tb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:0;background:transparent;border-radius:var(--r-xs);font-weight:600;color:var(--ink);white-space:nowrap}
.tb:hover{background:var(--surface-3)}
.tb.on{background:var(--accent);color:var(--accent-ink)}
.tb.tog.on{background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 1px var(--accent-line) inset}
.tb svg{width:18px;height:18px}
.tb .k{font:600 10px/1 var(--mono);opacity:.55;border:1px solid currentColor;border-radius:4px;padding:2px 4px}
.tsep{width:1px;height:24px;background:var(--line);margin:0 3px}
.zoom{right:12px;bottom:12px}
.zoom .tb{min-width:36px;justify-content:center;padding:0 8px}
.hintpill{position:absolute;left:50%;top:66px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 16px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);z-index:6;max-width:calc(100% - 24px)}
.hintpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hintpill button{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:6px 14px;flex:none}
.ctxbar{position:absolute;display:flex;gap:2px;padding:4px;z-index:7;left:0;top:0;border-radius:12px;transition:opacity .12s}
.ctxbar .tb{height:38px;padding:0 10px}
.ctxbar .tb.danger{color:var(--danger)}
.ctxbar .edit-only{display:none}
.loading3d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600;z-index:4;pointer-events:none}
.stage.is3d{background:var(--scene-bg)}
.walkhint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:999px;padding:6px 14px;pointer-events:none;white-space:nowrap;z-index:5;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.dock{display:none}

/* ---------- palette ---------- */
.pal-g{margin:6px 0 14px}
.pal-g h4{margin:0 2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:82px;transition:border-color .12s,background .12s}
.pal button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.pal button:active{transform:scale(.97)}
.pal button svg{width:44px;height:30px}
.pal .n{font-size:12.5px;font-weight:600;line-height:1.15;text-align:center}
.pal .s{font:500 10.5px/1.1 var(--mono);color:var(--muted);text-align:center}

/* ---------- properties ---------- */
.pgrp{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pgrp:first-child{border-top:0;padding-top:4px}
.pgrp>h4{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.pgrp>h4 .sp{flex:1}
.prow{display:flex;gap:8px;align-items:flex-end}
.pf{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.pf>label{font-size:11.5px;color:var(--muted);font-weight:600}
.pf input[type=text]{width:100%;min-height:38px;border:1px solid var(--line-2);border-radius:var(--r-xs);background:var(--surface);padding:0 10px;font-size:15px}
.pf input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.num{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:var(--r-xs);background:var(--surface);min-height:38px;overflow:hidden}
.num:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.num input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font:600 15px/1 var(--mono);font-variant-numeric:tabular-nums;padding:0 2px}
.num input:focus{outline:none}
.num button{border:0;background:var(--surface-2);width:32px;flex:none;font-size:17px;font-weight:600;color:var(--muted);padding:0}
.num button:hover{background:var(--surface-3);color:var(--ink)}
.num .u{align-self:center;font-size:11.5px;color:var(--faint);padding-right:4px;flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:28px;height:28px;border-radius:8px;border:2px solid transparent;padding:0;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
.swatches button.on{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;min-height:32px}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acts .btn{min-height:40px;padding:0 8px;font-size:13px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13.5px}
.kv span{color:var(--muted)}
.kv b{font:600 13.5px/1.35 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.big-area{display:flex;align-items:baseline;gap:6px}
.big-area b{font:700 26px/1 var(--font);letter-spacing:-.02em}
.big-area span{color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:5px}
.ritem{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:var(--r-xs);padding:8px 10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.ritem:hover{background:var(--surface-2)}
.ritem i{width:12px;height:12px;border-radius:4px}
.ritem .t{min-width:0}
.ritem .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .t small{font:500 11.5px/1.2 var(--mono);color:var(--muted)}
.ritem .a{font:700 13px/1 var(--mono)}
.issues{display:flex;flex-direction:column;gap:5px}
.issue{display:flex;gap:9px;align-items:flex-start;border:0;background:var(--danger-soft);color:var(--ink);border-radius:var(--r-xs);padding:8px 10px;text-align:left;font-size:13px;width:100%;line-height:1.35}
.issue.w{background:var(--warn-soft)}
.issue i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;font:700 11px/18px var(--font);text-align:center;font-style:normal}
.issue.w i{background:var(--warn)}
.okline{display:flex;gap:8px;align-items:center;color:var(--ok);font-weight:600;font-size:13.5px}
.tip{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
.tip b{color:var(--ink)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .15s;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.switch small{display:block;color:var(--muted);font-size:12px}

/* ---------- modal / menu / toast ---------- */
dialog.modal{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg);width:min(440px,calc(100vw - 28px));max-height:calc(100dvh - 40px)}
dialog.modal::backdrop{background:rgba(10,15,13,.42);backdrop-filter:blur(2px)}
.mbody{padding:20px 20px 8px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:calc(100dvh - 120px)}
.mbody h2{margin:0;font-size:19px}
.mbody p{margin:0;color:var(--muted)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}
.menu{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;min-width:230px;max-width:calc(100vw - 16px);display:flex;flex-direction:column;animation:pop .12s ease-out}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:var(--r-xs);padding:10px 12px;text-align:left;font-weight:500;white-space:nowrap}
.menu button:hover{background:var(--surface-2)}
.menu button svg{width:18px;height:18px;color:var(--muted)}
.menu button.danger{color:var(--danger)}
.menu button.danger svg{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:200;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
.accents{display:flex;flex-wrap:wrap;gap:10px}
.accents button{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);padding:0}
.accents button.on{box-shadow:0 0 0 2px var(--ink)}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.help dt{font:600 12px/1.6 var(--mono);color:var(--ink);white-space:nowrap}
.help dd{margin:0;color:var(--muted)}

/* ---------- mobile ---------- */
@media (max-width:900px){
  :root{--bar-h:54px}
  .bar{gap:2px;padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right))}
  .pname{max-width:40vw;padding:4px 4px}
  .bar .center{position:static;transform:none}
  .save-btn{padding:0 11px}
  .save-btn span{display:none}
  .hide-m{display:none!important}
  .side{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:62%;border:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);z-index:30;transform:translateY(105%);transition:transform .22s ease;visibility:hidden}
  .side.open{transform:none;visibility:visible}
  .side-l{height:62%}
  .sheet-grip{display:block;width:38px;height:4px;border-radius:9px;background:var(--line-2);margin:8px auto 0}
  .sheet-head{padding-top:4px}
  .sheet-close{display:inline-flex!important}
  .sheet-body{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .pal{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
  .tools{left:8px;top:8px;right:auto;padding:3px}
  .tb{padding:0 9px}
  .tb .lbl,.tb .k{display:none}
  .zoom{right:8px;bottom:8px}
  .zoom .fitlbl{display:none}
  .ctxbar .edit-only{display:inline-flex}
  .ctxbar .tb .lbl{display:none}
  .ctxbar .tb{padding:0 11px}
  .dock{display:flex;flex:none;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px;z-index:20}
  .dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:var(--r-sm);padding:5px 2px;font-size:11.5px;font-weight:600;color:var(--muted);min-height:50px;justify-content:center}
  .dock button svg{width:22px;height:22px}
  .dock button.on{color:var(--accent)}
  .dock button.main{color:var(--accent-ink);background:var(--accent)}
  .hintpill{top:56px}
  .walkhint{bottom:10px;font-size:12px}
}
@media (min-width:901px){ .only-m{display:none!important} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 3B gezinti ---------- */
.joy{position:absolute;left:18px;bottom:18px;width:124px;height:124px;border-radius:50%;background:color-mix(in srgb,var(--surface) 55%,transparent);border:2px solid color-mix(in srgb,var(--ink) 18%,transparent);z-index:6;touch-action:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--accent);opacity:.9;box-shadow:var(--shadow);pointer-events:none}
.crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;z-index:5}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px rgba(0,0,0,.8)}
.crosshair::before{left:6px;top:0;width:2px;height:14px}
.crosshair::after{top:6px;left:0;height:2px;width:14px}
.stage.walking .zoom{display:none}
@media (max-width:900px){ .joy{left:14px;bottom:14px;width:116px;height:116px} .stage.walking .walkhint{left:142px;right:10px;bottom:18px;transform:none;white-space:normal;text-align:left;border-radius:14px} .work:has(.side.open) .ctxbar{display:none!important} }
.stage canvas.minimap{position:absolute;inset:auto;right:12px;top:12px;width:180px;height:auto;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);z-index:6;background:var(--plan-floor);cursor:pointer}
@media (max-width:900px){ .stage canvas.minimap{width:128px;right:8px;top:8px} }
.swing{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.swing button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-xs);padding:2px;aspect-ratio:1;color:var(--muted)}
.swing button:hover{border-color:var(--accent-line)}
.swing button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset;color:var(--accent)}
.swing svg{width:100%;height:100%;display:block}
.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.floors button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-xs);padding:3px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.floors button img,.floors .inh{width:100%;aspect-ratio:1.6;object-fit:cover;border-radius:5px;display:flex;align-items:center;justify-content:center;background:var(--surface-3);font-weight:700;color:var(--muted)}
.floors button small{font-size:11px;line-height:1.15;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.floors button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.floors button.on small{color:var(--ink);font-weight:600}
.rprev img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.rprev:empty{display:none}
.row2 .btn[hidden]{display:none}
.aligns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.aligns .btn{padding:0;min-height:40px}
.recbar{position:absolute;left:50%;top:66px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#1B211F;color:#fff;border-radius:999px;padding:6px 6px 6px 14px;font-weight:600;font-size:13px;z-index:9;box-shadow:var(--shadow-lg)}
.recbar i{width:10px;height:10px;border-radius:50%;background:#E5484D;animation:recp 1s infinite}
.recbar button{border:0;border-radius:999px;background:#E5484D;color:#fff;font-weight:700;padding:6px 14px}
@keyframes recp{50%{opacity:.25}}
.stage.recording::after{content:"";position:absolute;inset:0;z-index:8}
.vprev{width:100%;border-radius:12px;background:#000;display:block;max-height:50vh}
dialog.modal.wide{width:min(960px,calc(100vw - 28px))}
.kgrid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.kcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.kprev{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:200px;display:flex;align-items:center;justify-content:center;color:#888}
.kprev img{width:100%;display:block;border-radius:8px}
.inp.ta{min-height:80px;padding:10px 12px;font-size:15px;resize:vertical;line-height:1.35}
@media (max-width:760px){.kgrid{grid-template-columns:1fr}.kgrid .kcol:last-child{order:-1}}
.walkhint,.recbar,.hintpill{-webkit-user-select:none;user-select:none}

</style>
</head>
<body>

<!-- ============ ANA EKRAN: projeler ============ -->
<div id="home" class="home">
  <header class="home-top">
    <div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></i>Eczane Plan</div>
    <div class="grow"></div>
    <button class="icon-btn" id="homeHelp" title="Nasıl kullanılır?"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .6-1.5 1.1-1.5 2.2M12 17h.01"/></svg></button>
    <button class="icon-btn" id="homeSettings" title="Görünüm ve tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </header>
  <main class="home-main">
    <section class="card new-card">
      <h1>Yeni proje</h1>
      <p>Bir isim ver, ölçüleri gir ve çizmeye başla.</p>
      <form id="newForm" autocomplete="off">
        <label class="fl"><span>Proje adı</span><input class="inp" id="newName" placeholder="ör. Merkez Eczanesi" maxlength="60" enterkeyhint="go"></label>
        <div class="row2">
          <label class="fl"><span>Genişlik (m)</span><input class="inp" id="newW" inputmode="decimal" value="13,65"></label>
          <label class="fl"><span>Derinlik (m)</span><input class="inp" id="newD" inputmode="decimal" value="6,95"></label>
        </div>
        <div class="tpl" id="newTpl">
          <button type="button" data-v="empty" class="on"><b>Boş dükkân</b><small>Sadece dış duvarlar</small></button>
          <button type="button" data-v="sample"><b>Örnek eczane</b><small>Odalar, banko ve dolaplar hazır</small></button>
        </div>
        <button class="btn primary big full" type="submit">Başla <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
    </section>
    <section>
      <div class="sec-head">
        <h2>Projelerim</h2>
        <label class="btn ghost" title="JSON yedeğinden proje yükle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 15v4a1 1 0 001 1h14a1 1 0 001-1v-4"/></svg>İçe aktar<input type="file" id="importFile" accept="application/json,.json" hidden></label>
      </div>
      <div id="projList" class="proj-grid"></div>
      <p class="note">Projeler yalnızca bu cihazın tarayıcısında saklanır; internet gerekmez. Başka cihaza taşımak veya yedeklemek için proje menüsünden <b>JSON indir</b>’i kullan.</p>
    </section>
  </main>
</div>

<!-- ============ DÜZENLEYİCİ ============ -->
<div id="editor" class="editor" hidden>
  <header class="bar">
    <button class="icon-btn" id="btnHome" title="Projeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="pname" id="pname" title="Yeniden adlandır"><b id="pnameText">Proje</b><small><i id="saveDot"></i><span id="saveText">Kaydedildi</span></small></button>
    <div class="grow"></div>
    <div class="seg center" id="viewSeg">
      <button data-v="2d" class="on" title="2B plan (1)">2B</button>
      <button data-v="3d" title="3B görünüm (2)">3B</button>
    </div>
    <div class="grow"></div>
    <button class="icon-btn" id="btnUndo" title="Geri al (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
    <button class="icon-btn" id="btnRedo" title="Yinele (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
    <button class="btn primary save-btn" id="btnSave" title="Kaydet (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v13a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span>Kaydet</span></button>
    <button class="btn hide-m" id="btnKroki" title="Kroki çizimi al (A4 PDF)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 9h6v8H9zM12 9v4h3"/></svg><span>Kroki</span></button>
    <button class="icon-btn" id="btnMenu" title="Menü"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </header>

  <div class="work">
    <aside class="side side-l" id="sheetAdd">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><b>Ekle</b><button class="icon-btn sheet-close" data-close="sheetAdd" title="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="sheet-body" id="palette"></div>
    </aside>

    <main class="stage" id="stage">
      <canvas id="plan"></canvas>
      <canvas id="scene" hidden></canvas>

      <div class="float tools" id="tools2d">
        <button class="tb on" data-tool="select" title="Seç ve taşı (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6.5 1.6L9.5 19z"/></svg><span class="lbl">Seç</span></button>
        <button class="tb" data-tool="room" title="Oda çiz (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="4.5" width="17" height="15" rx="1"/><path d="M12 4.5v8h8.5"/></svg><span class="lbl">Oda çiz</span></button>
        <button class="tb" data-tool="measure" title="Ölç (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 16L16 3l5 5L8 21z"/><path d="M7 12l2 2M10 9l2 2M13 6l2 2"/></svg><span class="lbl">Ölç</span></button>
        <button class="tb tog" id="togMulti" title="Çoklu seçim (veya Ctrl/Shift + tıkla)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><path d="M13 7h4a1 1 0 011 1v3M11 17H7a1 1 0 01-1-1v-3" stroke-dasharray="2 2"/></svg><span class="lbl">Çoklu</span></button>
        <span class="tsep hide-m"></span>
        <button class="tb tog on hide-m" id="togGrid" title="Izgara (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg><span class="lbl">Izgara</span></button>
        <button class="tb tog on" id="togSnap" title="Mıknatıs: duvara ve eşyalara yapış (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v8a6 6 0 0012 0V3"/><path d="M6 3h4M14 3h4M6 7h4M14 7h4"/></svg><span class="lbl">Mıknatıs</span></button>
        <button class="tb tog on" id="togClear" title="İnsan boşluklarını göster (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><path d="M12 8v6m0 0l-3 6m3-6l3 6M7 11h10"/><path d="M2 4v16M22 4v16" stroke-dasharray="2 2"/></svg><span class="lbl">Boşluklar</span></button>
      </div>

      <div class="float tools" id="tools3d" hidden>
        <div class="seg" id="modeSeg">
          <button data-v="orbit" class="on" title="Etrafında döndür"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M12 3v18"/></svg><span class="lbl">Döndür</span></button>
          <button data-v="walk" title="İnsan gözüyle gez (WASD + fare)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6-3-3 2-5 3 4h4M7 11l2-4"/></svg><span class="lbl">Gez</span></button>
        </div>
        <span class="tsep"></span>
        <button class="tb orbit-only" id="camTop" title="Üstten bak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg><span class="lbl">Üstten</span></button>
        <button class="tb orbit-only" id="camIso" title="Açılı bak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span class="lbl">Açılı</span></button>
        <button class="tb" id="camRender" title="Render al (yüksek kaliteli görsel)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg><span class="lbl">Render</span></button>
        <button class="tb" id="camVideo" title="Video al"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg><span class="lbl">Video</span></button>
        <button class="tb" id="camWalls" title="Duvar yüksekliği"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M5 20V9h6v11M13 20v-7h6v7"/></svg><span class="lbl" id="camWallsLbl">Duvar: tam</span></button>
      </div>

      <div class="hintpill" id="hintPill" hidden><span id="hintText"></span><button id="hintDone">Bitti</button></div>

      <div class="float ctxbar" id="ctxbar" hidden>
        <button class="tb" data-act="rotate" title="90° döndür (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span class="lbl">Döndür</span></button>
        <button class="tb" data-act="dup" title="Yanına kopyala (Ctrl+D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg><span class="lbl">Kopyala</span></button>
        <button class="tb edit-only" data-act="edit" title="Özellikler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="lbl">Düzenle</span></button>
        <button class="tb danger" data-act="del" title="Sil (Del)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span class="lbl">Sil</span></button>
      </div>

      <div class="float zoom" id="zoomCtl">
        <button class="tb" id="zoomOut" title="Uzaklaştır (−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
        <button class="tb" id="zoomFit" title="Tümünü göster (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl fitlbl">Sığdır</span></button>
        <button class="tb" id="zoomIn" title="Yakınlaştır (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>

      <div class="recbar" id="recBar" hidden><i></i><span id="recText">Kaydediliyor</span><button id="recStop">Durdur</button></div>
      <div class="walkhint" id="walkHint" hidden></div>
      <canvas class="minimap" id="minimap" hidden title="Haritaya dokun: oraya git"></canvas>
      <div class="crosshair" id="crosshair" hidden></div>
      <div class="joy" id="joy" hidden><div class="joy-knob" id="joyKnob"></div></div>
      <div class="loading3d" id="loading3d" hidden>3B hazırlanıyor…</div>
    </main>

function roomBox(r) { return {x0: r.x, y0: r.y, x1: r.x + r.w, y1: r.y + r.d}; }
const quarter = rot => { const q = Math.round(rot / 90); return Math.abs(rot - q * 90) < 1.5 ? ((q % 4) + 4) % 4 : -1; };

/* SAT: iki dışbükey çokgen eps'ten fazla iç içe geçiyor mu */
function polyOverlap(A, B, eps = 0.01) {
  for (const P of [A, B]) {
    for (let i = 0; i < P.length; i++) {
      const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length];
      let nx = y1 - y2, ny = x2 - x1; const L = Math.hypot(nx, ny); if (L < 1e-9) continue; nx /= L; ny /= L;
      let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
      for (const [x, y] of A) { const p = x * nx + y * ny; if (p < a0) a0 = p; if (p > a1) a1 = p; }
      for (const [x, y] of B) { const p = x * nx + y * ny; if (p < b0) b0 = p; if (p > b1) b1 = p; }
      if (Math.min(a1, b1) - Math.max(a0, b0) <= eps) return false;
    }
  }
  return true;
}
function polyOutside(P, W, D, eps = 0.01) { return P.some(([x, y]) => x < -eps || y < -eps || x > W + eps || y > D + eps); }

/* ---------- Duvarlar ----------
   Dış duvarlar iç ölçünün dışında (kalınlık OUTER_T). İç duvarlar oda kenarlarından türetilir,
   çizgisi üzerinde ortalanır (INNER_T). Aynı hattaki kenarlar birleştirilir.
   seg: {h: yatay mı, c: hat koordinatı, a..b: hat boyunca aralık, t: kalınlık, outer, open: [boşluklar]} */
function computeWalls(P) {
  const W = P.shop.w, D = P.shop.d, to = OUTER_T, ti = INNER_T, E = 0.03;
  const segs = [
    {h: 1, c: -to / 2, a: -to, b: W + to, t: to, outer: 1},
    {h: 1, c: D + to / 2, a: -to, b: W + to, t: to, outer: 1},
    {h: 0, c: -to / 2, a: 0, b: D, t: to, outer: 1},
    {h: 0, c: W + to / 2, a: 0, b: D, t: to, outer: 1},
  ];
  const H = new Map(), V = new Map();
  const add = (map, c, a, b, lim) => {
    a = Math.max(a, 0); b = Math.min(b, lim); if (b - a < 0.02) return;
    const k = Math.round(c * 200) / 200;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push([a, b]);
  };
  for (const r of P.rooms) {
    for (const y of [r.y, r.y + r.d]) if (y > E && y < D - E) add(H, y, r.x, r.x + r.w, W);
    for (const x of [r.x, r.x + r.w]) if (x > E && x < W - E) add(V, x, r.y, r.y + r.d, D);
  }
  const merge = list => {
    list.sort((p, q) => p[0] - q[0]); const out = [];
    for (const [a, b] of list) { const l = out[out.length - 1]; if (l && a <= l[1] + 0.005) l[1] = Math.max(l[1], b); else out.push([a, b]); }
    return out;
  };
  for (const [k, l] of H) for (const [a, b] of merge(l)) segs.push({h: 1, c: k, a: Math.max(0, a - ti / 2), b: Math.min(W, b + ti / 2), t: ti});
  for (const [k, l] of V) for (const [a, b] of merge(l)) segs.push({h: 0, c: k, a, b, t: ti});
  for (const s of segs) s.open = [];
  for (const it of P.items) {
    if (!isOpening(it)) continue;
    const s = wallOf(it, segs); if (!s) continue;
    const along = s.h ? it.cx : it.cy;
    const a = Math.max(s.a, along - it.w / 2), b = Math.min(s.b, along + it.w / 2);
    if (b - a < 0.02) continue;
    const elev = it.type === 'window' ? it.elev : 0;
    s.open.push({a, b, type: it.type, elev, top: elev + it.h, id: it.id});
  }
  return segs;
}
/* Kapı/pencerenin üzerinde durduğu duvar (yoksa null) */
function wallOf(it, segs) {
  const q = quarter(it.rot || 0); if (q < 0) return null;
  const horiz = q % 2 === 0;
  const lc = horiz ? it.cy : it.cx, along = horiz ? it.cx : it.cy;
  let best = null, bd = Infinity;
  for (const s of segs) {
    if (!!s.h !== horiz) continue;
    const dist = Math.abs(s.c - lc); if (dist > s.t / 2 + 0.06) continue;
    if (along < s.a - 0.01 || along > s.b + 0.01) continue;
    if (dist < bd) { bd = dist; best = s; }
  }
  return best;
}
/* Duvar hattında kapının kayabileceği aralık */
function segRange(s) {
  if (s.outer && s.h) return [s.a + OUTER_T, s.b - OUTER_T];
  if (!s.outer && s.h) return [s.a + INNER_T / 2, s.b - INNER_T / 2];
  return [s.a, s.b];
}
/* Noktaya en yakın duvar hattı (kapı yerleştirme için) */
function nearestWall(segs, x, y, maxD) {
  let best = null, bd = maxD;
  for (const s of segs) {
    const along = s.h ? x : y, lc = s.h ? y : x;
    const [a, b] = segRange(s);
    const d = Math.hypot(along - clamp(along, a, b), lc - s.c);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
function segRect(s, a, b) { return s.h ? {x0: a, y0: s.c - s.t / 2, x1: b, y1: s.c + s.t / 2} : {x0: s.c - s.t / 2, y0: a, x1: s.c + s.t / 2, y1: b}; }
/* Duvar parçaları; filtreye uyan boşluklar kesilir */
function wallPieces(segs, filter = () => true) {
  const out = [];
  for (const s of segs) {
    let cur = s.a;
    const ops = s.open.filter(filter).sort((p, q) => p.a - q.a);
    for (const o of ops) { if (o.a > cur + 1e-4) out.push(segRect(s, cur, o.a)); cur = Math.max(cur, o.b); }
    if (s.b > cur + 1e-4) out.push(segRect(s, cur, s.b));
  }
  return out;
}

/* Kapıyı duvara oturt: hat, yön ve kalınlık. Açılış tarafı korunur. */
function seatOnWall(it, s, along, reorient) {
  const [lo, hi] = segRange(s);
  const half = it.w / 2;
  along = hi - lo >= it.w ? clamp(along, lo + half, hi - half) : (lo + hi) / 2;
  const q = quarter(it.rot || 0);
  // Dış duvara yeni geçen kapı içeri açılsın; iç duvarda mevcut taraf korunur
  const inward = s.h ? (s.c < 0 ? 0 : 180) : (s.c < 0 ? 270 : 90);
  if (s.h) { it.cy = s.c; it.cx = along; if (q !== 0 && q !== 2) it.rot = s.outer ? inward : 0; }
  else { it.cx = s.c; it.cy = along; if (q !== 1 && q !== 3) it.rot = s.outer ? inward : 90; }
  if (reorient && s.outer) it.rot = inward;
  it.d = s.t;
}

/* ---------- Boşluk alanları ---------- */
function clearPoly(it, side) {
  if (side === 'f' && it.clear > 0) return localPoly(it, -it.w / 2, it.d / 2, it.w / 2, it.d / 2 + it.clear);
  if (side === 'b' && it.clearB > 0) return localPoly(it, -it.w / 2, -it.d / 2 - it.clearB, it.w / 2, -it.d / 2);
  return null;
}
/* Kapı kanadının süpürdüğü alan (çeyrek daire, dışbükey çokgen) */
function swingPolys(it) {
  if (it.type !== 'door' || it.style === 'sliding') return [];
  const leaves = it.style === 'double' ? [[-it.w / 2, it.w / 2, 1], [it.w / 2, it.w / 2, -1]] : [[it.flip ? it.w / 2 : -it.w / 2, it.w, it.flip ? -1 : 1]];
  const y0 = it.d / 2, out = [];
  for (const [hx, L, dir] of leaves) {
    const pts = [toWorld(it, hx, y0)];
    for (let i = 0; i <= 6; i++) { const a = i / 6 * Math.PI / 2; pts.push(toWorld(it, hx + dir * Math.cos(a) * L, y0 + Math.sin(a) * L)); }
    out.push(pts);
  }
  return out;
}

/* ---------- Analiz: çakışmalar ve insan boşlukları ---------- */
function analyze(P, segs) {
  const W = P.shop.w, D = P.shop.d;
  const nm = it => it.name || TYPES[it.type].n;
  const solids = P.items.filter(isSolid).map(it => ({it, poly: itemPoly(it)}));
  const walls = wallPieces(segs, o => o.type === 'door').map(rectPoly);
  const bad = new Set(), zoneBad = new Set(), issues = [];
  for (let i = 0; i < solids.length; i++) for (let j = i + 1; j < solids.length; j++) {
    const a = solids[i], b = solids[j];
    if (polyOverlap(a.poly, b.poly)) { bad.add(a.it.id); bad.add(b.it.id); issues.push({id: a.it.id, t: `${nm(a.it)} ile ${nm(b.it)} üst üste`}); }
  }
  for (const s of solids) {
    if (polyOutside(s.poly, W, D)) { bad.add(s.it.id); issues.push({id: s.it.id, t: `${nm(s.it)} dükkânın dışına taşıyor`}); continue; }
    if (s.it.type !== 'column' && walls.some(w => polyOverlap(s.poly, w, 0.015))) { bad.add(s.it.id); issues.push({id: s.it.id, t: `${nm(s.it)} duvarın içine giriyor`}); }
  }
  const blocker = (poly, self) => {
    for (const s of solids) if (s.it !== self && polyOverlap(poly, s.poly)) return nm(s.it);
    if (walls.some(w => polyOverlap(poly, w, 0.015))) return 'duvar';
    if (polyOutside(poly, W, D, 0.02)) return 'dış duvar';
    return null;
  };
  for (const it of P.items) {
    if (isSolid(it)) {
      for (const side of ['f', 'b']) {
        const poly = clearPoly(it, side); if (!poly) continue;
        const b = blocker(poly, it);
        if (b) {
          zoneBad.add(it.id + ':' + side);
          const v = side === 'f' ? it.clear : it.clearB;
          issues.push({id: it.id, w: 1, t: `${nm(it)} ${side === 'f' ? 'önündeki' : 'arkasındaki'} ${fmtCm(v)} cm geçişi ${b === 'duvar' || b === 'dış duvar' ? 'duvar' : b} kesiyor`});
        }
      }
    } else if (it.type === 'zone') {
      const b = blocker(itemPoly(it), it);
      if (b) { zoneBad.add(it.id + ':z'); issues.push({id: it.id, w: 1, t: `${nm(it)} alanına ${b} giriyor`}); }
    } else if (it.type === 'door') {
      for (const poly of swingPolys(it)) {
        const hit = solids.find(s => polyOverlap(poly, s.poly, 0.02));
        if (hit) { zoneBad.add(it.id + ':s'); issues.push({id: it.id, w: 1, t: `${nm(it)} açılırken ${nm(hit.it)} ile çarpışıyor`}); break; }
      }
    }
  }
  return {bad, zoneBad, issues};
}

/* Seçili nesnenin dört yöndeki en yakın engele uzaklığı (eksen hizalı kutularla) */
function gapsAround(box, obstacles, maxD = 8) {
  const res = [];
  const ov = (a0, a1, b0, b1) => Math.min(a1, b1) - Math.max(a0, b0);
  const dirs = [['r', 1, 0], ['l', -1, 0], ['d', 0, 1], ['u', 0, -1]];
  for (const [k, dx, dy] of dirs) {
    let best = maxD, hit = null;
    for (const o of obstacles) {
      if (dx) {
        if (ov(box.y0, box.y1, o.y0, o.y1) <= 0.005) continue;
        const d = dx > 0 ? o.x0 - box.x1 : box.x0 - o.x1;
        if (d >= -0.001 && d < best) { best = d; hit = o; }
      } else {
        if (ov(box.x0, box.x1, o.x0, o.x1) <= 0.005) continue;
        const d = dy > 0 ? o.y0 - box.y1 : box.y0 - o.y1;
        if (d >= -0.001 && d < best) { best = d; hit = o; }
      }
    }
    if (!hit || best < 0.005) continue;
    let x0, y0, x1, y1;
    if (dx) {
      const y = (Math.max(box.y0, hit.y0) + Math.min(box.y1, hit.y1)) / 2;
      x0 = dx > 0 ? box.x1 : box.x0; x1 = x0 + dx * best; y0 = y1 = y;
    } else {
      const x = (Math.max(box.x0, hit.x0) + Math.min(box.x1, hit.x1)) / 2;
      y0 = dy > 0 ? box.y1 : box.y0; y1 = y0 + dy * best; x0 = x1 = x;
    }
    res.push({k, d: best, x0, y0, x1, y1});
  }
  return res;
}

/* Dolap için otomatik değerler (çekmece / raf sayısı, çekmece bölümü) */
function cabAuto(it) {
  const h = it.h, w = it.w, st = it.style;
  let lowH = 0;
  if (st === 'drawer') lowH = it.split > 0 ? Math.min(it.split, h) : (h >= 1.4 ? clamp(h * .4, .75, .95) : h);
  const rows = st === 'kitchen' ? 3 : Math.max(1, Math.round((lowH - .14) / .19));
  const cols = Math.max(1, Math.round(w / .45));
  let shelves;
  switch (st) {
    case 'otc': shelves = Math.max(2, Math.round((h - .5 - .3) / .34)); break;
    case 'cosmetic': shelves = Math.max(2, Math.round((h - .62 - .28) / .32)); break;
    case 'metal': shelves = Math.max(3, Math.round(h / .42)); break;
    case 'gondola': shelves = Math.max(2, Math.round((h - .14) / .34)); break;
    case 'glass': shelves = 4; break;
    default: shelves = Math.max(2, Math.round((h - .2) / .36));
  }
  return {lowH, rows, cols, shelves};
}

/* =====================================================================
   2B plan: çizim + etkileşim
   ===================================================================== */

const LIGHT_PLAN = {bg: '#FFFFFF', floor: '#FFFFFF', grid: '#EEF0EC', grid2: '#DADFD7', wall: '#2C3330', ink: '#1B211F', muted: '#6F7974',
  accent: '#1F7A5A', danger: '#C23A2B', warn: '#B26B12', ok: '#2E8555', dark: false};
function planColors() {
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  return {bg: g('--plan-bg'), floor: g('--plan-floor'), grid: g('--plan-grid'), grid2: g('--plan-grid2'), wall: g('--plan-wall'), ink: g('--plan-ink'),
    muted: g('--plan-muted'), accent: g('--accent'), danger: g('--danger'), warn: g('--warn'), ok: g('--ok'), dark: document.documentElement.dataset.mode === 'dark'};
}

/* ---------- Çizim (ekrana, küçük resme ve PNG'ye ortak) ---------- */
function drawPlan(ctx, P, V, o) {
  const C = o.C, s = V.s, W = P.shop.w, D = P.shop.d, dpr = o.dpr, F = o.fs || 1;
  const segs = o.segs, A = o.A;
  const WT = () => ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * V.ox, dpr * V.oy);
  const ST = () => ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const px = 1 / s;
  const sx = x => x * s + V.ox, sy = y => y * s + V.oy;
  ST();
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, o.w, o.h);
  WT();
  const ftint = k => { const F = FLOOR_BY_KEY[k]; return F ? mixHex(C.floor.startsWith('#') ? C.floor : '#FFFFFF', F.base, C.dark ? .16 : .4) : null; };
  ctx.fillStyle = ftint(P.floor) || C.floor; ctx.fillRect(0, 0, W, D);
  for (const r of P.rooms) if (r.floor) { ctx.fillStyle = ftint(r.floor); ctx.fillRect(r.x, r.y, r.w, r.d); }

  // Izgara
  if (o.grid) {
    const step = s * 0.1 >= 7 ? 0.1 : s * 0.5 >= 7 ? 0.5 : 1;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, D); ctx.clip();
    for (const [st, col, lw] of [[step, C.grid, 1], [step < 1 ? 1 : 5, C.grid2, 1]]) {
      ctx.beginPath();
      for (let x = st; x < W; x += st) { ctx.moveTo(x, 0); ctx.lineTo(x, D); }
      for (let y = st; y < D; y += st) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.strokeStyle = col; ctx.lineWidth = lw * px; ctx.stroke();
    }
    ctx.restore();
  }

  // Odalar (zemin rengi)
  for (const r of P.rooms) {
    ctx.fillStyle = rgba(r.color, C.dark ? 0.2 : 0.14);
    ctx.fillRect(r.x, r.y, r.w, r.d);
  }

  // İnsan boşlukları (eşyaların önü / arkası)
  if (o.clear) {
    for (const it of P.items) {
      if (!isSolid(it)) continue;
      for (const side of ['f', 'b']) {
        const poly = clearPoly(it, side); if (!poly) continue;
        const badz = A.zoneBad.has(it.id + ':' + side);
        pathPoly(ctx, poly);
        ctx.fillStyle = rgba(badz ? C.danger : C.ok, badz ? 0.16 : 0.08); ctx.fill();
        ctx.setLineDash([4 * px, 3 * px]); ctx.strokeStyle = rgba(badz ? C.danger : C.ok, badz ? .8 : .45); ctx.lineWidth = 1 * px; ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  // Boşluk (geçiş) öğeleri
  for (const it of P.items) if (it.type === 'zone') {
    const badz = A.zoneBad.has(it.id + ':z');
    withItem(ctx, it, () => {
      ctx.beginPath();
      if (it.style === 'circle') ctx.ellipse(0, 0, it.w / 2, it.d / 2, 0, 0, Math.PI * 2); else ctx.rect(-it.w / 2, -it.d / 2, it.w, it.d);
      ctx.fillStyle = rgba(badz ? C.danger : C.ok, badz ? .2 : .14); ctx.fill();
      ctx.setLineDash([6 * px, 4 * px]); ctx.strokeStyle = badz ? C.danger : C.ok; ctx.lineWidth = 1.5 * px; ctx.stroke(); ctx.setLineDash([]);
      if (it.style !== 'circle') { // genişlik okları
        const y = 0, a = -it.w / 2 + .06, b = it.w / 2 - .06, k = Math.min(.08, it.w / 6);
        ctx.beginPath(); ctx.moveTo(a, y); ctx.lineTo(b, y);
        ctx.moveTo(a + k, y - k); ctx.lineTo(a, y); ctx.lineTo(a + k, y + k);
        ctx.moveTo(b - k, y - k); ctx.lineTo(b, y); ctx.lineTo(b - k, y + k);
        ctx.lineWidth = 1.2 * px; ctx.stroke();
      }
    });
  }

  // Katı eşyalar
  for (const it of P.items) if (isSolid(it)) {
    withItem(ctx, it, () => drawSolid(ctx, it, C, px, A.bad.has(it.id)));
  }

  // Duvarlar
  ctx.fillStyle = C.wall;
  for (const r of wallPieces(segs)) ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);

  // Kapı ve pencereler
  for (const it of P.items) if (isOpening(it)) {
    const onWall = !!wallOf(it, segs);
    withItem(ctx, it, () => it.type === 'door' ? drawDoor(ctx, it, C, px, onWall, A.zoneBad.has(it.id + ':s')) : drawWindow(ctx, it, C, px, onWall));
  }

  // İnsanlar
  for (const it of P.items) if (it.type === 'human') withItem(ctx, it, () => drawHuman(ctx, it, C, px));

  // ---- Ekran uzayı: yazılar
  ST();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const halo = (t, x, y) => { ctx.lineWidth = 3.5 * F; ctx.strokeStyle = rgba(C.floor.startsWith('#') ? C.floor : '#ffffff', .9); ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); ctx.fillText(t, x, y); };
  if (o.labels) {
    for (const r of P.rooms) {
      const cx = sx(r.x + r.w / 2), cy = sy(r.y + r.d / 2), rw = r.w * s, rh = r.d * s;
      ctx.font = `700 ${clamp(s * 0.28, 11, 15) * F}px ${getFont()}`;
      const tw = ctx.measureText(r.name).width;
      const area = fmtA(r.w * r.d) + ' m²';
      const dimsT = `${fmtM(r.w)} × ${fmtM(r.d)} m`;
      const fitsDims = o.roomDims && (ctx.save(), ctx.font = `500 ${clamp(s * 0.22, 10, 13) * F}px ${getMono()}`, ctx.measureText(dimsT).width < rw - 12 * F);
      ctx.restore();
      if (fitsDims && rw > tw + 10 && rh > 56 * F) {
        ctx.fillStyle = C.ink; halo(r.name, cx, cy - 15 * F);
        ctx.font = `500 ${clamp(s * 0.22, 10, 13) * F}px ${getMono()}`; ctx.fillStyle = C.muted; halo(area, cx, cy + 2 * F); halo(dimsT, cx, cy + 17 * F);
      } else if (rw > tw + 10 && rh > 34 * F) {
        ctx.fillStyle = C.ink; halo(r.name, cx, cy - 8 * F);
        ctx.font = `500 ${clamp(s * 0.22, 10, 13) * F}px ${getMono()}`; ctx.fillStyle = C.muted; halo(area, cx, cy + 9 * F);
      } else if (rw > 40 * F && rh > 16 * F) {
        ctx.font = `500 ${10 * F}px ${getMono()}`; ctx.fillStyle = C.muted; halo(area, cx, cy);
      }
    }
    const fItem = `600 ${10.5 * F}px ${getFont()}`;
    ctx.font = fItem;
    for (const it of P.items) {
      if (!(isSolid(it) || it.type === 'zone') || it.type === 'column') continue;
      let t = it.type === 'zone' ? (it.style === 'circle' ? 'Ø ' + fmtCm(it.w) : fmtCm(Math.min(it.w, it.d)) + ' cm') : it.name;
      if (!t) continue;
      const long = it.w >= it.d, L = (long ? it.w : it.d) * s, Sh = (long ? it.d : it.w) * s;
      let tw = ctx.measureText(t).width;

      xs.push(0, P.shop.w); ys.push(0, P.shop.d);
      for (const r of P.rooms) if (r.id !== sel.id) { xs.push(r.x, r.x + r.w); ys.push(r.y, r.y + r.d); }
    } else {
      for (const r of wallPieces(Ed.segs)) { xs.push(r.x0, r.x1); ys.push(r.y0, r.y1); }
      for (const it of P.items) if (it.id !== sel.id && !skip.has(it.id) && (isSolid(it) || it.type === 'zone')) { const b = itemBox(it); xs.push(b.x0, b.x1, it.cx); ys.push(b.y0, b.y1, it.cy); }
    }
    this.targets = {xs, ys};
  },
  snapAxis(vals, targets, thr) { // vals: [kenar değerleri]; en küçük düzeltme
    let best = null;
    for (const v of vals) for (const t of targets) { const d = t - v; if (Math.abs(d) <= thr && (!best || Math.abs(d) < Math.abs(best.d))) best = {d, t}; }
    return best;
  },
  snapPt(wx, wy, fine) {
    if (!Settings.v.snap) return [r3(wx), r3(wy)];
    const P = Ed.P, thr = 10 / this.V.s;
    const xs = [0, P.shop.w], ys = [0, P.shop.d];
    for (const r of P.rooms) { xs.push(r.x, r.x + r.w); ys.push(r.y, r.y + r.d); }
    if (fine) { for (const r of wallPieces(Ed.segs)) { xs.push(r.x0, r.x1); ys.push(r.y0, r.y1); } for (const it of P.items) if (isSolid(it)) { const b = itemBox(it); xs.push(b.x0, b.x1); ys.push(b.y0, b.y1); } }
    const bx = this.snapAxis([wx], xs, thr), by = this.snapAxis([wy], ys, thr);
    return [r3(bx ? bx.t : Math.round(wx / GRID) * GRID), r3(by ? by.t : Math.round(wy / GRID) * GRID)];
  },
  doMove(a, wx, wy, e) {
    const dx = wx - a.w0[0], dy = wy - a.w0[1];
    const snap = Settings.v.snap && !e.altKey, thr = 9 / this.V.s;
    const o = Ed.objOf(a.sel); if (!o) return;
    this.guides = [];
    if (a.sel.k === 'room') {
      let x = a.o0.x + dx, y = a.o0.y + dy;
      if (snap) {
        const bx = this.snapAxis([x, x + o.w], this.targets.xs, thr), by = this.snapAxis([y, y + o.d], this.targets.ys, thr);
        if (bx) { x += bx.d; this.guides.push({x: bx.t}); } else x = Math.round(x / GRID) * GRID;
        if (by) { y += by.d; this.guides.push({y: by.t}); } else y = Math.round(y / GRID) * GRID;
      }
      o.x = r3(x); o.y = r3(y);
      const mx = o.x - a.o0.x, my = o.y - a.o0.y;
      for (const c of a.carry) { c.it.cx = r3(c.cx + mx); c.it.cy = r3(c.cy + my); }
      Ed.live(); return;
    }
    let cx = a.o0.cx + dx, cy = a.o0.cy + dy;
    if (isOpening(o)) { // kapı / pencere: duvara oturt, duvar boyunca kaydır
      const seg = nearestWall(Ed.segs, cx, cy, Math.max(0.6, 36 / this.V.s));
      if (seg) {
        let along = seg.h ? cx : cy;
        if (snap) along = Math.round((along - o.w / 2) / GRID) * GRID + o.w / 2;
        if (a.seg0 === undefined) a.seg0 = wallOf(a.o0, Ed.segs);
        const sameWall = a.seg0 && seg.h === a.seg0.h && Math.abs(seg.c - a.seg0.c) < .01;
        seatOnWall(o, seg, along, !sameWall);
        if (sameWall) { o.rot = a.o0.rot; o.flip = a.o0.flip; }
        o.cx = r3(o.cx); o.cy = r3(o.cy);
        Ed.live(); return;
      }
    }
    if (snap) {
      const [hx, hy] = halfExt(o);
      const bx = this.snapAxis([cx - hx, cx + hx], this.targets.xs, thr), by = this.snapAxis([cy - hy, cy + hy], this.targets.ys, thr);
      if (bx) { cx += bx.d; this.guides.push({x: bx.t}); } else cx = Math.round((cx - hx) / GRID) * GRID + hx;
      if (by) { cy += by.d; this.guides.push({y: by.t}); } else cy = Math.round((cy - hy) / GRID) * GRID + hy;
    }
    o.cx = r3(cx); o.cy = r3(cy);
    Ed.live();
  },
  startGroupMove(ids, wx, wy, x, y, touch) {
    const items = ids.map(id => Ed.P.items.find(i => i.id === id)).filter(Boolean);
    const box = items.reduce((b, it) => { const q = itemBox(it); return {x0: Math.min(b.x0, q.x0), y0: Math.min(b.y0, q.y0), x1: Math.max(b.x1, q.x1), y1: Math.max(b.y1, q.y1)}; }, {x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity});
    this.act = {type: 'gmove', items: items.map(it => ({it, cx: it.cx, cy: it.cy})), box, w0: [wx, wy], before: Ed.snap(), x, y, moved: false, touch};
    this.collectTargets({k: 'item', id: '__grp'}, ids);
  },
  doGroupMove(a, wx, wy, e) {
    let dx = wx - a.w0[0], dy = wy - a.w0[1];
    this.guides = [];
    if (Settings.v.snap && !e.altKey) {
      const thr = 9 / this.V.s, b = a.box;
      const bx = this.snapAxis([b.x0 + dx, b.x1 + dx], this.targets.xs, thr), by = this.snapAxis([b.y0 + dy, b.y1 + dy], this.targets.ys, thr);
      if (bx) { dx += bx.d; this.guides.push({x: bx.t}); } else dx = Math.round((b.x0 + dx) / GRID) * GRID - b.x0;
      if (by) { dy += by.d; this.guides.push({y: by.t}); } else dy = Math.round((b.y0 + dy) / GRID) * GRID - b.y0;
    }
    for (const c of a.items) { c.it.cx = r3(c.cx + dx); c.it.cy = r3(c.cy + dy); }
    Ed.live();
  },
  doResize(a, wx, wy) {
    const o = Ed.objOf(Ed.sel), o0 = a.o0, {hx, hy} = a.h; if (!o) return;
    const snap = Settings.v.snap, thr = 9 / this.V.s;
    this.guides = [];
    if (Ed.sel.k === 'room') {
      let x0 = o0.x, y0 = o0.y, x1 = o0.x + o0.w, y1 = o0.y + o0.d;
      const sn = (v, T, g) => { if (!snap) return r3(v); const b = this.snapAxis([v], T, thr); if (b) { this.guides.push(g(b.t)); return b.t; } return Math.round(v / GRID) * GRID; };
      if (hx < 0) x0 = Math.min(sn(wx, this.targets.xs, t => ({x: t})), x1 - MIN_ROOM);
      if (hx > 0) x1 = Math.max(sn(wx, this.targets.xs, t => ({x: t})), x0 + MIN_ROOM);
      if (hy < 0) y0 = Math.min(sn(wy, this.targets.ys, t => ({y: t})), y1 - MIN_ROOM);
      if (hy > 0) y1 = Math.max(sn(wy, this.targets.ys, t => ({y: t})), y0 + MIN_ROOM);
      o.x = r3(x0); o.y = r3(y0); o.w = r3(x1 - x0); o.d = r3(y1 - y0);
      Ed.live(); return;
    }
    const [lx, ly] = rotPt(wx - o0.cx, wy - o0.cy, -o0.rot);
    const q = quarter(o0.rot);
    let w = o0.w, d = o0.d, ccx = 0, ccy = 0;
    const fit = (len, ax, dir, axisLocal) => { // uzunluğu yapışmayla ayarla
      if (!snap) return Math.max(MIN_ITEM, r3(len));
      len = Math.max(MIN_ITEM, len);
      if (q >= 0) { // eksene hizalı: hareket eden kenarı hedeflere yapıştır
        const [ux, uy] = rotPt(axisLocal === 'x' ? 1 : 0, axisLocal === 'y' ? 1 : 0, o0.rot);
        const worldAxis = Math.abs(ux) > .5 ? 'x' : 'y', sign = worldAxis === 'x' ? Math.sign(ux) : Math.sign(uy);
        const c0 = worldAxis === 'x' ? o0.cx : o0.cy;
        const edge = c0 + sign * (ax + dir * len);
        const b = this.snapAxis([edge], worldAxis === 'x' ? this.targets.xs : this.targets.ys, thr);
        if (b) { this.guides.push(worldAxis === 'x' ? {x: b.t} : {y: b.t}); return Math.max(MIN_ITEM, r3(dir * ((b.t - c0) * sign - ax))); }
      }
      return Math.max(MIN_ITEM, Math.round(len / 0.01) * 0.01);
    };
    if (hx) { const ax = -hx * o0.w / 2; w = fit(hx * (lx - ax), ax, hx, 'x'); ccx = ax + hx * w / 2; }
    if (hy) { const ay = -hy * o0.d / 2; d = fit(hy * (ly - ay), ay, hy, 'y'); ccy = ay + hy * d / 2; }
    if (isRound(o0)) { const m = Math.max(w, d); w = d = m; ccx = -hx * o0.w / 2 + hx * m / 2; ccy = -hy * o0.d / 2 + hy * m / 2; }
    const [dx, dy] = rotPt(ccx, ccy, o0.rot);
    o.w = r3(w); o.d = r3(d); o.cx = r3(o0.cx + dx); o.cy = r3(o0.cy + dy);
    if (isOpening(o)) { const s = wallOf(o0, Ed.segs); if (s) o.d = o0.d; }
    Ed.live();
  },
};

/* Kapı/pencerenin duvar üzerindeki iki yana boşluğu (köşe veya komşu duvara) */
function doorGaps(o, segs) {
  const s = wallOf(o, segs); if (!s) return [];
  const along = s.h ? o.cx : o.cy, a = along - o.w / 2, b = along + o.w / 2;
  let [lo, hi] = segRange(s);
  if (s.h && !s.outer) { lo = s.a; hi = s.b; }
  const stops = [lo, hi];
  for (const t of segs) { // dik duvarlar
    if (!!t.h === !!s.h) continue;
    if (s.c < t.a - s.t / 2 - .01 || s.c > t.b + s.t / 2 + .01) continue;
    if (t.c < lo || t.c > hi) continue;
    stops.push(t.c - t.t / 2, t.c + t.t / 2);
  }
  for (const op of s.open) if (op.id !== o.id) stops.push(op.a, op.b);
  let L = -Infinity, R = Infinity;
  for (const v of stops) { if (v <= a + 1e-3 && v > L) L = v; if (v >= b - 1e-3 && v < R) R = v; }
  const res = [];
  const off = s.h ? (s.c) : s.c;
  if (isFinite(L) && a - L > 0.005) res.push(s.h ? {d: a - L, x0: L, y0: off, x1: a, y1: off} : {d: a - L, x0: off, y0: L, x1: off, y1: a});
  if (isFinite(R) && R - b > 0.005) res.push(s.h ? {d: R - b, x0: b, y0: off, x1: R, y1: off} : {d: R - b, x0: off, y0: b, x1: off, y1: R});
  return res;
}

/* =====================================================================
   3B görünüm: yörünge kamera + insan gözüyle gezinti (WASD / joystick)

const THREE_URLS = ['./vendor/three.module.min.js', 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js'];

const View3D = {

  /* ---------- Malzemeler ---------- */

  glass() { return this.mat('#A9D4EE', {transparent: true, opacity: .28, roughness: .05, depthWrite: false}); },
  /* Seçilen zemin kaplaması; ızgara dükkân köşesine hizalı */
  floorMat(k, w, d, x, y) {
    const T = this.T, f = FLOOR_BY_KEY[k] || FLOORS[0];
    const t = new T.CanvasTexture(floorCanvas(f.k));

  skyTex(dark) {

    if (dark) { gr.addColorStop(0, '#0C1116'); gr.addColorStop(.6, '#18212A'); gr.addColorStop(1, '#222A2E'); }
    else { gr.addColorStop(0, '#A9CBE6'); gr.addColorStop(.55, '#D8E7F1'); gr.addColorStop(1, '#EEF1F0'); }

  /* Duvar diplerinde yumuşak koyulaşma (her iki yanda) */
  wallAo(root, s, a, b) {
    const T = this.T, len = b - a, mid = (a + b) / 2, wd = .32;
    const mat = this.mat('#000000', {map: this.wallAoTex(), transparent: true, opacity: .9, depthWrite: false});
    for (const sg of [-1, 1]) {
      const off = s.c + sg * (s.t / 2 + wd / 2);
      const grp = new T.Group();
      if (s.h) { grp.position.set(mid, .0045, off); grp.rotation.y = sg > 0 ? 0 : Math.PI; }
      else { grp.position.set(off, .0045, mid); grp.rotation.y = sg > 0 ? Math.PI / 2 : -Math.PI / 2; }
      const p = new T.Mesh(new T.PlaneGeometry(len, wd), mat); p.rotation.x = -Math.PI / 2; p.renderOrder = 1;

  /* ---------- Sahne ---------- */

  build() {
    if (!this.T || !Ed.P) return;
    this.sceneDirty = false;
    const T = this.T, P = Ed.P, W = P.shop.w, D = P.shop.d, H = P.shop.h || 2.8;
    const cs = getComputedStyle(document.documentElement), css = n => cs.getPropertyValue(n).trim();
    const dark = document.documentElement.dataset.mode === 'dark';
    this.clearRoot();
    this.prods = []; this.signInfo = null;
    const SW = 7;   // kaldırım genişliği
    this.scene.background = this.skyTex(dark);
    const root = this.root;
    const wallMode = Settings.v.walls || 'full';
    const wallH = wallMode === 'full' ? H : wallMode === 'half' ? 1.1 : 0.06;
    this.wallH = wallH;

    // Dış zemin: asfalt + dükkân çevresinde kaldırım
    const ground = new T.Mesh(new T.PlaneGeometry(W + 80, D + 80), this.mat(dark ? '#2B302E' : '#9A9C98', {roughness: .95}));
    ground.rotation.x = -Math.PI / 2; ground.position.set(W / 2, -0.03, D / 2); ground.receiveShadow = true; root.add(ground);
    const swM = new T.MeshStandardMaterial({color: 0xffffff, roughness: .9, map: this.floorTex(dark ? '#4A504D' : '#D6D2C9', dark ? '#3E4441' : '#C2BDB2', 3)});
    swM._own = true; swM.map.repeat.set((W + SW * 2) / 0.5, (D + SW * 2) / 0.5);
    const walk = new T.Mesh(new T.PlaneGeometry(W + SW * 2, D + SW * 2), swM);
    walk.rotation.x = -Math.PI / 2; walk.position.set(W / 2, -0.012, D / 2); walk.receiveShadow = true; root.add(walk);
    // Kaldırım bordürü
    const curb = this.mat(dark ? '#5C625F' : '#B9B4AA');
    for (const [x, z, w, d] of [[W / 2, -SW - .05, W + SW * 2 + .1, .1], [W / 2, D + SW + .05, W + SW * 2 + .1, .1], [-SW - .05, D / 2, .1, D + SW * 2], [W + SW + .05, D / 2, .1, D + SW * 2]]) this.box(root, w, .04, d, curb, x, -.01, z);

    // İç zemin (seramik)

    floor.rotation.x = -Math.PI / 2; floor.position.set(W / 2, 0, D / 2); floor.receiveShadow = true; floor.userData.floor = 1; root.add(floor);

    // Oda zeminleri + etiketleri
    for (const r of P.rooms) {
      const rm = r.floor && r.floor !== P.floor ? this.floorMat(r.floor, r.w, r.d, r.x, r.y) : this.mat('#FFFFFF', {visible: false});
      const m = new T.Mesh(new T.PlaneGeometry(r.w, r.d), rm);
      m.rotation.x = -Math.PI / 2; m.position.set(r.x + r.w / 2, 0.002, r.y + r.d / 2); m.receiveShadow = true;
      m.userData.pick = {k: 'room', id: r.id}; m.userData.floor = 1; root.add(m);
      if (!Settings.v.roomLabels3d && Settings.v.roomLabels3d !== undefined) continue;
      const {t, aspect} = this.textTex([r.name, fmtA(r.w * r.d) + ' m²'], dark ? '#FFFFFF' : '#1B211F');
      const lh = clamp(Math.min(r.w, r.d) * .22, .25, .7), lw = lh * aspect;
      const s = Math.min(1, (r.w * .85) / lw);
      const lm = new T.MeshBasicMaterial({map: t, transparent: true, depthWrite: false, opacity: .8}); lm._own = true;
      const lab = new T.Mesh(new T.PlaneGeometry(lw * s, lh * s), lm);
      lab.rotation.x = -Math.PI / 2; lab.position.set(r.x + r.w / 2, 0.006, r.y + r.d / 2); lab.renderOrder = 2;
      lab.userData.label = 1; root.add(lab);
    }

    // Duvarlar: iç yüz açık, dış yüz cephe rengi, üstü koyu; altta süpürgelik
    const side = this.mat(css('--scene-wall'), {roughness: .92});
    const facade = this.mat(dark ? '#8E8A82' : '#E3DDD2', {roughness: .95});
    const cap = this.mat(dark ? '#9FA8A3' : '#3A423F');
    const skirt = this.mat(dark ? '#6B6760' : '#9A958C', {roughness: .6});
    const addWall = (s, a, b, y0, y1, dz = 0) => {
      if (b - a < 0.005 || y1 - y0 < 0.005) return;
      const len = b - a, mid = (a + b) / 2, hh = y1 - y0 - dz;
      const mats = [side, side, cap, side, side, side];
      if (s.outer) mats[s.h ? (s.c < 0 ? 5 : 4) : (s.c < 0 ? 1 : 0)] = facade;
      const m = s.h ? this.box(root, len, hh, s.t, mats, mid, y0 + hh / 2, s.c) : this.box(root, s.t, hh, len, mats, s.c, y0 + hh / 2, mid);
      m.userData.wall = 1; m.userData.seg = s; m.userData.y0 = y0;

      if (y0 < .01 && wallH > .5) { // süpürgelik
        const k = s.h ? this.box(root, len, .08, s.t + .016, skirt, mid, .04, s.c) : this.box(root, s.t + .016, .08, len, skirt, s.c, .04, mid);
        k.castShadow = false;
      }

    for (const s of Ed.segs) {
      let cur = s.a; const ops = [...s.open].sort((p, q) => p.a - q.a);
      const dz = s.h ? 0 : 0.001; // dikey duvarlar 1 mm alçak: kesişimde titremeyi önler
      for (const o of ops) {
        if (o.a > cur) addWall(s, cur, o.a, 0, wallH, dz);
        const lo = Math.max(cur, o.a);
        if (o.elev > 0.01) addWall(s, lo, o.b, 0, Math.min(o.elev, wallH), dz);
        if (o.top < wallH - 0.01) addWall(s, lo, o.b, o.top, wallH, dz);
        cur = Math.max(cur, o.b);

      if (s.b > cur) addWall(s, cur, s.b, 0, wallH, dz);

    // Eşyalar

      if (!g) continue;
      g.position.set(it.cx, 0, it.cy); g.rotation.y = -(it.rot || 0) * D2R;

    this.flushProducts();

    // İnsan boşlukları (zeminde)
    if (Settings.v.clear) {
      const A = Ed.A;
      for (const it of P.items) {
        if (!isSolid(it)) continue;
        for (const sd of ['f', 'b']) {
          const v = sd === 'f' ? it.clear : it.clearB; if (!(v > 0)) continue;
          const bad = A.zoneBad.has(it.id + ':' + sd);

          m.rotation.x = -Math.PI / 2;

    else this.ceil = null;

    // Güneş / gölge kutusu

    this.sun.position.set(W / 2 + 7, 15, D / 2 + 10); this.sun.target.position.set(W / 2, 0, D / 2);

    this.updateSel();

  },
  /* Gezinirken tavan görünür, iç ışık artar */

  },
  buildCeiling(P, H) {
    const T = this.T, W = P.shop.w, D = P.shop.d, g = new T.Group();

  /* ---------- Eczane tabelası ---------- */
  buildSign(P, H, dark) {
    const T = this.T;
    let text = (P.sign ?? P.name ?? '').trim();
    if (!text) return;
    text = text.toLocaleUpperCase('tr-TR');
    if (!/ECZANE/.test(text)) text += ' ECZANESİ';
    // Hangi cephe: dış duvardaki (en geniş) giriş kapısı; yoksa ön (alt) duvar
    const doors = P.items.filter(it => it.type === 'door').map(it => ({it, s: wallOf(it, Ed.segs)})).filter(o => o.s && o.s.outer);
    doors.sort((a, b) => (b.it.style === 'double') - (a.it.style === 'double') || b.it.w - a.it.w);
    let s, along, doorTop = 2.2;
    if (doors.length) { s = doors[0].s; along = s.h ? doors[0].it.cx : doors[0].it.cy; doorTop = doors[0].it.h; }
    else { s = Ed.segs.find(q => q.outer && q.h && q.c > 0); along = P.shop.w / 2; }
    const [lo, hi] = segRange(s);
    const out = s.c < 0 ? -1 : 1;              // dışa doğru yön
    const face = s.c + out * s.t / 2;           // dış yüz hattı
    const tex = this.signTex(text);
    const sh = .62, sl = clamp(sh * tex.aspect, 2.2, Math.max(2.2, hi - lo - .4));
    along = clamp(along, lo + sl / 2 + .1, hi - sl / 2 - .1);

    const sm = new T.MeshStandardMaterial({map: tex.t, emissive: 0xffffff, emissiveMap: tex.t, emissiveIntensity: .55, roughness: .45}); sm._own = true;
    const frame = this.mat(dark ? '#3A3F3D' : '#2F3533', {roughness: .5, metalness: .3});
    const g = new T.Group();
    // Uzun kenar duvar boyunca; yüz dışarı
    const mats = [frame, frame, frame, frame, frame, frame];
    const depth = .14;
    let mesh;
    if (s.h) { mats[out > 0 ? 4 : 5] = sm; mesh = this.box(g, sl, sh, depth, mats, along, y, face + out * depth / 2); }
    else {
      mats[out > 0 ? 0 : 1] = sm; mesh = this.box(g, depth, sh, sl, mats, face + out * depth / 2, y, along);

    const bs = .58, bd = .1, off = .42;

    else { bm[4] = em; bm[5] = em; this.box(g, bs, bs, bd, bm, face + out * (off + .04), y + .02, bAlong); this.box(g, off, .04, .03, frame, face + out * off / 2, y + .02, bAlong); }

    g.userData.signSeg = s;
    this.root.add(g);
  },
  signTex(text) {
    const T = this.T, c = document.createElement('canvas'), g = c.getContext('2d');
    const Hh = 256, fs = 132;
    g.font = `800 ${fs}px ${getFont()}`;
    const tw = g.measureText(text).width;
    const Wd = Math.ceil(Math.min(4096, Hh + 90 + tw + 90));
    c.width = Wd; c.height = Hh;
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, Wd, Hh);
    g.fillStyle = '#D0102B'; g.fillRect(0, Hh - 18, Wd, 18); g.fillRect(0, 0, Wd, 10);

    g.fillStyle = '#FFFFFF'; g.font = `900 ${L * .82}px ${getFont()}`; g.textAlign = 'center'; g.textBaseline = 'middle';

  /* ---------- Dokular ve malzemeler ---------- */
  woodTex() {
    if (this._wood) return this._wood;

    const g = c.getContext('2d'); g.fillStyle = '#EDEDED'; g.fillRect(0, 0, 256, 512);

  /* ---------- Ürünler ---------- */
  prodMats() {
    if (this._pm) return this._pm;
    const T = this.T;
    const tex = draw => { const c = document.createElement('canvas'); c.width = c.height = 64; draw(c.getContext('2d')); const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t; };
    const med = ['#D7263D', '#1B6CA8', '#2A9D5C', '#F08A24', '#7B4FB8', '#0E8C8C', '#E0569B', '#243B6B', '#E8B923', '#5E6B73', '#3AAFA9', '#B5651D'].map((col, i) =>

      c.up.set(0, 1, 0);
