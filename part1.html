<title>Eczane Plan Masası</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --surface-2:#F6F8F4; --paper:#FAFBF7;
  --line:#D8DDD6; --line-strong:#B4BCB4; --ink:#1B2321; --muted:#5D6864; --faint:#8A948F;
  --accent:#1F7A5A; --accent-ink:#FFFFFF; --accent-soft:#DDF0E7; --accent-line:#8FCBB1;
  --warn:#A8690F; --warn-soft:#FBF0DB; --danger:#C2412D; --danger-soft:#FBE3DE; --ok:#1F7A5A;
  --grid-minor:#E9EDE7; --grid-major:#D5DBD3; --grid-meter:#C0C8BF; --wall:#2B3431; --wall-hatch:#8A948F;
  --shadow:0 1px 2px rgba(20,30,26,.08),0 10px 28px rgba(20,30,26,.10);
  --radius:10px; --radius-sm:7px;
  --font-ui:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Archivo',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --panel-w:340px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141817; --surface:#1D2321; --surface-2:#232A27; --paper:#191E1C;
    --line:#2C3431; --line-strong:#48524C; --ink:#E7ECE8; --muted:#9BA69F; --faint:#6C776F;
    --accent:#3FBF8F; --accent-ink:#0E1B15; --accent-soft:#1C3A2E; --accent-line:#2E7D5F;
    --warn:#E2A94C; --warn-soft:#3A2D14; --danger:#E7705B; --danger-soft:#3F211B; --ok:#3FBF8F;
    --grid-minor:#1F2523; --grid-major:#29312D; --grid-meter:#3A453F; --wall:#DDE4DF; --wall-hatch:#6C776F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141817; --surface:#1D2321; --surface-2:#232A27; --paper:#191E1C;
  --line:#2C3431; --line-strong:#48524C; --ink:#E7ECE8; --muted:#9BA69F; --faint:#6C776F;
  --accent:#3FBF8F; --accent-ink:#0E1B15; --accent-soft:#1C3A2E; --accent-line:#2E7D5F;
  --warn:#E2A94C; --warn-soft:#3A2D14; --danger:#E7705B; --danger-soft:#3F211B; --ok:#3FBF8F;
  --grid-minor:#1F2523; --grid-major:#29312D; --grid-meter:#3A453F; --wall:#DDE4DF; --wall-hatch:#6C776F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--font-ui);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr var(--panel-w);height:100dvh;min-height:100vh}
/* ---------- top bar ---------- */
.topbar{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:52px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px}
.brand h1{font:700 18px/1 var(--font-display);margin:0;letter-spacing:-.01em}
.brand small{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.tools{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:3px}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:var(--radius-sm);padding:6px 10px;color:var(--ink);font-weight:500;white-space:nowrap;min-height:34px}
.tbtn:hover{background:var(--surface)}
.tbtn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbtn svg{width:16px;height:16px;flex:none}
.tbtn kbd{font:600 10px/1 var(--font-mono);opacity:.6;padding:2px 4px;border:1px solid currentColor;border-radius:4px}
.tbtn.active kbd{opacity:.8}
.sep{width:1px;height:26px;background:var(--line);margin:0 2px}
.actions{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:6px 10px;min-height:34px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.ibtn:hover{background:var(--surface-2)}
.ibtn:disabled{opacity:.4;cursor:default}
.ibtn.on{background:var(--accent-soft);border-color:var(--accent-line)}
.ibtn svg{width:16px;height:16px}
.ibtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* ---------- canvas ---------- */
.stage{position:relative;overflow:hidden;background:var(--paper)}
canvas.plan{display:block;width:100%;height:100%;touch-action:none;cursor:default;user-select:none;-webkit-user-select:none}
canvas.plan.tool-pan{cursor:grab}
canvas.plan.tool-room,canvas.plan.tool-ruler{cursor:crosshair}
canvas.plan.dragging{cursor:grabbing}
.statusbar{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;align-items:center;font:500 12px/1 var(--font-mono);color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:999px;padding:6px 10px;pointer-events:none;backdrop-filter:blur(6px)}
.statusbar b{color:var(--ink);font-weight:600}
.statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.statusbar .dot.pending{background:var(--warn)}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.zoomctl .ibtn{padding:6px 9px;min-width:34px;justify-content:center}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:500;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow);max-width:90%;text-align:center}
.toast.show{opacity:1}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12px;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 6px 0;gap:2px}
.tab{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);background:var(--surface-2)}
.panel-body{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px;min-height:0;overscroll-behavior:contain}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.card.sel{border-color:var(--accent-line);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.card h3{margin:0;font:600 12px/1 var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h2{margin:0;font:700 16px/1.2 var(--font-display)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.field label{font-size:11px;color:var(--muted);letter-spacing:.02em}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:6px 8px;min-height:32px;font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.field input[type=text]{font-family:var(--font-ui)}
.field input:focus{border-color:var(--accent);outline:none}
.field.grow{flex:2}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:4px 8px;min-height:30px;font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.mini:hover{background:var(--surface-2)}
.mini.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.mini.on{background:var(--accent-soft);border-color:var(--accent-line)}
.mini svg{width:14px;height:14px}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted)}
.stat .v{font-family:var(--font-mono);font-weight:600;text-align:right;white-space:nowrap;min-width:0}
.stat{min-width:0;overflow:hidden}
.stat .v.big{font-size:18px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.roomlist{display:flex;flex-direction:column;gap:6px}
.room-item{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer}
.room-item:hover{background:var(--surface-2)}
.room-item.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.room-item .sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
.room-item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-item .dm{font:500 11px/1.3 var(--font-mono);color:var(--muted)}
.room-item .ar{font:600 13px/1 var(--font-mono);white-space:nowrap}
.room-item .warn{color:var(--danger)}
.hints{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.hints div{display:flex;gap:7px;align-items:flex-start}
.hints .ic{flex:none;width:16px;text-align:center;font-weight:700}
.hints .ok{color:var(--ok)}.hints .no{color:var(--danger)}.hints .so{color:var(--warn)}
.cmp{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;background:var(--surface-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip b{font-family:var(--font-mono)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips .chip{cursor:pointer}
.chips .chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.lib button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:76px}
.lib button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.lib canvas{width:64px;height:36px}
.lib .n{font-size:11.5px;font-weight:500;line-height:1.15;text-align:center}
.lib .d{font:500 10px/1 var(--font-mono);color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:7px 10px;min-height:34px}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:6px;border:2px solid transparent;padding:0}
.swatches button.on{border-color:var(--ink)}
.rotwrap{display:flex;gap:4px;align-items:center}
.rotwrap input{width:64px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:4px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.note{font-size:12px;color:var(--muted)}
.kbd{font:600 10.5px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.check .m{flex:none;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.check .m.ok{background:var(--accent-soft);color:var(--ok)}
.check .m.no{background:var(--danger-soft);color:var(--danger)}
.check .m.so{background:var(--warn-soft);color:var(--warn)}
textarea.json{width:100%;min-height:120px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);font:12px/1.4 var(--font-mono);padding:8px;resize:vertical}
.panel-toggle{display:none}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);max-width:min(560px,92vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 8px;font:700 18px/1.2 var(--font-display)}
/* ---------- mobile ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .topbar{grid-column:1}
  .brand small{display:none}
  .tbtn span.lbl{display:none}
  .tbtn kbd{display:none}
  .panel{border-left:0;border-top:1px solid var(--line);height:44dvh;transition:height .2s}
  .panel.collapsed{height:44px}
  .panel.collapsed .panel-body{display:none}
  .panel-toggle{display:flex;justify-content:center;align-items:center;height:auto}
  .tabs{padding:4px 4px 0}
  .zoomctl{bottom:10px}
  .actions .lbl{display:none}
  .hint{display:none}
}
@media print{
  .topbar,.panel,.zoomctl,.statusbar,.hint,.toast{display:none!important}
  .app{display:block;height:auto}
  .stage{height:100vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><h1>Eczane Plan Masası</h1><small id="shopDims">13,65 × 6,95 m</small></div>
    <div class="tools" role="toolbar" aria-label="Araçlar">
      <button class="tbtn active" data-tool="select" title="Seç / Taşı (V)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2l10 6-4.5 1.2L6 13z"/></svg><span class="lbl">Seç</span><kbd>V</kbd></button>
      <button class="tbtn" data-tool="room" title="Oda çiz (O)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10"/><path d="M8 3v10M2 8h6"/></svg><span class="lbl">Oda çiz</span><kbd>O</kbd></button>
      <button class="tbtn" data-tool="ruler" title="Cetvel (C)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 11l9-9 3 3-9 9z"/><path d="M5 8l1.5 1.5M7.5 5.5L9 7M4 10l1 1"/></svg><span class="lbl">Cetvel</span><kbd>C</kbd></button>
      <button class="tbtn" data-tool="pan" title="Kaydır (H)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8V3.5a1 1 0 012 0V7m0-1V2.5a1 1 0 012 0V7m0-1.5a1 1 0 012 0V8m0-.5a1 1 0 012 0V10c0 3-2 5-5 5s-4-1.5-6-5c-.5-1 .5-2 1.5-1.2L5 10"/></svg><span class="lbl">Kaydır</span><kbd>H</kbd></button>
    </div>
    <div class="actions">
      <button class="ibtn" id="btnUndo" title="Geri al (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4L2 8l4 4"/><path d="M2 8h7a4 4 0 010 8"/></svg></button>
      <button class="ibtn" id="btnRedo" title="Yinele (Ctrl+Y)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 4l4 4-4 4"/><path d="M14 8H7a4 4 0 000 8"/></svg></button>
      <span class="sep"></span>
      <button class="ibtn on" id="btnSnap" title="Mıknatıs / ızgaraya yapış (S)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2v6a4 4 0 008 0V2"/><path d="M4 2h3M9 2h3M4 6h3M9 6h3"/></svg><span class="lbl">Yapış</span></button>
      <button class="ibtn on" id="btnGrid" title="Izgara (G)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6h12M2 10h12M6 2v12M10 2v12"/></svg><span class="lbl">Izgara</span></button>
      <button class="ibtn on" id="btnHuman" title="İnsan ölçeği rozeti"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="3.5" r="1.8"/><path d="M4 8c1-1.5 7-1.5 8 0M8 7v5m0 0l-2.5 3M8 12l2.5 3"/></svg><span class="lbl">İnsan</span></button>
      <span class="sep"></span>
      <button class="ibtn" id="btnExport" title="Dışa aktar / Yedekle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8m0 0l-3-3m3 3l3-3"/><path d="M2 11v3h12v-3"/></svg><span class="lbl">Dışa aktar</span></button>
      <button class="ibtn" id="btnReset" title="Varsayılan yerleşime dön"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8a6 6 0 1011-3.5"/><path d="M2 3v4h4"/></svg><span class="lbl">Sıfırla</span></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas class="plan" id="plan"></canvas>
    <div class="hint" id="hint">Bir odaya veya eşyaya tıkla · sürükleyerek taşı · köşelerden boyutlandır</div>
    <div class="toast" id="toast"></div>
    <div class="statusbar" id="status"><span class="dot" id="saveDot"></span><span id="saveText">Kaydedildi</span><span>·</span><span id="zoomText">100%</span><span>·</span><span id="cursorText">—</span></div>
    <div class="zoomctl">
      <button class="ibtn" id="zoomOut" title="Uzaklaştır (−)">−</button>
      <button class="ibtn" id="zoomFit" title="Sığdır (F)">Sığdır</button>
      <button class="ibtn" id="zoomIn" title="Yakınlaştır (+)">+</button>
    </div>
  </main>

  <aside class="panel" id="panel">
    <button class="panel-toggle ibtn" id="panelToggle" aria-label="Paneli aç/kapat">▾ Panel</button>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="rooms">Odalar</button>
      <button class="tab" data-tab="lib">Eşya</button>
      <button class="tab" data-tab="summary">Özet</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<dialog id="dlgExport">
  <h2>Dışa aktar</h2>
  <div class="row" style="gap:6px;margin-bottom:10px">
    <button class="ibtn primary" id="expPng">PNG resim</button>
    <button class="ibtn" id="expJson">JSON yedek</button>
    <button class="ibtn" id="expPrint">Yazdır</button>
    <label class="ibtn" for="impFile" style="cursor:pointer">JSON yükle<input type="file" id="impFile" accept="application/json,.json" hidden></label>
  </div>
  <p class="note" style="margin:0 0 6px">Plan verisi (kopyalayıp bir yere kaydedebilirsin; geri yüklemek için buraya yapıştırıp “Yapıştırılanı yükle”ye bas):</p>
  <textarea class="json" id="jsonBox" spellcheck="false"></textarea>
  <div class="row" style="justify-content:flex-end;margin-top:8px">
    <button class="ibtn" id="expCopy">Panoya kopyala</button>
    <button class="ibtn" id="impPaste">Yapıştırılanı yükle</button>
    <button class="ibtn" id="dlgClose">Kapat</button>
  </div>
</dialog>
