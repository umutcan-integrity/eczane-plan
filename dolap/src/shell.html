<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Dolap ölçülerini gir: yan, raf, tabla, arkalık, kapak ve çekmece kesim ölçüleri milimetrik hesaplansın; 3B gör, levha planı çıkar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Dolap Tasarımı</title>
<script>
/* Tema, ilk boyamadan önce (yoksa ana uygulamanın teması) */
(function(){try{var s=JSON.parse(localStorage.getItem('dolap.v1.settings')||'null')||JSON.parse(localStorage.getItem('eczplan.v2.settings')||'{}');var m=s.mode||'auto';var r=document.documentElement;if(m==='glass'){r.dataset.glass='1';m='dark';}if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';r.dataset.mode=m;}catch(e){}})();
</script>
<style>
/*@CSS@*/
</style>
</head>
<body>
<div id="app" class="app" data-m="form">
  <header class="bar">
    <a class="logo" href="../" title="Ana sayfa"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M12 3v18M5 11h7"/><path d="M9.5 14v3M14.5 14v3" stroke-linecap="round"/></svg></i></a>
    <nav class="apptabs" aria-label="Uygulamalar"><a href="../">Eczane Plan</a><a class="on" aria-current="page" href="./">Dolap Tasarımı</a></nav>
    <button class="jobname" id="jobName" title="İşi yeniden adlandır"><b id="jobText">İş</b><small><i id="saveDot"></i><span id="saveText">Kaydedildi</span></small></button>
    <div class="grow"></div>
    <button class="icon-btn" id="btnUndo" title="Geri al (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
    <button class="icon-btn" id="btnRedo" title="Yinele (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
    <button class="btn hide-s" id="btnJobs" title="Kayıtlı işler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>İşler</span></button>
    <button class="btn primary" id="btnPrint" title="Kesim listesini yazdır / PDF kaydet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg><span>Yazdır</span></button>
    <button class="icon-btn" id="btnMenu" title="Menü"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </header>

  <nav class="mtabs seg" id="mtabs">
    <button data-v="form" class="on">Ölçüler</button>
    <button data-v="3d">3B</button>
    <button data-v="cut">Kesim</button>
    <button data-v="nest">Levha</button>
  </nav>

  <aside class="side" id="side">
    <div class="cabs" id="cabs"></div>
    <div class="form" id="form"></div>
  </aside>

  <main class="main" id="main">
    <div class="vtabs"><div class="seg" id="viewSeg">
      <button data-v="3d" class="on">3B görünüm</button>
      <button data-v="cut">Kesim listesi</button>
      <button data-v="nest">Levha planı</button>
    </div></div>
    <section class="stage" id="v3d">
      <canvas id="cv"></canvas>
      <div class="lbls" id="lbls"></div>
      <div class="tools float" id="tools3d"></div>
      <div class="pcard float" id="pcard" hidden></div>
      <div class="hint3d" id="hint3d">Sürükle: döndür · Tekerlek / iki parmak: yakınlaş · Sağ tık / iki parmak: kaydır · <b>Parçaya dokun: ölçüleri gör</b></div>
      <div class="loading3d" id="load3d">3B hazırlanıyor…</div>
    </section>
    <section class="pane" id="vcut" hidden></section>
    <section class="pane" id="vnest" hidden></section>
    <section class="empty-st" id="empty" hidden>
      <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="26" y="14" width="68" height="88" rx="4"/><path d="M60 14v88M26 58h34"/><path d="M52 66v12M68 66v12" stroke-linecap="round" stroke-width="4"/><path d="M34 102v8M86 102v8" stroke-linecap="round"/></svg>
      <h2>İlk dolabını oluştur</h2>
      <p>Dolap tipini, ölçülerini, bölmelerini ve içini adım adım soracağız. Kesim ölçüleri kendiliğinden hesaplanır.</p>
      <button class="btn primary big" id="emptyNew" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Dolap oluştur</button>
    </section>
  </main>
</div>

<div id="wiz" class="wiz" hidden></div>
<div id="print" class="print"></div>
<dialog id="modal" class="modal"></dialog>
<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast"></div>

<script>
/*@JS@*/
</script>
</body>
</html>
