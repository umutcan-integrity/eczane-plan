<style>
/* Galvaniz atölye: çelik kabuk, galvaniz sac paneller, iş güvenliği sarısı seçim/eylem */
@font-face{font-family:"Saira";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:50% 125%;src:url(vendor/fonts/saira-latin-ext-wdth-normal.woff2) format("woff2-variations"),url(vendor/fonts/saira-latin-ext-wdth-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Saira";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:50% 125%;src:url(vendor/fonts/saira-latin-wdth-normal.woff2) format("woff2-variations"),url(vendor/fonts/saira-latin-wdth-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#D6DADE; --surface:#F5F6F7; --surface-2:#ECEEF0; --surface-3:#E0E3E6;
  --line:#C4CAD0; --line-2:#A3ABB3; --ink:#161B20; --muted:#49515A; --faint:#5F6872;
  --steel:#262C32; --steel-2:#353C43; --steel-ink:#EDF0F2; --steel-muted:#AEB6BD; --steel-line:rgba(255,255,255,.14);
  --accent:#F5B700; --accent-ink:#1A1500; --accent-fg:#7A5800; --accent-line:#C79500;
  --accent-soft:color-mix(in srgb,#F5B700 24%,var(--surface));
  --danger:#C0352A; --warn:#B26400; --ok:#2C7A4B; --info:#2F64A8;
  --danger-soft:color-mix(in srgb,var(--danger) 11%,var(--surface));
  --warn-soft:color-mix(in srgb,#F5B700 22%,var(--surface));
  --ok-soft:color-mix(in srgb,var(--ok) 11%,var(--surface));
  --hazard:repeating-linear-gradient(-45deg,#F5B700 0 4px,#161B20 4px 8px);
  --scene-bg:#CDD2D7; --dimL:#C2410C; --dimW:#1D4ED8; --dimT:#7E22CE;
  --metal:linear-gradient(180deg,#F7F8F9,#ECEEF0);
  --shadow:inset 0 1px 0 rgba(255,255,255,.75),0 1px 2px rgba(10,14,18,.12),0 4px 12px rgba(10,14,18,.07);
  --shadow-lg:0 2px 4px rgba(10,14,18,.12),0 18px 42px rgba(10,14,18,.22);
  --r:6px; --r-sm:4px; --r-xs:3px;
  --font:"Saira",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Saira",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:372px; --bar-h:56px;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#121518; --surface:#1C2024; --surface-2:#22272C; --surface-3:#2A3036;
  --line:#313840; --line-2:#465058; --ink:#E7EAED; --muted:#A4ADB5; --faint:#8A939C;
  --steel:#0C0F12; --steel-2:#1B2025; --steel-ink:#E7EAED; --steel-muted:#98A1A9; --steel-line:rgba(255,255,255,.1);
  --accent-fg:#F5B700; --accent-line:#A67C00; --accent-soft:rgba(245,183,0,.15);
  --danger:#F07361; --warn:#F2B13C; --ok:#5BC48A; --info:#7EA6E0;
  --warn-soft:rgba(245,183,0,.13);
  --scene-bg:#15191C; --dimL:#FB923C; --dimW:#60A5FA; --dimT:#C084FC;
  --metal:linear-gradient(180deg,#20252A,#1C2024);
  --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 2px rgba(0,0,0,.45),0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 2px 6px rgba(0,0,0,.45),0 20px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);font-stretch:92%;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}
::selection{background:#F5B700;color:#1A1500}
:root{accent-color:#F5B700;caret-color:var(--ink);scrollbar-color:var(--line-2) transparent}
h1,h2,h3{font-stretch:78%;font-weight:750;letter-spacing:0}
svg{flex:none}
.grow{flex:1}
a{color:inherit}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--metal);box-shadow:var(--shadow);font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:active{box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink);font-weight:750;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16),0 1px 2px rgba(0,0,0,.15)}
.btn.primary:hover{background:#FFC21A}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.full{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--ink);padding:0;flex:none}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn:disabled{opacity:.35;cursor:default;background:transparent}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.sm svg{width:17px;height:17px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r-sm);padding:3px;gap:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.seg button{justify-content:center;border:0;background:transparent;border-radius:calc(var(--r-sm) - 3px);padding:0 14px;min-height:32px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg.sm button{min-height:28px;padding:0 10px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-2);background:var(--metal);border-radius:var(--r-sm);padding:4px 12px;font-size:13px;font-weight:600;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.chips button.on{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.chips button:disabled{opacity:.4;cursor:default}
.chips.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
.chips.blocks button{border-radius:var(--r-sm);flex-direction:column;padding:8px 6px 7px;gap:4px;font-size:12px;line-height:1.2;text-align:center}
.chips.blocks button svg{width:40px;height:34px}

/* ---------- top bar ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:var(--bar-h) minmax(0,1fr);background:var(--bg)}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));background:var(--steel);color:var(--steel-ink);border-bottom:3px solid var(--accent);z-index:20;min-width:0}
.bar .icon-btn{color:var(--steel-ink)}
.bar .icon-btn:hover{background:var(--steel-2)}
.bar .btn:not(.primary){background:var(--steel-2);border-color:var(--steel-line);color:var(--steel-ink);box-shadow:none}
.bar .btn:not(.primary):hover{background:#424A52}
.logo{display:inline-flex;text-decoration:none}
.logo i{width:34px;height:34px;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center}
.logo i svg{width:20px;height:20px}
.apptabs{display:inline-flex;background:rgba(0,0,0,.28);border-radius:var(--r-sm);padding:3px;gap:2px;margin:0 4px;flex:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.apptabs a{text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-muted);padding:6px 12px;border-radius:calc(var(--r-sm) - 1px);white-space:nowrap}
.apptabs a:hover{color:var(--steel-ink)}

.jobname{display:flex;flex-direction:column;align-items:flex-start;min-width:0;border:0;background:transparent;padding:3px 8px;border-radius:var(--r-xs);text-align:left;max-width:26vw}
.jobname:hover{background:var(--steel-2)}
.jobname b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.jobname small{font-size:11.5px;color:var(--steel-muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.jobname small i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.jobname small i.dirty{background:var(--warn)}
.mtabs{display:none}

/* ---------- side / form ---------- */
.side{background:var(--surface);background-image:var(--metal);border-right:1px solid var(--line-2);overflow:auto;overscroll-behavior:contain;min-height:0;padding-bottom:30px}
.cabs{padding:12px 12px 4px;display:flex;flex-direction:column;gap:6px}
.cabs-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.cabs-head b{flex:1;font-size:12.5px;font-weight:750;color:var(--ink);text-transform:uppercase;letter-spacing:.1em}
.cab{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 6px 7px 10px;background:var(--metal);box-shadow:var(--shadow);cursor:pointer;min-height:50px}
.cab:hover{border-color:var(--line-2)}
.cab.on{border-color:var(--accent-line);background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.cab .ic{width:30px;height:34px;flex:none;color:var(--muted)}
.cab.on .ic,.cab.on .tx small{color:var(--accent-ink)}
.cab.on .qty{background:rgba(0,0,0,.14)}
.cab .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.cab .tx b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab .tx small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cab .qty{font-size:12px;font-weight:700;background:var(--surface-3);border-radius:999px;padding:2px 8px;white-space:nowrap}
.cab .warnb{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:none}
.cab .warnb.w{background:var(--hazard);border-radius:2px;width:11px;height:11px}
.form{padding:4px 12px}
.grp{border-top:1px solid var(--line);padding:4px 0}
.grp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 2px;cursor:pointer;font-weight:750;font-size:15px;font-stretch:80%;text-transform:uppercase;letter-spacing:.04em;-webkit-user-select:none;user-select:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin:-4px 4px 0 auto;transition:transform .15s}
.grp[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.grp>summary small{font-weight:500;text-transform:none;letter-spacing:0;font-stretch:92%;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .body{display:flex;flex-direction:column;gap:12px;padding:2px 2px 14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.r3{grid-template-columns:1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:650;letter-spacing:.02em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld>small{font-size:11.5px;color:var(--faint);line-height:1.3}
.inpw{position:relative;display:flex;align-items:center}
.inpw i{position:absolute;right:10px;font-style:normal;font-size:12px;color:var(--faint);pointer-events:none}
.inp{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 34px 0 12px;font-size:16px;font-variant-numeric:tabular-nums}
.inp.txt{padding-right:11px}
.inp:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px color-mix(in srgb,#F5B700 35%,transparent)}
.inp.bad{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.inp::placeholder{color:var(--faint)}
select.inp{padding-right:28px;appearance:auto}
.chk{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;cursor:pointer;min-height:32px}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.step{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface);box-shadow:inset 0 1px 2px rgba(0,0,0,.08);height:40px}
.step button{width:36px;height:100%;border:0;background:transparent;font-size:18px;font-weight:600;color:var(--muted)}
.step button:hover{background:var(--surface-3);color:var(--ink)}
.step b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px;font-weight:750}
.lblrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lblrow>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.tip{font-size:12px;color:var(--muted);line-height:1.4;margin:0}
.secs{display:flex;flex-direction:column;gap:10px}
.sec{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h b{flex:1;font-size:13.5px}
.sec-h small{color:var(--muted);font-variant-numeric:tabular-nums}
.sec .row{gap:8px}
.mats{display:flex;flex-direction:column;gap:10px}
.mat{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:8px}
.mat-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--accent)}

/* özet / uyarılar */
.sum{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.sum h4{margin:0;font-size:12px;font-weight:750;color:var(--ink);text-transform:uppercase;letter-spacing:.1em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}
.iss{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.35;padding:7px 9px;border-radius:var(--r-xs);background:var(--danger-soft)}
.iss::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none;margin-top:5px}
.iss.warn{background:var(--warn-soft)}
.iss.warn::before{background:var(--hazard);border-radius:2px;width:10px;height:10px;margin-top:4px}
.iss.info{background:var(--surface-3)}
.iss.info::before{background:var(--info)}
.iss.ok{background:var(--ok-soft)}
.iss.ok::before{background:var(--ok)}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.vtabs{display:flex;justify-content:center;padding:10px 12px 0;position:absolute;left:0;right:0;top:0;z-index:6;pointer-events:none}
.vtabs .seg{pointer-events:auto;box-shadow:var(--shadow);background:var(--surface-3)}
.stage{flex:1;position:relative;min-height:0;background:var(--scene-bg);overflow:hidden;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:var(--surface);color:var(--ink);border:1.5px solid currentColor;border-radius:var(--r-sm);padding:1px 7px;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.15);will-change:transform}
.lbl em{font-style:normal;font-weight:600;opacity:.75;margin-right:4px}
.lbl.L{color:var(--dimL)}.lbl.W{color:var(--dimW)}.lbl.T{color:var(--dimT)}
.lbl.o{color:var(--ink);border-color:var(--line-2)}
.lbl.pn{color:var(--muted);border-color:transparent;background:color-mix(in srgb,var(--surface) 85%,transparent);font-weight:600;font-size:11px;box-shadow:none}
.float{background:var(--surface);background-image:var(--metal);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow)}
.tools{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;max-width:calc(100% - 24px)}
.tools .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.tools .tb{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:var(--r-xs);min-height:32px;padding:0 10px;font-weight:600;font-size:13px;color:var(--ink)}
.tools .tb:hover{background:var(--surface-3)}
.tools .tb.on{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.tools .tb svg{width:17px;height:17px}
.hint3d{position:absolute;left:12px;top:12px;max-width:min(300px,30%)!important;text-align:left!important;border-radius:var(--r-sm)!important;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:5px 10px;border-radius:999px;pointer-events:none;max-width:46%;text-align:right}
.loading3d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600;pointer-events:none}
.pcard{position:absolute;right:12px;top:60px;width:330px;max-height:calc(100% - 120px);overflow:auto;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;z-index:5}
.pc-h{display:flex;align-items:flex-start;gap:8px}
.pc-h div{flex:1;min-width:0}
.pc-h b{display:block;font-size:18px;line-height:1.2;font-stretch:80%;font-weight:750;text-transform:uppercase;letter-spacing:.02em}
.pc-h small{color:var(--muted);font-size:12px}
.pc-cut{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pc-cut .n{font-size:30px;font-weight:800;font-stretch:75%;letter-spacing:0}
.pc-cut .n.L{color:var(--dimL)}.pc-cut .n.W{color:var(--dimW)}.pc-cut .n.T{color:var(--dimT)}
.pc-cut .x{color:var(--faint);font-weight:600}
.pc-cut .u{color:var(--muted);font-size:12px;margin-left:2px}
.pc-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pc-f{font-size:12.5px;line-height:1.45;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-xs);padding:8px 10px;font-variant-numeric:tabular-nums}
.pc-f div+div{margin-top:3px}
.pc-f b{font-weight:700}
.pc-n{font-size:12.5px;line-height:1.4;margin:0;padding-left:18px;color:var(--ink)}
.pc-n li+li{margin-top:3px}
.ovr{display:flex;gap:6px;align-items:flex-end}
.ovr .fld{flex:1}
.badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r-xs);padding:2px 7px;background:var(--steel);color:var(--steel-ink);vertical-align:middle}
.badge.off{background:var(--surface-3);color:var(--muted)}

/* ---------- kesim listesi / levha ---------- */
.pane{flex:1;overflow:auto;padding:62px 18px 40px;min-height:0}
.pane-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ptool{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ptool h2{margin:0;font-size:19px;margin-right:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.mgrp{overflow:hidden}
.mgrp-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mgrp-h b{font-size:15px}
.mgrp-h .chipx{width:16px;height:16px;border-radius:5px;border:1px solid var(--line-2);flex:none}
.mgrp-h small{color:var(--muted);font-variant-numeric:tabular-nums}
.tbl-w{overflow-x:auto}
table.cl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.cl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.cl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.cl tr:last-child td{border-bottom:0}
table.cl tbody tr{cursor:pointer}
table.cl tbody tr:hover td{background:var(--surface-2)}
table.cl tbody tr.on td{background:var(--accent-soft)}
table.cl td.num,table.cl th.num{text-align:right;white-space:nowrap}
table.cl td.big{font-weight:780;font-size:15px}
table.cl td.no{color:var(--muted);font-weight:700;width:36px}
table.cl td .sub{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
table.cl td.off{opacity:.45;text-decoration:line-through}
.bsvg{width:44px;height:26px;display:block}
.bsvg rect{fill:var(--surface-3);stroke:var(--line-2)}
.bsvg line{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round}
.btxt{font-size:11px;color:var(--muted);white-space:nowrap}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tot div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.tot span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tot b{font-size:20px;font-variant-numeric:tabular-nums}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:14px 16px 16px}
.sheet{display:flex;flex-direction:column;gap:6px}
.sheet-t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet-t b{color:var(--ink)}
.sheet svg{width:100%;height:auto;display:block;border-radius:6px;background:var(--surface-3)}
.sheet svg .pl{fill:color-mix(in srgb,var(--surface-3) 70%,var(--line-2))}
.sheet svg .us{fill:url(#hatch)}
.sheet svg .pt{fill:var(--surface);stroke:var(--ink);stroke-width:2.2;cursor:pointer}
.sheet svg .pt:hover,.sheet svg .pt.on{fill:var(--accent-soft);stroke:var(--accent-fg)}
.sheet svg text{fill:var(--ink);font-family:var(--font);font-variant-numeric:tabular-nums;pointer-events:none}
.sheet svg .gr{stroke:var(--muted);stroke-width:2;opacity:.5}
.pnote{font-size:12.5px;color:var(--muted);margin:0}

/* ---------- modal / menu / toast ---------- */
dialog.modal{border:1px solid var(--line-2);padding:0;border-radius:var(--r);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg);width:min(460px,calc(100vw - 28px));max-height:calc(100dvh - 40px)}
dialog.modal.wide{width:min(760px,calc(100vw - 28px))}
dialog.modal::backdrop{background:rgba(10,15,13,.42);backdrop-filter:blur(2px)}
.mhead{display:flex;align-items:center;gap:8px;padding:18px 20px 6px}
.mhead h3{margin:0;font-size:18px;flex:1}
.mbody{padding:8px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:calc(100dvh - 190px)}
.mbody p{margin:0;color:var(--muted)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}
.menu{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;min-width:220px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:var(--r-xs);font-weight:550}
.menu button:hover{background:var(--surface-3)}
.menu button svg{width:18px;height:18px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .mseg{padding:6px 8px}
.menu .mseg .seg{display:flex}
.menu .mseg .seg button{flex:1;padding:0 6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:var(--steel);color:var(--steel-ink);border:1px solid var(--accent);padding:10px 18px;border-radius:var(--r-sm);font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:200;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.presets button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:10px;display:flex;gap:10px;align-items:center;text-align:left}
.presets button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.presets svg{width:38px;height:44px;flex:none;color:var(--ink)}
.presets b{display:block;font-size:13.5px}
.presets small{color:var(--muted);font-size:11.5px;line-height:1.3;display:block}
.jobs{display:flex;flex-direction:column;gap:6px}
.job{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 8px 8px 12px}
.job.on{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line) inset}
.job div{flex:1;min-width:0;cursor:pointer}
.job b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job small{color:var(--muted);font-size:12px}
.help h4{margin:6px 0 2px;font-size:14px}
.help p,.help li{font-size:13px;color:var(--ink);line-height:1.5}
.help ul{margin:0;padding-left:18px}

/* ---------- yazdırma ---------- */
.print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{height:auto;background:#fff!important;color:#000}
  .app,dialog,.menu,.toast{display:none!important}
  .print{display:block;font:10.5pt/1.35 var(--font);color:#000}
  .print h1{font-size:17pt;margin:0 0 2mm}
  .print h2{font-size:12.5pt;margin:6mm 0 2mm;break-after:avoid}
  .print .meta{color:#444;font-size:9.5pt;margin-bottom:4mm}
  .print table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-bottom:3mm}
  .print th,.print td{border:0.3mm solid #999;padding:1.2mm 2mm;text-align:left;font-size:9.5pt}
  .print th{background:#eee;font-size:8.5pt;text-transform:uppercase}
  .print td.num,.print th.num{text-align:right}
  .print td.big{font-weight:800;font-size:10.5pt}
  .print tr{break-inside:avoid}
  .print .psheets{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
  .print .psheet{break-inside:avoid;font-size:9pt}
  .print .psheet svg{width:100%;height:auto;max-height:110mm;border:0.3mm solid #999}
  .print .psheet svg .pl{fill:#ddd}.print .psheet svg .us{fill:#f2f2f2}.print .psheet svg .pt{fill:#fff;stroke:#000;stroke-width:2.5}
  .print .psheet svg text{fill:#000;font-family:var(--font)}
  .print .pbreak{break-before:page}
  .print .bsvg{width:30px;height:18px}.print .bsvg rect{fill:#eee;stroke:#999}.print .bsvg line{stroke:#000;stroke-width:3.5}
}

/* ---------- mobil ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:var(--bar-h) auto minmax(0,1fr)}
  .mtabs{display:flex;margin:8px 10px 0;grid-row:2}
  .mtabs button{flex:1;padding:0 4px}
  .side,.main{grid-row:3;grid-column:1}
  .side{border-right:0;background:var(--bg)}
  .app[data-m="form"] .main{display:none}
  .app:not([data-m="form"]) .side{display:none}
  .vtabs{display:none}
  .pane{padding:12px 12px 40px}
  .cabs,.form{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 12px;margin-bottom:8px}
  .stage{margin-top:8px}
  .pcard{left:10px;right:10px;top:auto;bottom:62px;width:auto;max-height:52%}
  .hint3d{display:none}
  .tools{left:8px;bottom:8px;right:8px;max-width:none;justify-content:center}
  .jobname{max-width:30vw}
  .hide-s{display:none!important}
}
@media (max-width:560px){
  .bar{gap:2px;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
  .logo{display:none}
  .apptabs a{padding:6px 9px;font-size:12.5px}
  #btnPrint span{display:none}
  #btnPrint{padding:0 10px}
  .jobname{max-width:24vw;padding:3px 4px}
  .icon-btn{width:36px}
}
@media (max-width:400px){
  .apptabs a:first-child{max-width:64px;overflow:hidden;text-overflow:ellipsis}
  #btnRedo{display:none}
}

/* ---------- kolay kullanım: kartlar, büyük düğmeler ---------- */
.btn.big{min-height:50px;font-size:16px;padding:0 20px;border-radius:var(--r)}
.btn:disabled{opacity:.45;cursor:default}
.inp.big{min-height:56px;font-size:22px;font-weight:700;padding-left:16px;padding-right:44px}
.inp.big+i{font-size:14px;right:14px}
.inp.txt.big{font-size:18px;font-weight:600;padding-right:16px}
.step.big{height:50px}
.step.big button{width:50px;font-size:24px}
.step.big b{min-width:44px;font-size:20px}
.step button:disabled{opacity:.3;cursor:default}
.chk.big{font-size:15px;min-height:44px}
.chk.big input{width:22px;height:22px}
.chips button{min-height:38px;padding:5px 14px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tiles button{position:relative;border:1.5px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;transition:border-color .12s,background .12s,transform .12s;color:var(--ink)}
.tiles button:hover{border-color:var(--accent-line)}
.tiles button:active{transform:scale(.98)}
.tiles button.on{border-color:var(--accent-line);background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.tiles button.on small{color:color-mix(in srgb,var(--accent-ink) 75%,transparent)}
.tiles button.on svg{color:var(--accent-ink)!important}
.tiles button svg{width:52px;height:46px;color:var(--ink)}
.tiles button b{font-size:14.5px;line-height:1.2}
.tiles button small{font-size:12px;color:var(--muted);line-height:1.3}
.tiles button em{position:absolute;top:6px;right:6px;font-style:normal;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;background:var(--steel);color:var(--steel-ink);border-radius:var(--r-xs);padding:2px 7px}
.tiles.sm{grid-template-columns:repeat(5,1fr);gap:6px}
.tiles.sm button{padding:8px 2px 7px;gap:3px;border-radius:var(--r-sm)}
.tiles.sm button svg{width:34px;height:30px}
.tiles.sm button b{font-size:12px}
.tiles.mini4{grid-template-columns:repeat(4,1fr);gap:6px}
.tiles.mini4 button{padding:7px 2px;border-radius:var(--r-sm);gap:2px}
.tiles.mini4 button svg{width:34px;height:28px}
.tiles.mini4 button b{font-size:12.5px}
.tiles.mini{grid-template-columns:repeat(3,1fr)}
.tiles.mini button{padding:12px 4px}
.tiles.mini button b{font-size:17px}
.tiles.big{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tiles.big button{padding:14px 10px 12px;gap:6px}
.tiles.big button svg{width:64px;height:76px;color:var(--ink)}
.tiles.big2{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tiles.big2 button svg{width:64px;height:54px}
.tiles.big4{grid-template-columns:repeat(4,1fr);gap:10px}
.tiles.big4 button svg{width:64px;height:56px}
.tiles.big4 button b{font-size:16px}
.tiles.big svg[viewBox]{color:var(--ink)}
.sec .tiles.sm button.on svg{color:var(--accent-ink)}
.cabhead{display:flex;flex-direction:column;gap:10px;padding:6px 0 12px}
.cabhead .inp.nm{font-size:17px;font-weight:700;padding-right:12px}
.subh{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 -4px;padding-top:10px;border-top:1px dashed var(--line)}
.subh:first-child{border-top:0;padding-top:0;margin-top:0}
.empty-side{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;margin:8px 0}
.empty-side b{font-size:16px}
.empty-side p{margin:0 0 6px;color:var(--muted);font-size:13.5px}
.empty-st{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px 20px;text-align:center}
.empty-st svg{width:120px;height:120px;color:var(--muted);opacity:.85}
.empty-st h2{margin:4px 0 0;font-size:24px}
.empty-st p{margin:0 0 10px;color:var(--muted);max-width:420px}
.cab .ic{color:var(--ink)}

/* ---------- sihirbaz ---------- */
.wiz{position:fixed;inset:0;z-index:100;background:rgba(10,15,13,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
body.wiz-on{overflow:hidden}
.wiz-card{background:var(--surface);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow-lg);width:min(980px,100%);height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden}
.wiz-head{display:flex;align-items:center;gap:10px;padding:14px 16px 6px 22px}
.wiz-head div{flex:1;display:flex;flex-direction:column}
.wiz-head b{font-size:17px}
.wiz-head small{color:var(--muted);font-size:12.5px}
.wiz-steps{display:flex;gap:4px;padding:6px 18px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.wiz-steps::-webkit-scrollbar{display:none}
.wiz-steps button{flex:1;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:4px 2px;color:var(--muted);font-size:12px;font-weight:650;border-radius:10px}
.wiz-steps button i{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;background:var(--surface-3);color:var(--muted);border:2px solid transparent}
.wiz-steps button.done i{background:var(--steel);color:var(--accent);border-color:var(--steel)}
.wiz-steps button.on{color:var(--ink)}
.wiz-steps button.on i{background:var(--accent);color:var(--accent-ink)}
.wiz-steps button:disabled{opacity:.45;cursor:default}
.wiz-body{flex:1;overflow:auto;padding:18px 22px 24px;overscroll-behavior:contain}
.wiz-q h2{margin:0;font-size:24px;letter-spacing:-.01em}
.wiz-q p{margin:4px 0 16px;color:var(--muted)}
.wiz-cols{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
.wiz-cols:has(> :only-child){grid-template-columns:1fr}
.wiz-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.wiz-pv{position:sticky;top:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.wiz-pv svg{width:100%;height:auto;max-height:340px}
.pv-info{text-align:center;font-weight:650;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wiz-foot{display:flex;align-items:center;gap:10px;padding:12px 18px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.wiz-foot .btn.big{min-width:120px}
.dimf{display:flex;flex-direction:column;gap:8px}
.chips.sugg button{min-height:34px;font-size:13px;padding:4px 12px;font-variant-numeric:tabular-nums}
.sw.big button{width:36px;height:36px}
.tip.big{font-size:15px;color:var(--ink)}
/* temalı ön görünüş */
.pvw .pv-b{fill:var(--surface);stroke:var(--ink)}
.pvw .pv-f{fill:var(--accent);fill-opacity:.22;stroke:var(--accent-fg)}
.pvw .pv-h{stroke:var(--accent-fg);opacity:.5}
.pvw .pv-k{stroke:var(--ink)}
.pvw .pv-r{stroke:var(--muted)}
.pvw .pv-l{fill:var(--ink)}
.pvw .pv-x{stroke:var(--faint)}
.pvw .pv-d{stroke:var(--dimL)}
.pvw .pv-t{fill:var(--dimL);font-weight:700}
@media (max-width:760px){
  .wiz{padding:0;background:var(--surface)}
  .wiz-card{border-radius:0;height:100%;width:100%;box-shadow:none}
  .wiz-head{padding:10px 10px 4px 16px;padding-top:max(10px,env(safe-area-inset-top))}
  .wiz-steps{padding:4px 10px 8px}
  .wiz-steps button{min-width:44px;font-size:10.5px}
  .wiz-steps button i{width:26px;height:26px}
  .wiz-body{padding:14px 14px 20px}
  .wiz-q h2{font-size:21px}
  .wiz-q p{margin-bottom:12px;font-size:13.5px}
  .wiz-cols{grid-template-columns:1fr;gap:14px}
  .wiz-pv{order:-1;position:static;flex-direction:row;align-items:center;padding:8px 10px}
  .wiz-pv svg{width:96px;max-height:110px;flex:none}
  .wiz-pv .pv-info{text-align:left;flex:1}
  .wiz-pv .iss{display:none}
  .tiles.big,.tiles.big2{grid-template-columns:1fr 1fr}
  .tiles.big4{grid-template-columns:1fr 1fr}
  .tiles.big button svg{width:56px;height:64px}
  .wiz-foot .btn.big{min-width:0;flex:1}
  .wiz-foot .grow{display:none}
  .wiz-foot .btn.ghost{display:none}
}

/* ---------- ayrılan parça: kart ---------- */
.lbl.big{font-size:14px;padding:3px 9px;border-width:2px}
.lbl.big em{font-size:12px}
.turnbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.turnbar span{font-size:12px;font-weight:700;color:var(--muted);margin-right:auto}
.turnbar .btn{min-width:44px;font-size:15px}
.pc-sec{border-top:1px solid var(--line);padding-top:8px}
.pc-sec>summary{cursor:pointer;font-size:13px;font-weight:750;padding:4px 0;list-style:none;display:flex;align-items:center;gap:8px}
.pc-sec>summary::-webkit-details-marker{display:none}
.pc-sec>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin:-3px 2px 0 auto;transition:transform .15s}
.pc-sec[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.pc-sec[open]{display:flex;flex-direction:column;gap:8px}
.drows{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:70px 1fr;gap:2px 10px;align-items:center}
.drow .n{font-weight:800;font-size:13px}
.drow .n.L{color:var(--dimL)}.drow .n.W{color:var(--dimW)}.drow .n.T{color:var(--dimT)}
.drow .drv{grid-column:2;font-size:11.5px;color:var(--faint)}
.drow .drv.on{color:var(--accent-fg);font-weight:700}
.drow.off .inp{opacity:.55}

    const mkShelf = (id, y0, sub) => {
      const dep = adj ? Di - c.shelfSet - setIn : Di - setIn;
      const w0 = adj ? sx + c.shelfGap : sx, w1 = adj ? sx + sw - c.shelfGap : sx + sw;
      add({id, name: adj ? 'Raf (hareketli)' : 'Raf (sabit)', sub, kind: 'shelf', box: [w0, y0, zi0, w1, y0 + t, zi0 + dep], ax: 'xzy', bandL: [bb, 0],
        fL: adj ? fx([[sw, '(bölme iç genişliği)'], [2 * c.shelfGap, '(raf boşluğu)', -1]]).s : fx([[sw, '(bölme iç genişliği)']]).s,
        fW: fx([[Di, '(iç derinlik)'], [adj ? c.shelfSet : 0, '(önden geri çekme)', -1], [setIn, '(gömme kapak)', -1]]).s,
        notes: [adj ? 'Raf pimi ile taşınır (4 adet).' : 'Sabit raf: yanlara minifix / kavela ile bağlanır.', `Alt yüzü, alt tablanın üst yüzünden ${fmt(y0 - yb)} mm yukarıda.`]});
      if (adj) cnt.pin += 4;
    };
    if (doorsOn || !nd) {
      if (s.hanger) {
        let rodY = yHi - 60;
        if (s.shelves > 0) { const y0 = yHi - 350 - t; if (y0 - yLo > 700) { mkShelf(`shelf-${i}-1`, y0, `${tag ? tag + ' · ' : ''}şapkalık`); rodY = y0 - 60; SI.shelves = 1; } }
        if (rodY - yLo < 900) warn('warn', `${tag || 'Bölme'}: askı altında ${fmt(rodY - yLo)} mm boşluk var (uzun elbise için ~1500 mm gerekir).`);
        if (Di < 500) warn('warn', `İç derinlik ${fmt(Di)} mm; askı için en az 520–550 mm önerilir.`);
        const rl = sw - 2;
        cnt.rods.push(rl); R.extras.push({type: 'rod', x0: sx + 1, x1: sx + sw - 1, y: rodY, z: zi0 + Di / 2});
        SI.rodY = rodY;
      } else if (s.shelves > 0) {
        const ns = s.shelves, gap = (yHi - yLo - ns * t) / (ns + 1);
        if (gap < 60) warn('err', `${tag || 'Bölme'}: ${ns} raf için yükseklik yetersiz (raf arası ${fmt(gap)} mm).`);
        for (let k = 1; k <= ns; k++) mkShelf(`shelf-${i}-${k}`, yLo + k * gap + (k - 1) * t, `${tag ? tag + ' · ' : ''}${k}. raf`);
        SI.shelves = ns; SI.gap = gap;
        if (sw > (t >= 25 ? 1000 : 800)) warn('warn', `${tag || 'Bölme'}: ${fmt(sw)} mm raf açıklığı ${fmt(t)} mm malzemede sehim yapabilir; ara dikme ekle ya da daha kalın malzeme kullan.`);
      }
    }
    /* kapaklar */
    if (hasDoor) {
      const dy1 = FY1 - e, dh = dy1 - dy0;
      const nDoor = s.door === 'auto' ? (frontW > 600 ? 2 : 1) : s.door === '2' ? 2 : 1;
      const dw = nDoor === 2 ? (frontW - g) / 2 : frontW;
      const hc = hingeCount(dh), hp = hingeAt(dh, hc).map(v => fmt(v)).join(', ');
      const zz = inset ? [D - tf, D] : [D, D + tf];
      const edgeTxt = side => inset ? 'iç yüz' : side ? (half ? 'yarım bindirme' : 'dış kenar') : 'dikme ortası';
      const wText = nDoor === 2
        ? `${fmt(dw)} ((ön genişliği ${fmt(frontW)} − ${fmt(g)} kapak arası) ÷ 2)`
        : inset ? `${fmt(frontW)} (bölme iç genişliği ${fmt(sw)} − ${fmt(2 * e)} kenar payı)` : `${fmt(frontW)} (${edgeTxt(first)} → ${edgeTxt(last)}, kenar ${fmt(first ? e : g / 2)} / ${fmt(last ? e : g / 2)} mm boşluk)`;
      const hText = nd > 0 ? `${fmt(dh)} (çekmeceler üstünden ön üst kenarına, boşluklar düşülmüş)` : inset ? fx([[yt - yb, '(iç yükseklik)'], [2 * e, '(kenar payı)', -1]]).s : fx([[FY1 - FY0, base === 'plinth' ? '(yükseklik − baza)' : raised ? '(gövde yüksekliği)' : '(yükseklik)'], [2 * e, '(üst/alt kenar payı)', -1]]).s;
      for (let k = 0; k < nDoor; k++) {
        const hinge = nDoor === 2 ? (k ? 'R' : 'L') : s.hinge === 'R' ? 'R' : 'L';
        const x0 = fx0 + k * (dw + g);
        add({id: `door-${i}-${k}`, name: 'Kapak', sub: `${tag ? tag + ' · ' : ''}${nDoor === 2 ? (k ? 'sağ' : 'sol') : (hinge === 'L' ? 'soldan menteşeli' : 'sağdan menteşeli')}`, kind: 'door', mat: 'front', box: [x0, dy0, zz[0], x0 + dw, dy1, zz[1]], ax: 'yxz', bandL: [bf, bf], bandW: [bf, bf],
          hinge: {side: hinge, x: hinge === 'L' ? x0 : x0 + dw, z: zz[0]}, fL: hText, fW: wText,
          notes: [`${hc} menteşe: Ø35 kap, ${hinge === 'L' ? 'sol' : 'sağ'} kenardan 22,5 mm (kap merkezi); alttan ${hp} mm.`, cnt.hingeType + '.']});
        cnt.hinge += hc; cnt.handle++;
        if (dw > 600) warn('warn', `${tag || 'Bölme'}: kapak genişliği ${fmt(dw)} mm (> 600 mm); çift kapak önerilir.`);
        if (dw < 150) warn('warn', `${tag || 'Bölme'}: kapak genişliği ${fmt(dw)} mm çok dar.`);
      }
      SI.doors = nDoor;
      if (dh > 2400) warn('warn', `Kapak yüksekliği ${fmt(dh)} mm; levha boyunu ve kapak eğilmesini kontrol et.`);
    }
  }

  /* ---- baza ---- */
  if (base === 'plinth') {
    add({id: 'plinth', name: 'Baza (ön)', kind: 'plinth', box: [t, 0, D - c.plinthSet - t, W - t, bH, D - c.plinthSet], ax: 'xyz', fL: fx([[W, '(genişlik)'], [2 * t, '(2 yan)', -1]]).s, fW: `${fmt(bH)} (baza yüksekliği)`, notes: [`Yanların arasına, ön kenardan ${fmt(c.plinthSet)} mm içeride.`]});
  } else if (base === 'legs') {
    const z0 = D - c.plinthSet - t;
    add({id: 'plinth', name: 'Baza (klipsli)', kind: 'plinth', box: [0, 3, z0, W, bH, z0 + t], ax: 'xyz', fL: `${fmt(W)} (dolap genişliği; yan yana dolaplarda tek parça kesilebilir)`, fW: fx([[bH, '(ayak yüksekliği)'], [3, '(yer boşluğu)', -1]]).s, notes: ['Ayaklara klipsle takılır.']});
    const nl = W > 1000 ? 6 : 4;
    hw('leg', 'Ayarlı plastik ayak', nl, `${fmt(bH)} mm`); hw('clip', 'Baza klipsi', nl / 2);
    const xs = nl === 6 ? [50, W / 2, W - 50] : [50, W - 50];
    for (const lx of xs) for (const lz of [zb0 + 50, z0 - 35]) R.extras.push({type: 'leg', x: lx, z: lz, h: bH});
  } else if (base === 'frame') {
    const z1 = D - c.plinthSet;
    add({id: 'frame-f', name: 'Baza kasası', sub: 'ön', kind: 'plinth', box: [0, 0, z1 - t, W, bH, z1], ax: 'xyz', fL: fx([[W, '(genişlik)']]).s, fW: `${fmt(bH)} (baza yüksekliği)`});
    add({id: 'frame-b', name: 'Baza kasası', sub: 'arka', kind: 'plinth', box: [0, 0, zb0, W, bH, zb0 + t], ax: 'xyz', fL: fx([[W, '(genişlik)']]).s, fW: `${fmt(bH)} (baza yüksekliği)`});
    const fl = fx([[D, '(derinlik)'], [c.plinthSet, '(geri çekme)', -1], [zb0, '(arkalık)', -1], [2 * t, '(ön+arka baza)', -1]]);
    for (const [sd, x0] of [['L', 0], ['R', W - t]]) add({id: 'frame-' + sd, name: 'Baza kasası', sub: 'yan', kind: 'plinth', box: [x0, 0, zb0 + t, x0 + t, bH, z1 - t], ax: 'zyx', fL: fl.s, fW: `${fmt(bH)} (baza yüksekliği)`});
  } else if (base === 'wall') hw('hang', 'Dolap askı aparatı (sağ + sol)', 2, 'askı rayı ile');

  /* ---- hırdavat ---- */
  if (cnt.hinge) hw('hinge', cnt.hingeType, cnt.hinge, 'Ø35 kap, kapanış frenli önerilir');
  if (cnt.pin) hw('pin', 'Raf pimi', cnt.pin, 'Ø5');
  const rl = {}; for (const r of cnt.rails) rl[r] = (rl[r] || 0) + 1;
  for (const [l, q] of Object.entries(rl)) hw('rail' + l, RAIL_TYPE[c.railType] || 'Çekmece rayı', q, `${l} mm, takım (sağ + sol)`);
  const rd = {}; for (const r of cnt.rods) rd[r] = (rd[r] || 0) + 1;
  for (const [l, q] of Object.entries(rd)) { hw('rod' + l, 'Askı borusu (oval)', q, `${fmt(Number(l))} mm`); hw('rodh', 'Askı borusu rozeti', 2 * q); }
  if (cnt.handle) hw('handle', 'Kulp', cnt.handle);
  let joints = 0;
  for (const p of P) {
    if (['top', 'bottom', 'rail', 'sep'].includes(p.kind) || (p.kind === 'shelf' && p.name.includes('sabit'))) joints += 2 * (p.Wd > 450 ? 3 : 2);
    if (p.kind === 'divider') joints += 2 * (p.Wd > 450 ? 3 : 2);
  }
  hw('minifix', 'Minifix + kavela (tahmini)', joints, 'gövde birleşimleri');

  /* ---- kesim ölçüleri, kenar bandı, elle düzeltmeler ---- */
  for (const p of P) {
    p.cL = r1(p.L - (c.deduct ? p.bandW[0] + p.bandW[1] : 0));
    p.cW = r1(p.Wd - (c.deduct ? p.bandL[0] + p.bandL[1] : 0));
    p.L = r1(p.L); p.Wd = r1(p.Wd); p.T = r1(p.T);
    const o = c.over && c.over[p.id];
    if (o) { if (o.cL > 0) { p.cL0 = p.cL; p.cL = o.cL; p.ovr = true; } if (o.cW > 0) { p.cW0 = p.cW; p.cW = o.cW; p.ovr = true; } if (o.off) p.off = true; }
  }
  P.sort((a, b) => KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind));

  /* ---- montaj ve çakışma kontrolü ---- */
  const body = P.filter(p => !['door', 'dfront', 'dside', 'dfb', 'dbottom', 'plinth'].includes(p.kind));
  const bx = [0, 1, 2].map(a => [Math.min(...body.map(p => p.box[a])), Math.max(...body.map(p => p.box[a + 3]))]);
  const okW = Math.abs(bx[0][0]) < .05 && Math.abs(bx[0][1] - W) < .05, okH = Math.abs(bx[1][1] - H) < .05 && Math.abs(bx[1][0] - (raised ? y0c : 0)) < .05, okD = Math.abs(bx[2][0]) < .05 && Math.abs(bx[2][1] - D) < .05;
  if (okW && okH && okD) R.check.push({lvl: 'ok', t: `Montaj kontrolü: parçalar birleşince gövde ${fmt(W)} × ${fmt(Hc)} × ${fmt(D)} mm${raised ? ` (+ ${fmt(bH)} ${base === 'legs' ? 'ayak' : 'baza'} = ${fmt(H)})` : ''} çıkıyor.`});
  else R.check.push({lvl: 'err', t: `Montaj kontrolü tutmadı: parçalardan ${fmt(bx[0][1] - bx[0][0])} × ${fmt(bx[1][1] - bx[1][0])} × ${fmt(bx[2][1] - bx[2][0])} mm çıkıyor.`});
  const clash = [];
  for (let a = 0; a < P.length; a++) for (let b2 = a + 1; b2 < P.length; b2++) {
    const A = P[a].box, B = P[b2].box, ov = [0, 1, 2].map(k => Math.min(A[k + 3], B[k + 3]) - Math.max(A[k], B[k]));
    if (ov.every(v => v > .05)) {
      const backPair = (P[a].kind === 'back' || P[b2].kind === 'back') && c.back === 'groove' && Math.min(...ov) <= gd + .05;
      if (!backPair) clash.push(`${P[a].name}${P[a].sub ? ' (' + P[a].sub + ')' : ''} ↔ ${P[b2].name}${P[b2].sub ? ' (' + P[b2].sub + ')' : ''}`);
    }
  }
  if (clash.length) R.check.push({lvl: 'err', t: `Çakışan parçalar: ${clash.slice(0, 4).join(', ')}${clash.length > 4 ? ` +${clash.length - 4}` : ''}`});
  else R.check.push({lvl: 'ok', t: 'Çakışma kontrolü: hiçbir parça birbirinin içine girmiyor.'});
  const fdepth = P.some(p => p.kind === 'door' || p.kind === 'dfront') && !inset ? D + tf : D;
  R.dims = {W, H, D, fdepth, Wi, Hi, Di, Hc, y0c, yb, yt, bH, base, widths};
  R.sum = [
    ['İç genişlik', fmt(Wi)], ['İç yükseklik', fmt(Hi)], ['İç derinlik', fmt(Di)],
    ...(n > 1 ? [['Bölme genişlikleri', widths.map(v => fmt(v)).join(' / ')]] : []),
    ...(railLen && secs.some(s => s.drawers) ? [['Çekmece rayı', railLen + ' mm']] : []),
    ['Kapaklı toplam derinlik', fmt(fdepth)],
  ];
  R.ok = !R.warn.some(w => w.lvl === 'err') && !R.check.some(w => w.lvl === 'err');
  return R;
}

/* ---------- iş geneli: kesim satırları ---------- */
const bandSig = p => `${p.bandL[0]}|${p.bandL[1]}|${p.bandW[0]}|${p.bandW[1]}`;
function cutRows(job, cabs) {
  const groups = new Map();
  for (const c of cabs) {
    const R = calcCab(c);
    for (const p of R.parts) {
      /* aynı stok (ad + kalınlık + levha + desen) tek grupta: aynı levhalardan kesilir */
      const mat = job.mats[p.mat], gk = `${mat.label.trim().toLowerCase()}|${p.T}|${mat.L}|${mat.W}|${mat.grain ? 1 : 0}`;
      if (!groups.has(gk)) groups.set(gk, {key: gk, mat: p.mat, T: p.T, label: `${mat.label} · ${fmt(p.T)} mm`, m: mat, rows: new Map()});
      const G = groups.get(gk), rk = `${p.name}|${p.cL}|${p.cW}|${bandSig(p)}|${p.off ? 1 : 0}`;
      if (!G.rows.has(rk)) G.rows.set(rk, {name: p.name, kind: p.kind, cL: p.cL, cW: p.cW, L: p.L, Wd: p.Wd, T: p.T, bandL: p.bandL, bandW: p.bandW, off: !!p.off, ovr: !!p.ovr, n: 0, cabs: new Map(), refs: []});
      const row = G.rows.get(rk);
      row.n += c.qty; row.ovr = row.ovr || !!p.ovr;
      row.cabs.set(c.name, (row.cabs.get(c.name) || 0) + c.qty);
      row.refs.push({cab: c.id, id: p.id});
    }
  }
  const out = [...groups.values()].sort((a, b) => MAT_KEYS.indexOf(a.mat) - MAT_KEYS.indexOf(b.mat) || b.T - a.T);
  let no = 0;
  for (const G of out) {
    G.rows = [...G.rows.values()].sort((a, b) => a.off - b.off || KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || b.cL - a.cL || b.cW - a.cW);
    for (const r of G.rows) r.no = ++no;
    const act = G.rows.filter(r => !r.off);
    G.count = act.reduce((a, r) => a + r.n, 0);
    G.area = act.reduce((a, r) => a + r.n * r.cL * r.cW, 0) / 1e6;
  }
  return out;
}
/* kenar bandı metrajı (bitmiş ölçü üzerinden) */
function bandTotals(groups) {
  const m = new Map();
  for (const G of groups) for (const r of G.rows) {
    if (r.off) continue;
    for (const b of r.bandL) if (b > 0) m.set(b, (m.get(b) || 0) + r.L * r.n);
    for (const b of r.bandW) if (b > 0) m.set(b, (m.get(b) || 0) + r.Wd * r.n);
  }
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([t, mm]) => ({t, m: mm / 1000}));
}
function hwTotals(cabs) {
  const m = new Map();
  for (const c of cabs) for (const x of calcCab(c).hw) {
    const k = x.k + '|' + x.n + '|' + x.note;
    if (!m.has(k)) m.set(k, Object.assign({}, x, {q: 0}));
    m.get(k).q += x.q * c.qty;
  }
  return [...m.values()];
}

/* =====================================================================
   Levha yerleşimi (giyotin kesim): panel ebatlama makinesinde
   uçtan uca düz kesimlerle çıkarılabilecek yerleşim üretir.
   Levha x ekseni = levha boyu (desen yönü). Testere payı (kerf) ve
   kenar traşlama payı (trim) hesaba katılır.
   ===================================================================== */
function nestGroup(G, job) {
  const m = G.m, kerf = job.kerf, trim = job.trim, grain = !!m.grain;
  const PL = m.L - 2 * trim, PW = m.W - 2 * trim;
  const items = [];
  for (const r of G.rows) if (!r.off) for (let i = 0; i < r.n; i++) items.push({no: r.no, l: r.cL, w: r.cW, row: r});
  const fits = it => (it.l <= PL + 1e-6 && it.w <= PW + 1e-6) || (!grain && it.w <= PL + 1e-6 && it.l <= PW + 1e-6);
  const bad = items.filter(i => !fits(i)), ok = items.filter(fits);
  const orders = [
    (a, b) => b.l * b.w - a.l * a.w,
    (a, b) => Math.max(b.l, b.w) - Math.max(a.l, a.w) || b.l * b.w - a.l * a.w,
    (a, b) => b.l - a.l || b.w - a.w,
    (a, b) => b.w - a.w || b.l - a.l,
  ];
  let best = null;
  for (const ord of orders) for (const rule of ['short', 'long']) {
    const r = pack([...ok].sort(ord), rule);
    if (!best || r.sheets.length < best.sheets.length || (r.sheets.length === best.sheets.length && r.last < best.last)) best = r;
  }
  const sheets = best ? best.sheets : [];
  for (const sh of sheets) { sh.area = sh.parts.reduce((a, p) => a + p.a * p.b, 0); sh.use = sh.area / (PL * PW); }
  const used = sheets.reduce((a, s) => a + s.area, 0);
  return {sheets, bad, PL, PW, L: m.L, W: m.W, trim, kerf, grain, use: sheets.length ? used / (sheets.length * m.L * m.W) : 0};

  function pack(list, rule) {
    const sheets = [];
    const find = (sh, it) => {
      let bf = null;
      for (const f of sh.free) for (const rot of grain ? [0] : [0, 1]) {
        const a = rot ? it.w : it.l, b = rot ? it.l : it.w;
        if (a + kerf <= f.w + 1e-6 && b + kerf <= f.h + 1e-6) {
          const s1 = Math.min(f.w - a, f.h - b), s2 = Math.max(f.w - a, f.h - b);
          if (!bf || s1 < bf.s1 - 1e-6 || (Math.abs(s1 - bf.s1) < 1e-6 && s2 < bf.s2)) bf = {sh, f, rot, a, b, s1, s2};
        }
      }
      return bf;
    };
    for (const it of list) {
      let bf = null;
      for (const sh of sheets) { const c = find(sh, it); if (c && (!bf || c.s1 < bf.s1)) bf = c; }
      if (!bf) { const sh = {free: [{x: 0, y: 0, w: PL + kerf, h: PW + kerf}], parts: []}; sheets.push(sh); bf = find(sh, it); if (!bf) continue; }
      const {sh, f, a, b, rot} = bf, A = a + kerf, B = b + kerf;
      sh.parts.push({no: it.no, row: it.row, x: f.x, y: f.y, a, b, rot});
      sh.free.splice(sh.free.indexOf(f), 1);
      const wR = f.w - A, hR = f.h - B;
      const horiz = rule === 'short' ? wR < hR : wR >= hR;
      const r1 = horiz ? {x: f.x + A, y: f.y, w: wR, h: B} : {x: f.x + A, y: f.y, w: wR, h: f.h};
      const r2 = horiz ? {x: f.x, y: f.y + B, w: f.w, h: hR} : {x: f.x, y: f.y + B, w: A, h: hR};
      for (const r of [r1, r2]) if (r.w > kerf + 20 && r.h > kerf + 20) sh.free.push(r);
    }
    const lastSh = sheets[sheets.length - 1];
    return {sheets, last: lastSh ? lastSh.parts.reduce((a, p) => a + p.a * p.b, 0) : 0};
  }
}

/* Levha çizimi (SVG, mm ölçekli) */
function sheetSVG(N, sh, opts = {}) {
  const {L, W, trim} = N, fs = Math.max(40, Math.min(L, W) / 18);
  const svg = sv('svg', {viewBox: `0 0 ${L} ${W}`, role: 'img', 'aria-label': `Levha ${L} × ${W}`});
  svg.append(sv('defs', null, sv('pattern', {id: 'hatch', width: 40, height: 40, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)'}, sv('rect', {width: 40, height: 40, class: 'pl', style: 'fill:transparent'}), sv('line', {x1: 0, y1: 0, x2: 0, y2: 40, class: 'gr'}))));
  svg.append(sv('rect', {x: 0, y: 0, width: L, height: W, class: 'pl'}));
  svg.append(sv('rect', {x: trim, y: trim, width: N.PL, height: N.PW, class: 'us'}));
  if (N.grain) svg.append(sv('path', {d: `M${L - 260} ${W - 30}h200m-40 -18l40 18l-40 18`, fill: 'none', stroke: 'currentColor', 'stroke-width': 6, class: 'gr', style: 'opacity:.7'}));
  for (const p of sh.parts) {
    const x = trim + p.x, y = trim + p.y, g = sv('g', {'data-no': p.no});
    const r = sv('rect', {x, y, width: p.a, height: p.b, class: 'pt' + (opts.sel && opts.sel(p) ? ' on' : '')});
    if (opts.onPick) r.addEventListener('click', () => opts.onPick(p));
    r.append(sv('title', null, `${p.no} · ${p.row.name} · ${fmt(p.row.cL)} × ${fmt(p.row.cW)} mm${p.rot ? ' (döndürülmüş)' : ''}`));
    g.append(r);
    const mn = Math.min(p.a, p.b);

  /* ---------- ölçü çizgileri ---------- */
  updDims() {

  },
  placeLabels() {
    const box = $('#lbls'), w = this.ren.domElement.clientWidth, hh = this.ren.domElement.clientHeight;
    const P = v => { const q = v.clone().project(this.cam); return q.z > 1 ? null : [(q.x + 1) / 2 * w, (1 - q.y) / 2 * hh]; };

      /* dışa doğru birim vektör (kenardan ölçü çizgisine) */
      let nx = (d0[0] + d1[0] - e0[0] - e1[0]) / 2, ny = (d0[1] + d1[1] - e0[1] - e1[1]) / 2; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
      if (nl < 2) { nx = 0; ny = -1; }

      const x0 = X(e0, d0), x1 = X(e1, d1);
      out.push(`<g style="color:${col}">`,
        `<line class="de" x1="${f(e0[0])}" y1="${f(e0[1])}" x2="${f(e1[0])}" y2="${f(e1[1])}"/>`,
        `<line class="dx" x1="${f(e0[0] + nx * 3)}" y1="${f(e0[1] + ny * 3)}" x2="${f(x0[0])}" y2="${f(x0[1])}"/>`,
        `<line class="dx" x1="${f(e1[0] + nx * 3)}" y1="${f(e1[1] + ny * 3)}" x2="${f(x1[0])}" y2="${f(x1[1])}"/>`,
        `<line class="dl" x1="${f(d0[0])}" y1="${f(d0[1])}" x2="${f(d1[0])}" y2="${f(d1[1])}"/>`);
      if (len > 26) {
        const ux = (d1[0] - d0[0]) / len, uy = (d1[1] - d0[1]) / len, a = 10, s = 4.5;
        const tri = (px, py, dx, dy) => `<path class="da" d="M${f(px)} ${f(py)}L${f(px + dx * a - dy * s)} ${f(py + dy * a + dx * s)}L${f(px + dx * a + dy * s)} ${f(py + dy * a - dx * s)}Z"/>`;

    const els = [...box.querySelectorAll('.lbl')];
    while (els.length < labs.length) { const el = h('div', {class: 'lbl'}); box.append(el); els.push(el); }
    els.forEach((el, i) => {
      const q = labs[i]; if (!q) { el.hidden = true; return; }
      el.hidden = false; el.className = 'lbl ' + q.cls; if (el._h !== q.html) { el.innerHTML = q.html; el._h = q.html; }
      const bw = el.offsetWidth, bh = el.offsetHeight, gap = 8;
      const d = (q.nx || q.ny) ? Math.abs(q.nx) * bw / 2 + Math.abs(q.ny) * bh / 2 + gap : 0;
      const x = clamp(q.x + q.nx * d, bw / 2 + 4, w - bw / 2 - 4), y = clamp(q.y + q.ny * d, bh / 2 + 4, hh - bh / 2 - 4);

    });
  },

  /* ---------- fare / dokunma ---------- */
  pick(cx, cy) {
    const r = this.ren.domElement.getBoundingClientRect();
    const v = new this.T.Vector2((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1);

    return hit[0].object.userData.p.id;

  bindEvents(cv) {

  },
  pan(dx, dy) {
    const T = this.T, o = this.orb, el = this.ren.domElement, k = 2 * o.r * Math.tan(this.cam.fov * Math.PI / 360) / el.clientHeight;

  snapshot() { try { this.render(); return this.ren.domElement.toDataURL('image/png'); } catch (e) { return null; } },
};

/* ---------- 2B ön görünüş (liste simgeleri ve çıktı için) ---------- */
function frontSVG(c, R, opt = {}) {
  const mini = !!opt.mini, pad = mini ? 0 : Math.max(c.W, c.H) * .12;
  const vw = c.W + 2 * pad, vh = c.H + 2 * pad;
  const svg = sv('svg', {viewBox: `${-pad} ${-pad} ${vw} ${vh}`, class: opt.cls || '', preserveAspectRatio: 'xMidYMid meet'});
  const Y = y => c.H - y, sw = Math.max(c.W, c.H) / (mini ? 28 : 260);
  const rect = (b, st) => svg.append(sv('rect', Object.assign({x: b[0], y: Y(b[4]), width: b[3] - b[0], height: b[4] - b[1]}, st)));
  const body = R.parts.filter(p => ['side', 'top', 'bottom', 'rail', 'divider', 'sep', 'shelf', 'plinth'].includes(p.kind) && !(p.kind === 'rail' && p.id === 'rail-b'));
  const fronts = R.parts.filter(p => p.kind === 'door' || p.kind === 'dfront');
  if (mini) {
    rect([0, 0, 0, c.W, c.H, 0], {fill: 'none', stroke: 'currentColor', 'stroke-width': sw * 1.4, 'stroke-linejoin': 'round'});
    for (const p of fronts) { rect(p.box, {fill: 'none', stroke: 'currentColor', 'stroke-width': sw}); }
    if (!fronts.length) for (const p of body.filter(q => q.kind === 'shelf' || q.kind === 'divider')) rect(p.box, {fill: 'currentColor', stroke: 'none', opacity: .55});
    return svg;
  }
  if (opt.theme) svg.classList.add('pvw');
  for (const x of R.extras.filter(q => q.type === 'leg' && q.z > c.D / 2)) svg.append(sv('rect', {x: x.x - 16, y: Y(x.h), width: 32, height: x.h, class: 'pv-l', fill: '#333'}));
  for (const p of body) rect(p.box, {fill: '#e8e4dc', stroke: '#222', 'stroke-width': sw, class: 'pv-b'});
  for (const p of R.parts.filter(q => q.kind === 'dfb' && q.id.endsWith('-F'))) rect(p.box, {fill: 'none', stroke: '#888', 'stroke-width': sw * .7, 'stroke-dasharray': `${sw * 4} ${sw * 3}`, class: 'pv-x'});
  for (const x of R.extras.filter(q => q.type === 'rod')) svg.append(sv('line', {x1: x.x0, y1: Y(x.y), x2: x.x1, y2: Y(x.y), stroke: '#555', 'stroke-width': sw * 2.4, 'stroke-linecap': 'round', class: 'pv-r'}));
  for (const p of fronts) {
    const b = p.box;
    rect(b, {fill: 'none', stroke: '#1d4ed8', 'stroke-width': sw * 1.1, 'stroke-dasharray': opt.theme ? null : `${sw * 8} ${sw * 4}`, class: 'pv-f'});
    if (p.hinge) { const hx = p.hinge.side === 'L' ? b[0] : b[3], fxx = p.hinge.side === 'L' ? b[3] : b[0]; svg.append(sv('path', {d: `M${fxx} ${Y(b[4])} L${hx} ${Y((b[1] + b[4]) / 2)} L${fxx} ${Y(b[1])}`, fill: 'none', stroke: '#1d4ed8', 'stroke-width': sw * .6, opacity: .6, class: 'pv-h'})); }
    if (opt.theme) {
      const hl = p.hinge ? Math.min(160, (b[4] - b[1]) * .3) : Math.min(160, (b[3] - b[0]) * .4);
      if (p.hinge) { const xh = p.hinge.side === 'L' ? b[3] - 40 : b[0] + 40, ym = c.base === 'wall' ? b[1] + 70 + hl / 2 : (b[4] - b[1]) > 1100 ? clamp(1050, b[1] + 120, b[4] - 120) : b[4] - 70 - hl / 2; svg.append(sv('line', {x1: xh, y1: Y(ym - hl / 2), x2: xh, y2: Y(ym + hl / 2), class: 'pv-k', 'stroke-width': sw * 2.2, 'stroke-linecap': 'round'})); }
      else { const xm = (b[0] + b[3]) / 2, ym = (b[4] - b[1]) > 260 ? b[4] - 60 : (b[1] + b[4]) / 2; svg.append(sv('line', {x1: xm - hl / 2, y1: Y(ym), x2: xm + hl / 2, y2: Y(ym), class: 'pv-k', 'stroke-width': sw * 2.2, 'stroke-linecap': 'round'})); }
    }
  }
  /* ölçüler */
  const fs = Math.max(c.W, c.H) / 26, dl = (x1, y1, x2, y2, txt, vert) => {
    svg.append(sv('line', {x1, y1, x2, y2, stroke: '#c2410c', 'stroke-width': sw, class: 'pv-d'}));
    for (const [px, py] of [[x1, y1], [x2, y2]]) svg.append(sv('line', Object.assign(vert ? {x1: px - fs * .3, y1: py, x2: px + fs * .3, y2: py} : {x1: px, y1: py - fs * .3, x2: px, y2: py + fs * .3}, {stroke: '#c2410c', 'stroke-width': sw, class: 'pv-d'})));
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    svg.append(sv('text', vert ? {x: mx - fs * .35, y: my, 'font-size': fs, 'text-anchor': 'middle', transform: `rotate(-90 ${mx - fs * .35} ${my})`, fill: '#c2410c', 'font-family': 'Saira, system-ui, sans-serif', class: 'pv-t'} : {x: mx, y: my - fs * .3, 'font-size': fs, 'text-anchor': 'middle', fill: '#c2410c', 'font-family': 'Saira, system-ui, sans-serif', class: 'pv-t'}, txt));
  };
  dl(0, -pad * .45, c.W, -pad * .45, fmt(c.W));
  dl(-pad * .45, 0, -pad * .45, c.H, fmt(c.H), true);
  if (R.secs.length > 1) { let y = c.H + pad * .5; for (const s of R.secs) dl(s.sx, y, s.sx + s.sw, y, fmt(s.sw)); }
  return svg;
}

/* =====================================================================
   Kolay kullanım: genel bileşenler, bölme kartı, adım adım sihirbaz
   ===================================================================== */
const Wg = {
  step(label, val, onSet, min, max, o = {}) {
    const mk = d => h('button', {type: 'button', 'aria-label': d < 0 ? 'azalt' : 'artır', disabled: d < 0 ? val <= min : val >= max, onclick: () => { const x = clamp(val + d, min, max); if (x !== val) onSet(x); }}, d < 0 ? '−' : '+');
    return h('div', {class: 'lblrow'}, h('span', null, label), h('div', {class: 'step' + (o.big ? ' big' : '')}, mk(-1), h('b', null, o.fmt ? o.fmt(val) : val), mk(1)));
  },
  tiles(opts, cur, onPick, o = {}) {
    return h('div', {class: 'tiles' + (o.cls ? ' ' + o.cls : '')}, opts.map(([v, t, ic, desc, badge]) => h('button', {type: 'button', class: String(cur) === String(v) ? 'on' : '', onclick: () => onPick(v)},
      ic ? (typeof ic === 'string' ? pic(ic) : ic) : null, h('b', null, t), desc ? h('small', null, desc) : null, badge ? h('em', null, badge) : null)));
  },
  chips(opts, cur, onPick) {
    return h('div', {class: 'chips'}, opts.map(([v, t]) => h('button', {type: 'button', class: String(cur) === String(v) ? 'on' : '', onclick: () => onPick(v)}, t)));
  },
  num(label, val, onVal, o = {}) {
    const inp = h('input', {class: 'inp' + (o.big ? ' big' : ''), inputmode: 'decimal', autocomplete: 'off', enterkeyhint: 'next', value: (o.empty && !val) ? '' : fmt(val, 2), placeholder: o.ph || ''});
    const ok = x => isFinite(x) && x >= (o.min ?? 0) && x <= (o.max ?? 1e5);
    inp.addEventListener('input', () => {
      const raw = inp.value.trim();
      if (o.empty && raw === '') { inp.classList.remove('bad'); onVal(0, true); return; }
      const x = evalNum(raw);
      if (!ok(x)) { inp.classList.add('bad'); onVal(null, false); return; }
      inp.classList.remove('bad'); onVal(x, true);
    });
    inp.addEventListener('focus', () => setTimeout(() => inp.select(), 0));
    inp.addEventListener('change', () => { if (!inp.classList.contains('bad')) { const x = evalNum(inp.value); if (isFinite(x)) inp.value = fmt(x, 2); } });
    const lab = h('label', {class: 'fld'}, label ? h('span', null, label) : null, h('div', {class: 'inpw'}, inp, h('i', null, o.unit ?? 'mm')), o.hint ? h('small', null, o.hint) : null);
    lab.inp = inp;
    return lab;
  },
};
